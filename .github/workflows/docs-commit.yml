name: docs-commit
on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:
    branches: [main]
    paths: ['docs/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message (main push only)
        if: github.event_name == 'push'
        run: |
          MSG=$(git log -1 --format="%s")
          echo "Checking: $MSG"
          # Accept any non-ASCII character(s) at start (emoji) followed by conventional commits format
          if ! echo "$MSG" | grep -qP '^[^\x00-\x7F]+ [a-z]+\([a-z\-]+\): .+$'; then
            echo "ERROR: Commit must follow Gitmoji + Conventional Commits format:"
            echo "  <gitmoji> <type>(<scope>): <subject>"
            echo "  Example: 📝 docs(prompts): update git workflow instructions"
            exit 1
          fi
          # Check subject length (max 72 chars)
          SUBJECT=$(echo "$MSG" | head -c 72)
          if [ "$MSG" != "$SUBJECT" ] && [ "$(echo "$MSG" | head -c 73 | tail -c 1)" != "" ]; then
            echo "ERROR: Commit subject must be max 72 characters (got $(echo -n "$MSG" | wc -c))."
            exit 1
          fi

      - name: Secret scan on diff
        run: |
          git diff --cached --diff-filter=AM -- ':(exclude)*.test.*' ':(exclude)*.spec.*' 2>/dev/null | \
          grep -qE '(sk_live_|sk_test_|AIza|-----BEGIN PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY)' && \
          { echo "ERROR: Secrets detected in diff"; exit 1; } || echo "No secrets found"
