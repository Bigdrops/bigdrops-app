name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA). Defaults to the default branch."
        required: false
        default: ""

# Prevent concurrent builds on the same branch to avoid cache corruption
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ── 2. Compute build metadata ────────────────────────────────────────
      - name: Compute build metadata
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9]/-/g; s/-\+/-/g; s/^-//; s/-$//')
          if [ -z "$SANITIZED_BRANCH" ]; then
            SANITIZED_BRANCH="unknown"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "sanitized_branch=$SANITIZED_BRANCH" >> "$GITHUB_OUTPUT"

          echo "────────────── Build Metadata ──────────────"
          echo "Repository  : ${{ github.repository }}"
          echo "Branch      : $BRANCH"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Short SHA   : $SHORT_SHA"
          echo "Run Number  : ${{ github.run_number }}"
          echo "Actor       : ${{ github.actor }}"
          echo "Build Time  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "────────────────────────────────────────────"

      # ── 3. Set up Java 21 ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── 4. Set up Bun ────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── 5. Log tool versions (moved here) ──────────────────────────────
      - name: Log tool versions
        run: |
          echo "────────────── Tool Versions ───────────────"
          echo "Java        : $(java -version 2>&1 | head -1)"
          echo "Gradle      : (bundled with wrapper — see android/gradle/wrapper/gradle-wrapper.properties)"
          echo "Bun         : $(bun --version)"
          echo "Node        : $(node --version 2>/dev/null || echo 'N/A')"
          CAPACITOR_VERSION=$(grep '"@capacitor/core"' package.json 2>/dev/null | sed 's/.*: "//; s/".*//' || echo 'unknown')
          echo "Capacitor   : $CAPACITOR_VERSION"
          echo "────────────────────────────────────────────"

      # ── 6. Validate prerequisites (moved here) ──────────────────────────
      - name: Validate Android project exists
        run: |
          if [ ! -d "android" ]; then
            echo "::error::android/ directory not found. This workflow requires a Capacitor Android project."
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew not found. Gradle wrapper is missing."
            exit 1
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::android/gradle/wrapper/gradle-wrapper.properties not found."
            exit 1
          fi
          echo "✅ Android project structure validated."

      # ── 7. Cache Bun dependencies ────────────────────────────────────────
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # ── 8. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      # ── 9. Clean stale build artifacts ──────────────────────────────────
      - name: Clean stale build artifacts
        run: |
          rm -rf dist/
          rm -rf android/app/src/main/assets/public/
          echo "✅ Cleaned dist/ and android/app/src/main/assets/public/"

      # ── 10. Build web assets ─────────────────────────────────────────────
      - name: Build production web assets
        run: bun run build

      # ── 11. Verify Vite build output (new) ──────────────────────────────
      - name: Verify Vite build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html not found."
            exit 1
          fi
          if ! grep -q '\./assets/' dist/index.html; then
            echo "::error::index.html does not contain relative asset paths."
            exit 1
          fi
          echo "✅ Vite build verified."

      # ── 12. Sync Capacitor ───────────────────────────────────────────────
      - name: Sync Capacitor Android project
        run: npx cap sync android

      # ── 13. Verify Capacitor assets ──────────────────────────────────────
      - name: Verify Capacitor assets
        run: |
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "::error::android/app/src/main/assets/public/index.html not found after Capacitor sync."
            exit 1
          fi
          if [ ! -d "android/app/src/main/assets/public/assets" ]; then
            echo "::error::android/app/src/main/assets/public/assets/ directory not found after Capacitor sync."
            exit 1
          fi
          echo "✅ Capacitor assets verified:"
          ls -la android/app/src/main/assets/public/
          ls -la android/app/src/main/assets/public/assets/

      # ── 14. Make Gradle wrapper executable ───────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 15. Build Debug APK ─────────────────────────────────────────────
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 16. Locate and rename APK ───────────────────────────────────────
      - name: Locate and rename APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f -path "*/outputs/apk/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in android/outputs/. The build may have failed silently."
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)

          NEW_NAME="BIGDROPS-debug-${{ steps.meta.outputs.sanitized_branch }}-${{ steps.meta.outputs.short_sha }}-run${{ github.run_number }}.apk"
          NEW_PATH="$(dirname "$APK_PATH")/$NEW_NAME"
          mv "$APK_PATH" "$NEW_PATH"

          echo "apk_path=$NEW_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "✅ APK renamed: $NEW_NAME ($APK_SIZE)"

      # ── 17. Generate Build Summary (new) ────────────────────────────────
      - name: Generate Build Summary
        run: |
          {
            echo "# Android Debug Build"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Branch | ${{ steps.meta.outputs.branch }} |"
            echo "| Commit | ${{ steps.meta.outputs.short_sha }} |"
            echo "| Run | ${{ github.run_number }} |"
            echo "| APK | ${{ steps.find-apk.outputs.apk_name }} |"
            echo "| APK Size | ${{ steps.find-apk.outputs.apk_size }} |"
            echo "| Java | 21 |"
            echo "| Gradle | Wrapper |"
            echo "| Status | ✅ Success |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 18. Upload APK artifact ──────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BIGDROPS-debug-${{ steps.meta.outputs.sanitized_branch }}-run${{ github.run_number }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error