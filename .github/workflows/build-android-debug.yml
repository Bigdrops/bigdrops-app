name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA). Defaults to the default branch."
        required: false
        default: ""

# Prevent concurrent builds on the same branch to avoid cache corruption
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ── 2. Validate prerequisites ────────────────────────────────────────
      - name: Validate Android project exists
        run: |
          if [ ! -d "android" ]; then
            echo "::error::android/ directory not found. This workflow requires a Capacitor Android project."
            exit 1
          fi
          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew not found. Gradle wrapper is missing."
            exit 1
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::android/gradle/wrapper/gradle-wrapper.properties not found."
            exit 1
          fi
          echo "✅ Android project structure validated."

      # ── 3. Set up Java 21 ────────────────────────────────────────────────
      # Required by android/app/build.gradle: compileOptions JavaVersion.VERSION_21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ── 4. Set up Bun ────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── 5. Cache Bun dependencies ────────────────────────────────────────
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # ── 6. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      # ── 7. Build web assets ──────────────────────────────────────────────
      # Capacitor syncs the dist/ directory into the Android project
      - name: Build production web assets
        run: bun run build

      # ── 8. Sync Capacitor ────────────────────────────────────────────────
      - name: Sync Capacitor Android project
        run: npx cap sync android

      # ── 9. Make Gradle wrapper executable ────────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 10. Build Debug APK ──────────────────────────────────────────────
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 11. Locate APK output ────────────────────────────────────────────
      - name: Locate generated APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f -path "*/outputs/apk/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in android/outputs/. The build may have failed silently."
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "✅ APK located: $APK_PATH ($APK_SIZE)"

      # ── 12. Upload APK artifact ──────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bigdrops-debug-apk-${{ github.run_number }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
