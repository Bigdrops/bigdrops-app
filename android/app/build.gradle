apply plugin: 'com.android.application'

android {
    namespace = "com.bigdrops.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.bigdrops.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ponytail: env override for GitHub test releases only; local default stays 1.
        def requestedCode = System.getenv("BIGDROPS_VERSION_CODE")?.trim()
        versionCode (requestedCode?.isInteger() && requestedCode.toInteger() > 0 ? requestedCode.toInteger() : 1)
        versionName (System.getenv("BIGDROPS_VERSION_NAME")?.trim() ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // Stable BIGDROPS test-release identity. Credentials come only from
        // environment variables (GitHub Secrets in CI). Never hardcode here.
        bigdropsTestRelease {
            def storePath = System.getenv("BIGDROPS_KEYSTORE_FILE")?.trim()
            if (storePath) {
                storeFile file(storePath)
            }
            storePassword System.getenv("BIGDROPS_KEYSTORE_PASSWORD")
            keyAlias System.getenv("BIGDROPS_KEY_ALIAS")
            keyPassword System.getenv("BIGDROPS_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // ponytail: local builds without the keystore keep default unsigned
            // release behavior; CI sets BIGDROPS_KEYSTORE_FILE to sign.
            def storePath = System.getenv("BIGDROPS_KEYSTORE_FILE")?.trim()
            if (storePath && file(storePath).exists()) {
                signingConfig signingConfigs.bigdropsTestRelease
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$androidxSwipeRefreshLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.google.android.material:material:$materialVersion"

    implementation "androidx.window:window:$windowManagerVersion"
    implementation "androidx.window:window-java:$windowManagerVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

apply plugin: 'com.google.gms.google-services'