<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eeeae3"><title>BIGDROPS — Invoice editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--canvas:#eeeae3;--paper:#fffdfa;--ink:#20201f;--sub:#77746e;--line:#ded8cf;--soft:#f7f4ef;--rust:#b94f2e;--rust-soft:#f8e3da;--olive:#5d6d52;--olive-soft:#e7eddf;--amber:#a57019;--red:#b0433d;--mono:"DM Mono",monospace;--body:Manrope,sans-serif;--display:Syne,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}svg{width:18px;height:18px;stroke-width:1.8}.phone{width:min(100%,430px);min-height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(34,27,18,.14)}
    main{height:100dvh;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(105px + env(safe-area-inset-bottom));scrollbar-width:none}main::-webkit-scrollbar{display:none}.nav{height:44px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:0 -4px 9px}.nav h1{margin:0;font:800 14px var(--display);letter-spacing:-.06em;text-align:center}.icon{width:42px;height:42px;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;color:var(--ink)}.icon:hover{background:rgba(0,0,0,.04)}
    .identity{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.type{width:33px;height:33px;border:0;border-radius:10px;background:var(--rust-soft);color:var(--rust);display:grid;place-items:center}.type svg{width:16px}.identity b,.identity span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity b{font-size:12px;letter-spacing:-.03em}.identity span{margin-top:3px;color:var(--sub);font:500 9px var(--mono)}.identity .total{border:0;background:transparent;text-align:right}.total small{display:block;color:var(--sub);font-size:8px;letter-spacing:.08em;font-weight:800}.total strong{display:block;margin-top:3px;font:500 11px var(--mono);color:var(--rust)}
    .mode-strip{display:flex;gap:7px;margin:10px 0 15px;overflow:auto;scrollbar-width:none}.mode-strip button{display:flex;align-items:center;gap:5px;flex:0 0 auto;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:9px;font-weight:800;color:var(--sub)}.mode-strip button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.mode-strip svg{width:14px}
    .block{margin:16px 0}.cap{display:flex;align-items:center;justify-content:space-between;margin:0 3px 7px}.cap h2{margin:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.cap button{border:0;background:transparent;color:var(--rust);font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px}.cap svg{width:14px}.cell-box{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--paper)}
    .client{width:100%;display:grid;grid-template-columns:37px 1fr 17px;gap:10px;align-items:center;min-height:61px;padding:10px;text-align:left;border:0;background:transparent}.client.locked{background:#f4f1ec}.avatar{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:var(--olive-soft);color:var(--olive);font-size:11px;font-weight:800}.client small,.client b,.client em{display:block;font-style:normal}.client small{font-size:8px;color:var(--sub);text-transform:uppercase;letter-spacing:.09em;font-weight:800}.client b{margin:2px 0;font-size:11px}.client em{font-size:9px;color:var(--sub)}.client>svg{width:16px;color:var(--sub)}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}.info{padding:8px 10px;border-right:1px solid var(--line)}.info:last-child{border:0}.info b,.info small{display:block}.info b{font-size:9px}.info small{margin-top:2px;color:var(--sub);font:500 8px var(--mono)}.info small:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 4px 1px 0;background:var(--olive)}.info.warn small:before{background:var(--amber)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;margin:14px 0;background:#e8e3dc;border-radius:12px}.tabs button{height:32px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:9px;font-weight:800}.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(44,37,30,.12)}
    .item{border-bottom:1px solid var(--line)}.item:last-of-type{border-bottom:0}.item-main{display:grid;grid-template-columns:25px 1fr auto 15px;gap:8px;align-items:center;width:100%;min-height:62px;padding:9px 10px;border:0;background:transparent;text-align:left}.num{width:25px;height:25px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:500 9px var(--mono);color:var(--sub)}.item-copy{min-width:0}.item-copy b,.item-copy span{display:block}.item-copy b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;letter-spacing:-.02em}.item-copy span{margin-top:3px;color:var(--sub);font:500 8px var(--mono)}.amount{text-align:right}.amount b,.amount small{display:block}.amount b{font:500 10px var(--mono)}.amount small{margin-top:3px;color:var(--sub);font-size:8px}.item-main>svg{width:14px;color:var(--sub)}.item-tools{display:flex;align-items:center;gap:2px;padding:0 9px 7px 43px}.mini{height:25px;min-width:25px;padding:0 5px;border:0;border-radius:7px;background:var(--soft);color:var(--sub);display:grid;place-items:center;font-size:8px;font-weight:800}.mini svg{width:13px}.mini.danger{color:var(--red)}.group{display:grid;grid-template-columns:20px 1fr auto 26px;gap:7px;align-items:center;padding:9px 10px;background:var(--olive-soft);color:var(--olive);border-top:1px solid #d6dfcb}.group b{font-size:10px}.group span{font:500 9px var(--mono)}.group .mini{background:rgba(255,255,255,.55);color:var(--olive)}.add{width:100%;height:42px;border:0;border-top:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:800}.add svg{width:15px;color:var(--rust)}
    .summary{padding:10px 11px;border:1px solid #e5cbc0;border-radius:15px;background:#fffaf7}.sumline{display:flex;justify-content:space-between;min-height:22px;color:var(--sub);font-size:9px}.sumline b{color:var(--ink);font:500 9px var(--mono)}.sumline.minus{color:var(--red)}.sumline.minus b{color:var(--red)}.sumtotal{display:flex;justify-content:space-between;align-items:end;padding-top:9px;margin-top:5px;border-top:1px solid #eadbd2}.sumtotal small{display:block;color:var(--sub);font-size:8px;font-weight:800;letter-spacing:.08em}.sumtotal b{font:500 18px var(--mono);letter-spacing:-.08em;color:var(--rust)}.words{padding:8px 10px;margin:8px 0;border:1px dashed #cfcbc3;border-radius:10px;background:var(--soft);font-size:9px;color:var(--sub);font-style:italic}
    .row{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;min-height:55px;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.row:last-child{border:0}.row .r-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--soft);color:var(--olive)}.row.rust .r-icon{background:var(--rust-soft);color:var(--rust)}.row b,.row small{display:block}.row b{font-size:10px}.row small{margin-top:3px;color:var(--sub);font-size:8.5px}.row>svg{width:14px;color:var(--sub)}
    .dock{position:absolute;z-index:15;bottom:0;left:0;right:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 35%)}.dock-in{display:grid;grid-template-columns:41px 1fr 41px;gap:7px;padding:5px;border-radius:17px;background:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.23)}.dock button{height:41px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}.dock .primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--rust);font-size:10px;font-weight:800}.dock svg{width:16px}
    .overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:end;background:rgba(25,24,22,.46);backdrop-filter:blur(4px)}.sheet{width:100%;max-height:88dvh;overflow:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom));background:var(--paper);border-radius:23px 23px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18)}.grip{width:36px;height:4px;border-radius:99px;background:#d2cec7;margin:0 auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.sheet-head h3{margin:0;font:800 17px var(--display);letter-spacing:-.06em}.sheet-head button{width:38px;height:38px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center}.sheet-copy{margin:0 0 14px;color:var(--sub);font-size:10px;line-height:16px}.form{display:grid;gap:9px}.two{grid-template-columns:1fr 1fr;gap:8px}.three{grid-template-columns:1fr 1fr 1fr;gap:8px}.field label{display:block;margin:0 0 4px;color:var(--sub);font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.field input,.field textarea,.field select{width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:10px;outline:none}.field textarea{min-height:62px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rust);box-shadow:0 0 0 3px rgba(185,79,46,.1)}.mono{font-family:var(--mono)!important}.choice{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;width:100%;min-height:53px;padding:8px 9px;margin:7px 0;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.choice .cicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--olive-soft);color:var(--olive)}.choice b,.choice small{display:block}.choice b{font-size:10px}.choice small{margin-top:2px;font-size:8.5px;color:var(--sub)}.choice>svg{width:15px;color:var(--sub)}.switch{width:38px;height:23px;border:0;border-radius:20px;background:#d8d4cc;position:relative}.switch:after{content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:.2s var(--ease)}.switch.on{background:var(--olive)}.switch.on:after{transform:translateX(15px)}.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;margin:7px 0;background:var(--soft);border-radius:10px}.seg button{height:31px;border:0;border-radius:8px;background:transparent;font-size:9px;font-weight:800;color:var(--sub)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}.cta{width:100%;height:47px;margin-top:14px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}.cta.rust{background:var(--rust)}.cta.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.cta.danger{background:#fff6f5;border:1px solid #eed1cc;color:var(--red)}.list-field{display:grid;grid-template-columns:1fr 1.3fr 31px;gap:6px;margin-bottom:7px}.list-field input{min-height:36px;padding:7px;border:1px solid var(--line);border-radius:9px;font-size:9px}.list-field button{border:0;border-radius:9px;background:#fff4f2;color:var(--red);display:grid;place-items:center}.list-field svg{width:14px}.toast{position:absolute;z-index:50;left:50%;bottom:96px;transform:translate(-50%,14px);padding:9px 11px;border-radius:11px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;opacity:0;transition:.2s var(--ease);white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body><div class="phone"><main id="app"></main><div id="toast" class="toast"></div></div>
<script>
const I=n=>`<i data-lucide="${n}"></i>`;const uid=()=>Math.random().toString(36).slice(2,9);const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const state={tab:'items',sheet:null,active:null,mode:'create',collapsed:{notes:true,more:true},invoice:{type:'Invoice',title:'Quarterly equipment overhaul',number:'INV-2026-0142',po:'PO-3278',client:{id:'c1',name:'Adeyemi & Partners',person:'Ijeoma Adeyemi',initials:'A&'},issue:'2026-08-18',due:'2026-09-01',payment:'Net 14',customPayment:'Payment due within 14 days',headers:[{id:uid(),label:'Project',value:'Ikoyi Office Retrofit'}],items:[{id:uid(),description:'Molded case circuit breaker 125A',subDescription:'4 pole, adjustable thermal-magnetic trip unit',itemId:'catalog-mccb',qty:3,unit:'pcs',price:184000,make:'Schneider',partNo:'NSX160F',condition:'New',installRate:0,vatRate:7.5,discountRate:0,image:null,groupId:'g1',customData:{colour:'Black'}},{id:uid(),description:'Copper cable 4mm²',subDescription:'FR PVC insulated copper cable',itemId:'catalog-cable',qty:40,unit:'m',price:6800,make:'Nexans',partNo:'CAB-4MM',condition:'New',installRate:0,vatRate:7.5,discountRate:0,image:null,groupId:'g1',customData:{colour:'Copper'}}],groups:[{id:'g1',name:'Electrical materials',showSubtotal:true}],columns:{make:true,unit:true,partNo:true,condition:true,installRate:true,itemVat:true,itemDiscount:true,custom:true},charges:[{id:uid(),label:'Transportation',value:25000,withTax:false}],discount:0,discountType:'percent',discountTiming:'after',vat:7.5,wht:0,whtType:'percent',notes:'Thank you for the opportunity to support this project.',terms:'Payment is due within fourteen days of issue.',notesTitle:'Notes',termsTitle:'Terms & Conditions',additional:[{id:uid(),label:'Delivery',value:'7 working days'}],signatory:{id:'sig-1',name:'Nneka Okoro',role:'Operations Director'},links:[{id:uid(),label:'Project folder',url:'https://example.com/ikoyi'}],pdf:{showBankDetails:true,bankAccountId:'zenith-1',showFooter:false,showTagline:false,showBalanceDue:true,showAmountInWords:true,showVatPercentage:true,showWhtPercentage:true,showDiscountPercentage:true,compact:false}}};
function calc(){let raw=0,install=0;state.invoice.items.forEach(a=>{const base=a.qty*a.price;const disc=base*(a.discountRate||0)/100;a.line=base-disc;raw+=a.line;install+=Number(a.installRate||0)});const taxable=state.invoice.charges.filter(c=>c.withTax).reduce((s,c)=>s+Number(c.value||0),0);const post=state.invoice.charges.filter(c=>!c.withTax).reduce((s,c)=>s+Number(c.value||0),0);const disc=state.invoice.discountType==='percent'?raw*state.invoice.discount/100:state.invoice.discount;const pre=state.invoice.discountTiming==='before'?disc:0;const vat=(raw+taxable-pre)*state.invoice.vat/100;const after=state.invoice.discountTiming==='after'?disc:0;const wht=state.invoice.whtType==='percent'?(raw+taxable+vat-after)*state.invoice.wht/100:state.invoice.wht;return{raw,install,disc,vat,wht,charges:taxable+post,total:raw+taxable+post+install+vat-disc-wht}}
function words(n){return n?'Amount payable: '+money(n)+' only.':'Zero Naira only.'}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function by(id){return state.invoice.items.find(a=>a.id===id)}function active(){return by(state.active)||state.invoice.items[0]}
function render(){const x=state.invoice,t=calc();document.getElementById('app').innerHTML=`<header class="nav"><button class="icon" aria-label="Back" onclick="toast('Back to documents')">${I('chevron-left')}</button><h1>${x.type.toUpperCase()} EDITOR</h1><button class="icon" aria-label="Document actions" onclick="open('actions')">${I('ellipsis')}</button></header><section class="identity"><button class="type" onclick="open('type')" aria-label="Document type">${I(x.type==='Invoice'?'receipt-text':'file-text')}</button><div><b>${esc(x.title||'Untitled document')}</b><span>${esc(x.number)} · ${state.mode==='edit'?'RECORDED':'DRAFT'}</span></div><button class="total" onclick="open('terms')"><small>PAYABLE</small><strong>${money(t.total)}</strong></button></section><div class="mode-strip"><button class="primary" onclick="open('client')">${I(state.mode==='edit'?'lock-keyhole':'contact-round')}${state.mode==='edit'?'Identity locked':'Client'}</button><button onclick="open('import')">${I('file-input')} Import</button><button onclick="open('columns')">${I('table-properties')} Columns</button><button onclick="open('preview')">${I('eye')} Preview</button></div><div class="tabs"><button class="${state.tab==='items'?'on':''}" onclick="tab('items')">Items</button><button class="${state.tab==='document'?'on':''}" onclick="tab('document')">Document</button><button class="${state.tab==='output'?'on':''}" onclick="tab('output')">Output</button></div>${state.tab==='items'?itemsView(t):state.tab==='document'?documentView(t):outputView(t)}<footer class="dock"><div class="dock-in"><button aria-label="Preview" onclick="open('preview')">${I('eye')}</button><button class="primary" onclick="open('save')">${I('send')}${state.mode==='edit'?'Save changes':'Create invoice'}</button><button aria-label="Save draft" onclick="draft()">${I('save')}</button></div></footer>${state.sheet?sheet():''}`;lucide.createIcons({attrs:{'stroke-width':'1.8'}})}
function clientBlock(){const x=state.invoice;return `<div class="block"><div class="cap"><h2>Client</h2><button onclick="open('client')">${state.mode==='edit'?'Protected':'Change'} ${I(state.mode==='edit'?'lock-keyhole':'pencil')}</button></div><div class="cell-box"><button class="client ${state.mode==='edit'?'locked':''}" onclick="open('client')"><span class="avatar">${state.mode==='edit'?I('lock-keyhole'):esc(x.client.initials)}</span><span><small>${state.mode==='edit'?'Client identity':'Bill to'}</small><b>${esc(x.client.name)}</b><em>${esc(x.client.person)}</em></span>${I('chevron-right')}</button><div class="info-grid"><div class="info"><b>Payment</b><small>${esc(x.payment)}</small></div><div class="info warn"><b>Due ${new Date(x.due+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</b><small>${Math.max(0,Math.round((new Date(x.due)-new Date())/864e5))} days remaining</small></div></div></div></div>`}
function itemsView(t){const x=state.invoice;return `${clientBlock()}<div class="block"><div class="cap"><h2>Line items · ${x.items.length}</h2><button onclick="open('columns')">Fields ${I('sliders-horizontal')}</button></div><div class="cell-box">${x.items.map((a,i)=>item(a,i)).join('')}${x.groups.map(g=>group(g,t)).join('')}<button class="add" onclick="addItem()">${I('plus')} Add line item</button></div></div><div class="block"><div class="cap"><h2>Totals</h2><button onclick="open('terms')">Edit ${I('badge-percent')}</button></div>${summary(t)}</div>`}
function item(a,i){return `<article class="item"><button class="item-main" onclick="open('item','${a.id}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="item-copy"><b>${esc(a.description||'Item description')}</b><span>${a.qty} ${esc(a.unit)} × ${money(a.price)}</span></span><span class="amount"><b>${money(a.line)}</b><small>${esc(a.make||'No make')}</small></span>${I('chevron-right')}</button><div class="item-tools"><button class="mini" aria-label="Move up" onclick="moveItem('${a.id}',-1)">${I('arrow-up')}</button><button class="mini" aria-label="Move down" onclick="moveItem('${a.id}',1)">${I('arrow-down')}</button><button class="mini" onclick="open('item','${a.id}')">Edit</button><button class="mini danger" aria-label="Remove" onclick="removeItem('${a.id}')">${I('trash-2')}</button></div></article>`}
function group(g,t){const sum=state.invoice.items.filter(a=>a.groupId===g.id).reduce((s,a)=>s+a.line,0);return `<div class="group">${I('braces')}<b>${esc(g.name)}</b><span>${g.showSubtotal?money(sum):'Subtotal hidden'}</span><button class="mini" aria-label="Edit group" onclick="open('group','${g.id}')">${I('settings-2')}</button></div>`}
function summary(t){return `<div class="summary"><div class="sumline"><span>Subtotal</span><b>${money(t.raw)}</b></div>${t.disc?`<div class="sumline minus"><span>Discount</span><b>−${money(t.disc)}</b></div>`:''}${t.vat?`<div class="sumline"><span>VAT${state.invoice.pdf.showVatPercentage?' ('+state.invoice.vat+'%)':''}</span><b>${money(t.vat)}</b></div>`:''}${t.install?`<div class="sumline"><span>Install rate</span><b>${money(t.install)}</b></div>`:''}${t.charges?`<div class="sumline"><span>Extra charges</span><b>${money(t.charges)}</b></div>`:''}${t.wht?`<div class="sumline minus"><span>WHT${state.invoice.pdf.showWhtPercentage?' ('+state.invoice.wht+'%)':''}</span><b>−${money(t.wht)}</b></div>`:''}${state.invoice.pdf.showAmountInWords?`<div class="words">${words(t.total)}</div>`:''}<div class="sumtotal"><small>Grand total</small><b>${money(t.total)}</b></div></div>`}
function documentView(t){const x=state.invoice;return `${clientBlock()}<div class="block"><div class="cap"><h2>Document details</h2><button onclick="open('details')">Edit ${I('pencil')}</button></div><div class="cell-box"><button class="row" onclick="open('details')"><span class="r-icon">${I('file-pen-line')}</span><span><b>${esc(x.title)}</b><small>${esc(x.number)} · PO ${esc(x.po||'not set')}</small></span>${I('chevron-right')}</button><button class="row" onclick="open('dates')"><span class="r-icon">${I('calendar-days')}</span><span><b>${x.type==='Quotation'?'Quotation date':'Issue date'} · ${x.issue}</b><small>${x.type==='Quotation'?'Valid until':'Due date'} · ${x.due}</small></span>${I('chevron-right')}</button><button class="row" onclick="open('headers')"><span class="r-icon">${I('rows-3')}</span><span><b>${x.headers.length} header field${x.headers.length===1?'':'s'}</b><small>Project, PO, work order or reference</small></span>${I('chevron-right')}</button></div></div><div class="block"><div class="cap"><h2>Commercial terms</h2><button onclick="open('terms')">Edit ${I('badge-percent')}</button></div><div class="cell-box"><button class="row rust" onclick="open('terms')"><span class="r-icon">${I('receipt')}</span><span><b>VAT ${x.vat}% · Discount ${x.discount||'not set'}</b><small>Tax timing, withholding, additional charges</small></span>${I('chevron-right')}</button><button class="row" onclick="open('notes')"><span class="r-icon">${I('notebook-pen')}</span><span><b>Notes & terms</b><small>${x.notes?'Copy included':'No customer copy added'}</small></span>${I('chevron-right')}</button><button class="row" onclick="open('additional')"><span class="r-icon">${I('list-plus')}</span><span><b>Additional fields</b><small>${x.additional.length?'Included in PDF':'No fields'}</small></span>${I('chevron-right')}</button></div></div>${summary(t)}`}
function outputView(t){const x=state.invoice;return `<div class="block"><div class="cap"><h2>Output & sharing</h2><button onclick="open('preview')">Preview ${I('eye')}</button></div><div class="cell-box"><button class="row" onclick="open('attachments')"><span class="r-icon">${I('paperclip')}</span><span><b>Attachments</b><small>${x.links.length} reference link${x.links.length===1?'':'s'} · files available</small></span>${I('chevron-right')}</button><button class="row" onclick="open('signatory')"><span class="r-icon">${I('signature')}</span><span><b>${esc(x.signatory.name||'No signatory')}</b><small>Signing block for document PDF</small></span>${I('chevron-right')}</button><button class="row" onclick="open('links')"><span class="r-icon">${I('link-2')}</span><span><b>Reference links</b><small>${x.links.length} linked reference${x.links.length===1?'':'s'}</small></span>${I('chevron-right')}</button><button class="row rust" onclick="open('pdf')"><span class="r-icon">${I('file-output')}</span><span><b>PDF output settings</b><small>Bank, tagline, values and labels</small></span>${I('chevron-right')}</button></div></div><div class="block"><div class="cap"><h2>Recipient total</h2></div>${summary(t)}</div>`}
function head(title,copy=''){return `<div class="grip"></div><div class="sheet-head"><h3>${title}</h3><button aria-label="Close" onclick="close()">${I('x')}</button></div>${copy?`<p class="sheet-copy">${copy}</p>`:''}`}
function sheet(){let s=state.sheet,b='';if(s==='client')b=clientSheet();if(s==='type')b=typeSheet();if(s==='item')b=itemSheet();if(s==='details')b=detailsSheet();if(s==='dates')b=datesSheet();if(s==='headers')b=headersSheet();if(s==='terms')b=termsSheet();if(s==='notes')b=notesSheet();if(s==='additional')b=additionalSheet();if(s==='attachments')b=attachmentsSheet();if(s==='signatory')b=signatorySheet();if(s==='links')b=linksSheet();if(s==='pdf')b=pdfSheet();if(s==='bank')b=bankSheet();if(s==='columns')b=columnsSheet();if(s==='import')b=importSheet();if(s==='actions')b=actionsSheet();if(s==='group')b=groupSheet();if(s==='preview'||s==='save')b=sendSheet(s);return `<aside class="overlay" role="dialog" aria-modal="true"><section class="sheet">${b}</section></aside>`}
function clientSheet(){if(state.mode==='edit')return head('Client identity locked','This is a recorded document. Its client and invoice number are protected to preserve the audit trail.')+`<div class="choice"><span class="cicon">${I('shield-check')}</span><span><b>Duplicate as new document</b><small>Create a new draft with these exact items and terms.</small></span>${I('copy-plus')}</div><button class="cta rust" onclick="duplicate()">${I('copy-plus')} Duplicate as new</button>`;let c=[['Adeyemi & Partners','Ijeoma Adeyemi','A&'],['Uptown Facilities','Oma Okoro','UF'],['Wellspring Homes','Wale Peters','WH']];return head('Choose client','Set client_id and client_name together from the client selector.')+c.map((a,i)=>`<button class="choice" onclick="chooseClient(${i})"><span class="cicon">${a[2]}</span><span><b>${a[0]}</b><small>${a[1]}</small></span>${I('chevron-right')}</button>`).join('')}

function itemSheet(){const a=active(),c=state.invoice.columns;return head('Line item','Description, quantity and unit price are always available. Field visibility is controlled by Table Columns.')+`<div class="form"><div class="field"><label>Description</label><textarea oninput="iv('description',this.value)">${esc(a.description)}</textarea></div><button class="choice" onclick="suggest()"><span class="cicon">${I('sparkles')}</span><span><b>Item suggestions</b><small>${a.itemId?'Catalog item linked':'Select to auto-fill item ID, description and rate'}</small></span>${I('chevron-right')}</button><div class="three form"><div class="field"><label>Qty</label><input class="mono" inputmode="decimal" value="${a.qty}" oninput="iv('qty',this.value,1)"></div><div class="field"><label>Unit</label><input value="${esc(a.unit)}" oninput="iv('unit',this.value)"></div><div class="field"><label>Unit price</label><input class="mono" inputmode="decimal" value="${a.price}" oninput="iv('price',this.value,1)"></div></div>${c.make?`<div class="field"><label>Make</label><input value="${esc(a.make)}" oninput="iv('make',this.value)"></div>`:''}${c.partNo?`<div class="two form"><div class="field"><label>Part no.</label><input value="${esc(a.partNo)}" oninput="iv('partNo',this.value)"></div><div class="field"><label>Condition</label><input value="${esc(a.condition)}" oninput="iv('condition',this.value)"></div></div>`:''}${c.installRate?`<div class="field"><label>Install rate override</label><input class="mono" inputmode="decimal" value="${a.installRate}" oninput="iv('installRate',this.value,1)"></div>`:''}${c.itemVat||c.itemDiscount?`<div class="two form"><div class="field"><label>Item VAT %</label><input class="mono" inputmode="decimal" value="${a.vatRate||''}" oninput="iv('vatRate',this.value,1)"></div><div class="field"><label>Item discount %</label><input class="mono" inputmode="decimal" value="${a.discountRate||''}" oninput="iv('discountRate',this.value,1)"></div></div>`:''}<div class="field"><label>Sub-description</label><textarea oninput="iv('subDescription',this.value)">${esc(a.subDescription)}</textarea></div><div class="field"><label>Custom colour</label><input value="${esc(a.customData.colour||'')}" oninput="ivcustom('colour',this.value)"></div></div><div class="seg"><button class="${a.image?'on':''}" onclick="toggleImage()">${I('image')} ${a.image?'Photo attached':'Attach photo'}</button><button onclick="removeImage()">${I('image-minus')} Remove photo</button></div><button class="cta" onclick="close()">${I('check')} Apply line item</button><button class="cta danger" onclick="removeItem('${a.id}')">${I('trash-2')} Remove item</button>`}
function detailsSheet(){const x=state.invoice;const locked=state.mode==='edit';return head('Document details','Title and PO remain editable. Number is generated in create state and protected in edit state.')+`<div class="form"><div class="field"><label>Invoice title</label><input value="${esc(x.title)}" oninput="dv('title',this.value)"></div><div class="two form"><div class="field"><label>Invoice number</label><input class="mono" ${locked?'readonly':''} value="${esc(x.number)}" oninput="dv('number',this.value)"></div><div class="field"><label>PO number</label><input value="${esc(x.po)}" oninput="dv('po',this.value)"></div></div></div>${locked?`<button class="cta ghost" onclick="open('client')">${I('lock-keyhole')} Identity protection options</button>`:''}<button class="cta" onclick="close()">${I('check')} Done</button>`}
function datesSheet(){const x=state.invoice;return head('Dates & payment terms')+`<div class="form"><div class="two form"><div class="field"><label>${x.type==='Quotation'?'Quotation date':'Issue date'}</label><input type="date" value="${x.issue}" oninput="dv('issue',this.value)"></div><div class="field"><label>${x.type==='Quotation'?'Valid until':'Due date'}</label><input type="date" value="${x.due}" oninput="dv('due',this.value)"></div></div><div class="field"><label>Payment terms</label><select onchange="dv('payment',this.value)">${['Custom','Net 7','Net 14','Net 30','Due on Receipt'].map(v=>`<option ${x.payment===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Custom due / validity</label><input value="${esc(x.customPayment)}" oninput="dv('customPayment',this.value)"></div></div><button class="cta" onclick="close()">${I('calendar-check-2')} Confirm dates</button>`}
function headersSheet(){const x=state.invoice;return head('Header fields','Dynamic key-value fields appear beneath the document heading.')+x.headers.map((h,i)=>`<div class="list-field"><input placeholder="Label" value="${esc(h.label)}" oninput="hv(${i},'label',this.value)"><input placeholder="Value" value="${esc(h.value)}" oninput="hv(${i},'value',this.value)"><button onclick="xremove('headers',${i})">${I('x')}</button></div>`).join('')+`<button class="cta ghost" onclick="addPair('headers')">${I('plus')} Add header field</button><button class="cta" onclick="close()">${I('check')} Done</button>`}
function termsSheet(){const x=state.invoice;return head('Commercial terms','All amount rows are computed live from this sheet and the line item data.')+`<div class="form"><div class="two form"><div class="field"><label>VAT rate %</label><input class="mono" inputmode="decimal" value="${x.vat}" oninput="dv('vat',this.value,1)"></div><div class="field"><label>Discount</label><input class="mono" inputmode="decimal" value="${x.discount}" oninput="dv('discount',this.value,1)"></div></div><div class="seg"><button class="${x.discountType==='percent'?'on':''}" onclick="set('discountType','percent')">Percent</button><button class="${x.discountType==='fixed'?'on':''}" onclick="set('discountType','fixed')">Fixed amount</button></div><div class="seg"><button class="${x.discountTiming==='before'?'on':''}" onclick="set('discountTiming','before')">Before VAT</button><button class="${x.discountTiming==='after'?'on':''}" onclick="set('discountTiming','after')">After VAT</button></div><div class="two form"><div class="field"><label>WHT</label><input class="mono" inputmode="decimal" value="${x.wht}" oninput="dv('wht',this.value,1)"></div><div class="field"><label>WHT type</label><select onchange="dv('whtType',this.value)"><option ${x.whtType==='percent'?'selected':''} value="percent">Percent</option><option ${x.whtType==='fixed'?'selected':''} value="fixed">Fixed amount</option></select></div></div><div class="cap"><h2>Extra charges</h2><button onclick="addCharge()">${I('plus')} Add</button></div>${x.charges.map((c,i)=>`<div class="list-field"><input value="${esc(c.label)}" oninput="charge(${i},'label',this.value)"><input class="mono" value="${c.value}" oninput="charge(${i},'value',this.value,1)"><button onclick="xremove('charges',${i})">${I('x')}</button></div><button class="choice" onclick="charge(${i},'withTax',!${c.withTax});render()"><span class="cicon">${I('landmark')}</span><span><b>${c.withTax?'Taxable charge':'Post-tax charge'}</b><small>Tap to change VAT treatment</small></span><span class="switch ${c.withTax?'on':''}"></span></button>`).join('')}</div><button class="cta rust" onclick="close()">${I('badge-check')} Apply commercial terms</button>`}
function notesSheet(){const x=state.invoice;return head('Notes & terms','Rich text source fields are represented here as editable document copy.')+`<div class="form"><div class="field"><label>Notes title</label><input value="${esc(x.notesTitle)}" oninput="dv('notesTitle',this.value)"></div><div class="field"><label>${esc(x.notesTitle)}</label><textarea oninput="dv('notes',this.value)">${esc(x.notes)}</textarea></div><div class="field"><label>Terms title</label><input value="${esc(x.termsTitle)}" oninput="dv('termsTitle',this.value)"></div><div class="field"><label>${esc(x.termsTitle)}</label><textarea oninput="dv('terms',this.value)">${esc(x.terms)}</textarea></div></div><button class="cta" onclick="close()">${I('notebook-pen')} Save copy</button>`}
function additionalSheet(){const x=state.invoice;return head('Additional fields','These custom pairs render below totals in the PDF output.')+x.additional.map((h,i)=>`<div class="list-field"><input placeholder="Label" value="${esc(h.label)}" oninput="av(${i},'label',this.value)"><input placeholder="Value" value="${esc(h.value)}" oninput="av(${i},'value',this.value)"><button onclick="xremove('additional',${i})">${I('x')}</button></div>`).join('')+`<button class="cta ghost" onclick="addPair('additional')">${I('plus')} Add additional field</button><button class="cta" onclick="close()">${I('check')} Done</button>`}
function attachmentsSheet(){return head('Attachments','Reference files and links are managed separately from line items.')+`<div class="choice"><span class="cicon">${I('file-plus-2')}</span><span><b>Attach supporting file</b><small>Cloud upload trigger represented in this prototype.</small></span>${I('paperclip')}</div><button class="cta ghost" onclick="toast('File picker would open here')">${I('paperclip')} Attach a file</button><button class="cta" onclick="close()">${I('check')} Done</button>`}
function signatorySheet(){const s=state.invoice.signatory;return head('Signatory','Selected signatory ID is stored with the document custom fields.')+`<div class="form"><div class="field"><label>Selected name</label><input value="${esc(s.name)}" oninput="sv('name',this.value)"></div><div class="field"><label>Role</label><input value="${esc(s.role)}" oninput="sv('role',this.value)"></div></div><button class="cta" onclick="close()">${I('signature')} Save signatory</button>`}
function linksSheet(){const x=state.invoice;return head('Reference links','Store label and URL pairs in the attachment reference data.')+x.links.map((h,i)=>`<div class="list-field"><input placeholder="Label" value="${esc(h.label)}" oninput="lv(${i},'label',this.value)"><input placeholder="https://" value="${esc(h.url)}" oninput="lv(${i},'url',this.value)"><button onclick="xremove('links',${i})">${I('x')}</button></div>`).join('')+`<button class="cta ghost" onclick="addLink()">${I('plus')} Add link</button><button class="cta" onclick="close()">${I('check')} Done</button>`}
function pdfSheet(){const p=state.invoice.pdf;let opts=[['showBankDetails','Bank details'],['showTagline','Tagline'],['showFooter','Footer'],['showBalanceDue','Show balance due'],['showAmountInWords','Show amount in words'],['showVatPercentage','Show VAT % in brackets'],['showWhtPercentage','Show WHT % in brackets'],['showDiscountPercentage','Show discount % in brackets']];return head('PDF output settings','Recipient-facing document controls are kept here, separate from invoice data.')+`<button class="choice" onclick="open('bank')"><span class="cicon">${I('landmark')}</span><span><b>Zenith Bank · 1234567890</b><small>Selected account</small></span>${I('chevron-right')}</button>`+opts.map(o=>`<button class="choice" onclick="pdf('${o[0]}')"><span class="cicon">${I('file-output')}</span><span><b>${o[1]}</b><small>${p[o[0]]?'Included in PDF':'Not included'}</small></span><span class="switch ${p[o[0]]?'on':''}"></span></button>`).join('')+`<button class="cta" onclick="close()">${I('check')} Save output settings</button>`}
function bankSheet(){const selected=state.invoice.pdf.bankAccountId;let accounts=[['zenith-1','Zenith Bank','1234567890'],['gtb-1','Guaranty Trust Bank','0045528713'],['access-1','Access Bank','0213465780']];return head('Bank account','Choose the account to show if bank details are enabled in PDF output.')+accounts.map(a=>`<button class="choice" onclick="state.invoice.pdf.bankAccountId='${a[0]}';open('pdf')"><span class="cicon">${I('landmark')}</span><span><b>${a[1]}</b><small>${a[2]}</small></span>${selected===a[0]?I('circle-check'):I('chevron-right')}</button>`).join('')}
function columnsSheet(){const c=state.invoice.columns;let a={make:'Make',unit:'Unit',partNo:'Part number',condition:'Condition',installRate:'Install rate',itemVat:'Item VAT',itemDiscount:'Item discount',custom:'Custom fields'};return head('Table columns','Choose which conditional item fields appear inside each item editor.')+Object.entries(a).map(([k,v])=>`<button class="choice" onclick="col('${k}')"><span class="cicon">${I('columns-3')}</span><span><b>${v}</b><small>${c[k]?'Visible':'Hidden'}</small></span><span class="switch ${c[k]?'on':''}"></span></button>`).join('')+`<button class="cta ghost" onclick="resetColumns()">${I('rotate-ccw')} Reset defaults</button><button class="cta" onclick="close()">${I('check')} Done</button>`}
function importSheet(){return head('Import line items','Paste JSON to create editable line items, or use an item suggestion from any line.')+`<div class="field"><label>Items JSON</label><textarea id="json" placeholder='[{"description":"Cable","qty":2,"price":12000,"unit":"m"}]'></textarea></div><button class="cta rust" onclick="importJSON()">${I('file-down')} Import JSON</button><button class="cta ghost" onclick="catalog()">${I('package-plus')} Add catalog sample</button>`}

function sendSheet(s){const t=calc();return head(s==='save'?(state.mode==='edit'?'Save changes':'Create invoice'):'Recipient preview',s==='save'?'Save sets the document status to unpaid in the source workflow.':'Review the result before it leaves your workspace.')+`<div class="summary"><div class="sumline"><span>${esc(state.invoice.client.name)}</span><b>${esc(state.invoice.number)}</b></div><div class="sumtotal"><small>Recipient total</small><b>${money(t.total)}</b></div></div><button class="cta rust" onclick="commit()">${I(s==='save'?'save':'check-circle-2')} ${s==='save'?'Confirm save':'Looks good'}</button>`}
function open(s,id=null){state.sheet=s;if(id)state.active=id;render()}function close(){state.sheet=null;render()}function tab(t){state.tab=t;render()}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function set(k,v){state.invoice[k]=v;render()}function dv(k,v,n=0){state.invoice[k]=n?Number(v||0):v}function iv(k,v,n=0){active()[k]=n?Number(v||0):v}function ivcustom(k,v){active().customData[k]=v}function hv(i,k,v){state.invoice.headers[i][k]=v}function av(i,k,v){state.invoice.additional[i][k]=v}function lv(i,k,v){state.invoice.links[i][k]=v}function sv(k,v){state.invoice.signatory[k]=v}function gval(k,v){state.invoice.groups.find(g=>g.id===state.active)[k]=v}function charge(i,k,v,n=0){state.invoice.charges[i][k]=n?Number(v||0):v}function pdf(k){state.invoice.pdf[k]=!state.invoice.pdf[k];render()}function col(k){state.invoice.columns[k]=!state.invoice.columns[k];render()}function xremove(k,i){state.invoice[k].splice(i,1);render()}function addPair(k){state.invoice[k].push({id:uid(),label:'',value:''});render()}function addLink(){state.invoice.links.push({id:uid(),label:'',url:''});render()}function addCharge(){state.invoice.charges.push({id:uid(),label:'Additional charge',value:0,withTax:false});render()}
function chooseClient(i){let a=[['Adeyemi & Partners','Ijeoma Adeyemi','A&'],['Uptown Facilities','Oma Okoro','UF'],['Wellspring Homes','Wale Peters','WH']][i];state.invoice.client={id:'c'+i,name:a[0],person:a[1],initials:a[2]};close();toast('Client selected')}function duplicate(){state.mode='create';state.invoice.number='INV-2026-'+Math.floor(1000+Math.random()*8999);close();toast('Duplicated as a new draft')}function addItem(){let a={id:uid(),description:'New line item',subDescription:'',itemId:null,qty:1,unit:'pcs',price:0,make:'',partNo:'',condition:'New',installRate:0,vatRate:null,discountRate:null,image:null,groupId:null,customData:{}};state.invoice.items.push(a);open('item',a.id)}function removeItem(id){state.invoice.items=state.invoice.items.filter(a=>a.id!==id);close();toast('Line item removed')}function moveItem(id,d){let a=state.invoice.items,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;let moved=a.splice(i,1)[0];a.splice(j,0,moved);render()}function addGroup(){let g={id:uid(),name:'New group',showSubtotal:true};state.invoice.groups.push(g);state.active=g.id;open('group')}function clearItems(){if(confirm('Clear all line items?')){state.invoice.items=[];close();toast('Line items cleared')}}function mergeQty(){toast('Quantity and unit will merge in PDF output')}function toggleImage(){active().image='uploaded-image';render()}function removeImage(){active().image=null;render()}function resetColumns(){Object.keys(state.invoice.columns).forEach(k=>state.invoice.columns[k]=true);render()}function suggest(){let a=active();Object.assign(a,{itemId:'catalog-led',description:'LED panel light 36W',subDescription:'Surface-mounted LED light fitting',qty:12,unit:'pcs',price:23500,make:'Philips',partNo:'LED-36W',condition:'New'});render();toast('Catalog item applied')}function catalog(){state.invoice.items.push({id:uid(),description:'LED panel light 36W',subDescription:'Surface mounted',itemId:'catalog-led',qty:12,unit:'pcs',price:23500,make:'Philips',partNo:'LED-36W',condition:'New',installRate:0,vatRate:7.5,discountRate:0,image:null,groupId:null,customData:{}});close();toast('Catalog item added')}function importJSON(){try{let xs=JSON.parse(document.getElementById('json').value);if(!Array.isArray(xs))throw 0;xs.forEach(a=>state.invoice.items.push({id:uid(),description:a.description||a.name||'Imported item',subDescription:a.subDescription||'',itemId:null,qty:Number(a.qty)||1,unit:a.unit||'pcs',price:Number(a.price||a.rate)||0,make:a.make||'',partNo:a.partNo||'',condition:a.condition||'New',installRate:Number(a.installRate)||0,vatRate:a.vatRate||null,discountRate:a.discountRate||null,image:null,groupId:null,customData:a.customData||{}}));close();toast(xs.length+' items imported')}catch(e){toast('Use a valid JSON array')}}function draft(){toast('Draft saved locally')}function commit(){close();toast(state.mode==='edit'?'Changes saved':'Invoice created successfully')}
render();
