<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIGDROPS · ERP Mobile Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf1f5;
  --canvas:#f6f8fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#f1f5f9;
  --text:#0f172a;
  --muted:#64748b;
  --line:#dbe3ec;
  --line-strong:#c9d3df;
  --brand:#1f4ed8;
  --brand-soft:#e9f0ff;
  --success:#177245;
  --success-soft:#eaf7ef;
  --warn:#9a5a10;
  --warn-soft:#fff6e5;
  --danger:#b42318;
  --danger-soft:#fef0ef;
  --info:#0f6cbd;
  --info-soft:#eaf4ff;
  --violet:#6941c6;
  --violet-soft:#f3efff;
  --teal:#0f766e;
  --teal-soft:#e9fbf8;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.05);
  --shadow-2:0 8px 30px rgba(15,23,42,.10),0 2px 8px rgba(15,23,42,.08);
  --sheet-shadow:0 -16px 44px rgba(15,23,42,.18),0 -4px 12px rgba(15,23,42,.08);
  --radius-xs:10px;
  --radius-sm:14px;
  --radius-md:18px;
  --radius-lg:22px;
  --radius-xl:28px;
  --pill:999px;
  --phone-bg:linear-gradient(180deg,#f8fbfe 0%,#f4f7fb 100%);
}

[data-theme="dark"]{
  --bg:#0b1120;
  --canvas:#111827;
  --surface:#172133;
  --surface-2:#1d2940;
  --surface-3:#25314b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:#28354d;
  --line-strong:#33445f;
  --brand:#7ea4ff;
  --brand-soft:#1b2950;
  --success:#5fd38d;
  --success-soft:#173726;
  --warn:#f0c15b;
  --warn-soft:#463315;
  --danger:#ff8d87;
  --danger-soft:#4a1f24;
  --info:#7dc6ff;
  --info-soft:#133552;
  --violet:#b79cff;
  --violet-soft:#312254;
  --teal:#61d8ce;
  --teal-soft:#173a3a;
  --shadow-1:0 1px 2px rgba(0,0,0,.2),0 12px 28px rgba(0,0,0,.22);
  --shadow-2:0 12px 34px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.20);
  --sheet-shadow:0 -16px 44px rgba(0,0,0,.45),0 -4px 12px rgba(0,0,0,.28);
  --phone-bg:linear-gradient(180deg,#141d2d 0%,#0f1728 100%);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit}
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;
  height:58px;padding:0 20px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px);border-bottom:1px solid #d6dee8;
  display:flex;align-items:center;justify-content:space-between;
}
[data-theme="dark"] .topbar{background:rgba(11,17,32,.82);border-bottom-color:#1f2b40}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(160deg,var(--brand),#2b6ff7);display:grid;place-items:center;color:white;box-shadow:var(--shadow-1)}
.brand-mark svg{width:15px;height:15px}
.brand-name{font-size:14px;font-weight:800;letter-spacing:-.02em}
.brand-meta{font-size:11px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px}
.ctrl{
  height:34px;padding:0 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);box-shadow:var(--shadow-1);
  font-size:12px;font-weight:700
}
.ctrl.primary{background:var(--brand);color:white;border-color:transparent}
.strip-wrap{
  padding:10px 18px 0;overflow:auto;background:transparent;scrollbar-width:none;
}
.strip-wrap::-webkit-scrollbar{display:none}
.strip{display:flex;gap:8px;width:max-content;padding-bottom:4px}
.tab{
  height:34px;padding:0 14px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer
}
.tab.active{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:var(--shadow-1)}
.stage{padding:24px 20px 42px;display:flex;justify-content:center}
.phone{
  width:390px;min-height:844px;border-radius:42px;position:relative;overflow:hidden;
  background:var(--phone-bg);border:1px solid rgba(255,255,255,.55);box-shadow:0 30px 80px rgba(15,23,42,.22), inset 0 1px 0 rgba(255,255,255,.3)
}
[data-theme="dark"] .phone{border-color:rgba(255,255,255,.06);box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.02)}
.phone::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:132px;height:32px;background:var(--surface);border:1px solid var(--line);border-top:none;
  border-radius:0 0 18px 18px;z-index:12;
}
.screen{min-height:844px;padding:58px 14px 110px;position:relative}
.compact-screen{min-height:320px;padding:58px 14px 96px;position:relative}
.hero{
  position:sticky;top:0;z-index:4;margin:-4px -14px 0;padding:10px 14px 12px;
  background:linear-gradient(180deg,rgba(246,248,251,.96) 0%, rgba(246,248,251,.88) 78%, rgba(246,248,251,0) 100%);
  backdrop-filter:blur(16px)
}
[data-theme="dark"] .hero{background:linear-gradient(180deg,rgba(17,24,39,.96) 0%, rgba(17,24,39,.9) 78%, rgba(17,24,39,0) 100%)}
.top-card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:var(--shadow-1)
}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.icon-btn,.ghost-btn{
  width:38px;height:38px;border-radius:13px;border:1px solid var(--line);
  display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-1);color:var(--text)
}
.ghost-btn{background:var(--surface-2);border-color:transparent;box-shadow:none}
.icon-btn svg,.ghost-btn svg,.nav-item svg,.metric-icon svg,.tile-icon svg,.mini-icon svg,.action-icon svg,.lead svg,.menu-ic svg,.searchbar svg,.filter-pill svg,.select svg,.drawer-close svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.title{font-size:19px;line-height:1.15;letter-spacing:-.03em;font-weight:800;margin-top:2px}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.searchbar{
  margin-top:10px;height:46px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:var(--shadow-1);color:var(--muted)
}
.searchbar .fill{flex:1;font-size:13px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.filter-cell .lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.select{
  height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow-1)
}
.filter-pill{
  margin-top:8px;height:34px;border-radius:12px;border:1px dashed var(--line-strong);background:transparent;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)
}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link-mini{font-size:12px;color:var(--brand);font-weight:700}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow-1)
}
.metric-icon,.tile-icon,.mini-icon,.lead,.action-icon{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center
}
.metric-value{font-size:24px;font-weight:800;letter-spacing:-.05em;margin-top:14px}
.metric-label{font-size:12px;color:var(--muted);margin-top:3px}
.metric-foot{font-size:11px;color:var(--muted);margin-top:5px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow-1)
}
.tile-icon{width:40px;height:40px;border-radius:14px}
.tile-name{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:12px}
.tile-hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.stack{display:flex;flex-direction:column;gap:10px}
.notice{
  display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)
}
.notice-dot{width:8px;height:8px;border-radius:999px;margin-top:6px;flex:none}
.notice-title{font-size:13px;font-weight:700;line-height:1.3}
.notice-sub{font-size:12px;color:var(--muted);margin-top:3px}
.badge{
  display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 9px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:1px solid
}
.b-blue{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb, var(--brand) 22%, transparent)}
.b-green{background:var(--success-soft);color:var(--success);border-color:color-mix(in srgb, var(--success) 22%, transparent)}
.b-amber{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb, var(--warn) 22%, transparent)}
.b-red{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb, var(--danger) 24%, transparent)}
.b-violet{background:var(--violet-soft);color:var(--violet);border-color:color-mix(in srgb, var(--violet) 24%, transparent)}
.b-teal{background:var(--teal-soft);color:var(--teal);border-color:color-mix(in srgb, var(--teal) 24%, transparent)}
.b-muted{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.list-shell,.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-1)
}
.row-item{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;
  padding:14px 14px;border-top:1px solid var(--line)
}
.row-item:first-child{border-top:none}
.row-title{font-size:14px;font-weight:700;letter-spacing:-.02em}
.row-sub{font-size:12px;color:var(--muted);margin-top:4px}
.amount{font-size:15px;font-weight:800;letter-spacing:-.03em}
.kebab{
  width:32px;height:32px;border-radius:11px;border:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)
}
.kebab svg{width:16px;height:16px;stroke:currentColor;stroke-width:2}
.load-wrap{display:flex;justify-content:center;margin-top:10px}
.load-btn{
  height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);
  color:var(--text);font-size:12px;font-weight:700
}
.entity{
  padding:14px;position:relative;overflow:hidden
}
.entity + .entity{margin-top:10px}
.entity-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.lead{width:42px;height:42px;border-radius:14px;font-weight:800;font-size:12px}
.entity-kicker{font-size:10px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
.entity-title{font-size:15px;font-weight:800;letter-spacing:-.025em;margin-top:2px}
.entity-sub{font-size:12px;color:var(--muted);margin-top:3px}
.entity-meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:11px}
.entity-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.progress{
  height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:10px
}
.progress > span{display:block;height:100%;border-radius:999px}
.side-accent{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:20px 0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bottom-nav{
  position:absolute;left:0;right:0;bottom:0;height:86px;padding:8px 4px 18px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);border-top:1px solid var(--line)
}
[data-theme="dark"] .bottom-nav{background:rgba(23,33,51,.92)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10px;font-weight:700}
.nav-chip{width:46px;height:34px;border-radius:12px;display:grid;place-items:center}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-chip{background:var(--surface-3)}
.fab{
  position:absolute;right:18px;bottom:94px;width:54px;height:54px;border:none;border-radius:18px;
  background:var(--brand);color:white;display:grid;place-items:center;box-shadow:var(--shadow-2);z-index:5
}
.fab svg{width:22px;height:22px;stroke:white;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.scrim{
  position:absolute;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(3px)
}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  border-radius:26px 26px 0 0;box-shadow:var(--sheet-shadow);padding-bottom:18px
}
.grabber{width:38px;height:4px;border-radius:999px;background:var(--line-strong);margin:10px auto 0}
.sheet-head{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sheet-sub{font-size:12px;color:var(--muted);margin-top:4px}
.sheet-body{padding:12px 14px 0}
.action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.action-square{
  min-height:82px;border-radius:16px;border:1px solid var(--line);padding:10px 8px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;
  font-size:11px;font-weight:700;color:var(--text)
}
.action-square .mini-icon{width:30px;height:30px;border-radius:11px}
.danger-row{
  margin-top:10px;height:48px;border-radius:15px;border:1px solid color-mix(in srgb,var(--danger) 25%, transparent);
  background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800
}
.action-list{display:flex;flex-direction:column;gap:7px}
.action-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:16px;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1)
}
.action-row .left{display:flex;align-items:center;gap:11px;min-width:0}
.action-icon{width:38px;height:38px;border-radius:13px}
.action-label{font-size:14px;font-weight:700}
.action-sub{font-size:12px;color:var(--muted);margin-top:3px}
.chev{color:var(--muted);font-size:18px}
.action-row.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 26%, transparent)}
.drawer{
  position:absolute;top:0;left:0;bottom:0;width:286px;background:var(--surface);border-right:1px solid var(--line);
  border-radius:0 26px 26px 0;box-shadow:22px 0 50px rgba(15,23,42,.18);overflow:hidden
}
[data-theme="dark"] .drawer{box-shadow:22px 0 50px rgba(0,0,0,.4)}
.drawer-head{padding:18px 14px 12px;border-bottom:1px solid var(--line)}
.workspace{
  background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:10px 11px;display:flex;align-items:center;gap:10px;margin-top:14px
}
.workspace-badge{width:28px;height:28px;border-radius:999px;background:var(--brand);color:white;display:grid;place-items:center;font-size:11px;font-weight:800}
.drawer-close{width:30px;height:30px;border-radius:10px;border:none;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.drawer-body{padding:10px;display:flex;flex-direction:column;gap:4px}
.drawer-label{padding:10px 8px 4px;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;font-size:13px;font-weight:700;color:var(--text)
}
.menu-item.active{background:var(--surface-3);border:1px solid var(--line)}
.menu-item.secondary{color:var(--brand);background:var(--brand-soft)}
.menu-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.menu-item.active .menu-ic{background:var(--surface)}
.menu-sub{padding-left:18px;display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.theme-note{
  margin-top:14px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:12px 14px;
  font-size:12px;color:var(--muted);line-height:1.45
}
.hidden{display:none}
.center-note{min-height:120px;background:var(--surface-2);border:1px dashed var(--line);border-radius:18px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.small-muted{font-size:12px;color:var(--muted)}
</style>
</head>
<body data-theme="light">
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.3" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="2" y="9" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="9" y="9" width="5" height="5" rx="1.3" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="brand-name">BIGDROPS</div>
        <div class="brand-meta">ERP Mobile redesign handoff</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="ctrl" id="prevBtn">← Prev</button>
      <button class="ctrl" id="themeBtn">Theme: Light</button>
      <button class="ctrl primary" id="nextBtn">Next →</button>
    </div>
  </header>

  <div class="strip-wrap"><div class="strip" id="strip"></div></div>
  <div class="stage"><div id="mount"></div></div>
</div>

<script>
const i = {
menu:`<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
search:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"/></svg>`,
filter:`<svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`,
chevDown:`<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`,
home:`<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9.8V20h14V9.8"/><path d="M9 20v-6h6v6"/></svg>`,
grid:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
receipt:`<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5-2 1.5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>`,

  <div class="bottom-nav">
    ${[

        <div>${l}</div>

const heroCard = (section,title,sub,opts={}) => `
  <div class="hero">
    <div class="top-card">

        <div class="row g10">

        </div>
      </div>
      ${opts.search ? `<div class="searchbar">${i.search}<div class="fill">${opts.search}</div>${i.filter}</div>`:''}
      ${opts.filters || ''}

  </div>`;

const select = label => `<div class="select"><span>${label}</span>${i.chevDown}</div>`;

const order = Object.keys(screens);
let index = 0;
const mount = document.getElementById('mount');
const strip = document.getElementById('strip');
const themeBtn = document.getElementById('themeBtn');
const themes = ['light','dark'];
let themeIndex = 0;

function renderStrip(){
  strip.innerHTML = order.map((k,idx)=>`
    <button class="tab ${idx===index?'active':''}" onclick="go(${idx})">${screens[k].label}</button>
  `).join('');
}
function render(){
  mount.innerHTML = screens[order[index]].html;
  renderStrip();
}
function go(i){
  index = (i + order.length) % order.length;
  render();
}
document.getElementById('prevBtn').onclick = ()=>go(index-1);
document.getElementById('nextBtn').onclick = ()=>go(index+1);
themeBtn.onclick = ()=>{
  themeIndex = (themeIndex + 1) % themes.length;
  document.body.setAttribute('data-theme', themes[themeIndex]);
  themeBtn.textContent = `Theme: ${themes[themeIndex][0].toUpperCase()+themes[themeIndex].slice(1)}`;
};
render();
window.go = go;
</script>
</body>
</html>
