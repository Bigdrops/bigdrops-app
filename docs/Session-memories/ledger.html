<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3D;
    --paper:#EDE7DA;
    --paper-raised:#F6F2E8;
    --brass:#A9762F;
    --brass-dim:#C99B54;
    --rule:#D9D0BC;
    --green:#3F6F52;
    --rust:#A44A3F;
    --muted:#6B6252;
    --shadow: 0 1px 0 rgba(27,42,61,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 18px 90px;
  }
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  .masthead h1{
    font-family:'Spectral',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .sub{
    font-size:12px;
    color:var(--muted);
    text-align:right;
    line-height:1.4;
  }

  .hero{
    background:var(--ink);
    color:var(--paper);
    border-radius:2px;
    padding:22px 20px;
    margin-bottom:16px;
  }
  .hero .label{
    font-size:12.5px;
    color:var(--brass-dim);
    margin-bottom:6px;
  }
  .hero .figure{
    font-family:'Spectral',serif;
    font-size:40px;
    font-weight:500;
    line-height:1.1;
  }
  .hero .figure sup{font-size:20px; opacity:0.75; margin-right:2px;}

  .summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:26px;
  }
  .stat{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    padding:13px 14px;
    border-radius:2px;
  }
  .stat .label{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .stat .value{
    font-family:'Spectral',serif;
    font-size:20px;
    font-weight:500;
  }
  .stat.owed .value{color:var(--brass);}

  .section-title{
    font-size:12.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin:0 0 10px 2px;
  }

  .entries{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .entry{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:14px 15px;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .entry-client{
    font-family:'Spectral',serif;
    font-size:17px;
    font-weight:500;
  }
  .entry-date{
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .entry-profit{
    font-family:'Spectral',serif;
    font-size:17px;
    text-align:right;
  }
  .entry-profit.pos{color:var(--green);}
  .entry-profit.neg{color:var(--rust);}
  .entry-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    font-size:12px;
    border-top:1px solid var(--rule);
    padding-top:10px;
  }
  .entry-grid div span{
    display:block;
    color:var(--muted);
    font-size:10.5px;
    margin-bottom:2px;
  }
  .entry-actions{
    display:flex;
    gap:14px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--rule);
  }
  .tag-btn{
    font-size:11.5px;
    padding:4px 9px;
    border-radius:20px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .tag-btn.on{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }
  .tag-btn.on.commission{
    background:var(--brass);
    border-color:var(--brass);
  }
  .del-btn{
    margin-left:auto;
    background:none;
    border:none;
    color:var(--muted);
    font-size:11.5px;
    cursor:pointer;
    text-decoration:underline;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:14px;
    border:1px dashed var(--rule);
    border-radius:2px;
  }

  .fab{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:min(524px, calc(100% - 36px));
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(27,42,61,0.28);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(27,42,61,0.4);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:560px;
    border-radius:14px 14px 0 0;
    padding:22px 20px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:'Spectral',serif;
    font-weight:500;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--rule);
    border-radius:3px;
    font-size:15px;
    font-family:'Inter',sans-serif;
    background:var(--paper-raised);
    color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--brass); outline-offset:0;}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .live-calc{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:12px 14px;
    margin:6px 0 18px;
    font-size:13px;
  }
  .live-calc div{display:flex; justify-content:space-between; padding:3px 0;}
  .live-calc .final{
    border-top:1px solid var(--rule);
    margin-top:4px;
    padding-top:7px;
    font-weight:600;
  }
  .sheet-actions{display:flex; gap:10px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:3px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    border:none;
    font-family:'Inter',sans-serif;
  }
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.ghost{background:transparent; border:1px solid var(--rule); color:var(--muted);}
  .loading{text-align:center; padding:60px 0; color:var(--muted); font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Ledger</h1>
    <div class="sub">Goods supply<br>10% commission on RFQ deals</div>
  </div>

  <div class="hero">
    <div class="label">Net profit, all deals</div>
    <div class="figure" id="heroProfit"><sup>₦</sup>0</div>
  </div>

  <div class="summary-row">
    <div class="stat">
      <div class="label">Invoiced</div>
      <div class="value" id="statInvoiced">₦0</div>
    </div>
    <div class="stat owed">
      <div class="label">Commission owed</div>
      <div class="value" id="statCommission">₦0</div>
    </div>
  </div>

  <div class="section-title">Deals</div>
  <div class="entries" id="entries">
    <div class="loading">Loading…</div>
  </div>
</div>

<button class="fab" id="openAdd">+ Add deal</button>

<div class="overlay hidden" id="overlay">
  <div class="sheet">
    <h2>New deal</h2>
    <div class="field">
      <label for="fClient">Client name</label>
      <input id="fClient" type="text" placeholder="e.g. Delta Energy Ltd">
    </div>
    <div class="field">
      <label for="fDate">RFQ / deal date</label>
      <input id="fDate" type="date">
    </div>
    <div class="field">
      <label for="fInvoice">Invoice value (₦)</label>
      <input id="fInvoice" type="number" inputmode="decimal" placeholder="0">
    </div>
    <div class="two-col">
      <div class="field">
        <label for="fCP">Cost price (₦)</label>
        <input id="fCP" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label for="fExpenses">Other expenses (₦)</label>
        <input id="fExpenses" type="number" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label for="fRate">Commission rate (%)</label>
      <input id="fRate" type="number" inputmode="decimal" value="10">
    </div>

    <div class="live-calc" id="liveCalc">
      <div><span>Commission (his cut)</span><span id="calcCommission">₦0</span></div>
      <div><span>CP + expenses</span><span id="calcCosts">₦0</span></div>
      <div class="final"><span>Your profit</span><span id="calcProfit">₦0</span></div>
    </div>

    <div class="sheet-actions">
      <button class="btn ghost" id="cancelAdd">Cancel</button>
      <button class="btn primary" id="saveAdd">Save deal</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'deals-v1';
let deals = [];
let storageOk = true;

function fmt(n){
  n = Math.round(n || 0);
  return '₦' + n.toLocaleString('en-NG');
}

function computed(d){
  const rate = (d.rate ?? 10) / 100;
  const commission = (d.invoice || 0) * rate;
  const costs = (d.cp || 0) + (d.expenses || 0);
  const profit = (d.invoice || 0) - costs - commission;
  return {commission, costs, profit};
}

async function loadDeals(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    deals = res ? JSON.parse(res.value) : [];
  }catch(e){
    deals = [];
  }
  render();
}

async function persist(){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(deals), false);
    if(!result){ storageOk = false; }
  }catch(e){
    storageOk = false;
  }
}

function render(){
  const container = document.getElementById('entries');
  let totalInvoiced = 0, totalCommission = 0, totalProfit = 0, commissionOwed = 0;

  const sorted = [...deals].sort((a,b) => (b.date||'').localeCompare(a.date||''));

  if(sorted.length === 0){
    container.innerHTML = '<div class="empty">No deals yet. Add the first one his RFQ brought in.</div>';
  } else {
    container.innerHTML = sorted.map(d => {
      const c = computed(d);
      totalInvoiced += d.invoice || 0;
      totalCommission += c.commission;
      totalProfit += c.profit;
      if(!d.commissionPaid) commissionOwed += c.commission;

      const profitClass = c.profit >= 0 ? 'pos' : 'neg';
      const dateLabel = d.date ? new Date(d.date + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'No date';

      return `
        <div class="entry" data-id="${d.id}">
          <div class="entry-top">
            <div>
              <div class="entry-client">${escapeHtml(d.client || 'Unnamed client')}</div>
              <div class="entry-date">${dateLabel}</div>
            </div>
            <div class="entry-profit ${profitClass}">${fmt(c.profit)}</div>
          </div>
          <div class="entry-grid">
            <div><span>Invoice</span>${fmt(d.invoice)}</div>
            <div><span>CP</span>${fmt(d.cp)}</div>
            <div><span>Expenses</span>${fmt(d.expenses)}</div>
            <div><span>Commission (${d.rate ?? 10}%)</span>${fmt(c.commission)}</div>
          </div>
          <div class="entry-actions">
            <button class="tag-btn ${d.clientPaid ? 'on' : ''}" data-action="clientPaid" data-id="${d.id}">Client paid</button>
            <button class="tag-btn commission ${d.commissionPaid ? 'on' : ''}" data-action="commissionPaid" data-id="${d.id}">Commission paid</button>
            <button class="del-btn" data-action="delete" data-id="${d.id}">Remove</button>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('heroProfit').innerHTML = '<sup>₦</sup>' + Math.round(totalProfit).toLocaleString('en-NG');
  document.getElementById('statInvoiced').textContent = fmt(totalInvoiced);
  document.getElementById('statCommission').textContent = fmt(commissionOwed);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('entries').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  const deal = deals.find(d => d.id === id);
  if(!deal) return;

  if(action === 'clientPaid'){ deal.clientPaid = !deal.clientPaid; }
  if(action === 'commissionPaid'){ deal.commissionPaid = !deal.commissionPaid; }
  if(action === 'delete'){
    if(confirm('Remove this deal from the ledger?')){
      deals = deals.filter(d => d.id !== id);
    } else {
      return;
    }
  }
  render();
  await persist();
});

const overlay = document.getElementById('overlay');
const openAdd = document.getElementById('openAdd');
const cancelAdd = document.getElementById('cancelAdd');
const saveAdd = document.getElementById('saveAdd');

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

openAdd.addEventListener('click', () => {
  document.getElementById('fClient').value = '';
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fInvoice').value = '';
  document.getElementById('fCP').value = '';
  document.getElementById('fExpenses').value = '';
  document.getElementById('fRate').value = '10';
  updateLiveCalc();
  overlay.classList.remove('hidden');
});

cancelAdd.addEventListener('click', () => overlay.classList.add('hidden'));
overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.add('hidden'); });

['fInvoice','fCP','fExpenses','fRate'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateLiveCalc);
});

function updateLiveCalc(){
  const invoice = parseFloat(document.getElementById('fInvoice').value) || 0;
  const cp = parseFloat(document.getElementById('fCP').value) || 0;
  const expenses = parseFloat(document.getElementById('fExpenses').value) || 0;
  const rate = parseFloat(document.getElementById('fRate').value) || 0;

  const commission = invoice * (rate/100);
  const costs = cp + expenses;
  const profit = invoice - costs - commission;

  document.getElementById('calcCommission').textContent = fmt(commission);
  document.getElementById('calcCosts').textContent = fmt(costs);
  document.getElementById('calcProfit').textContent = fmt(profit);
}

saveAdd.addEventListener('click', async () => {
  const client = document.getElementById('fClient').value.trim();
  const invoice = parseFloat(document.getElementById('fInvoice').value) || 0;

  if(!client || invoice <= 0){
    alert('Add a client name and an invoice value above zero.');
    return;
  }

  const deal = {
    id: 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    client,
    date: document.getElementById('fDate').value || todayStr(),
    invoice,
    cp: parseFloat(document.getElementById('fCP').value) || 0,
    expenses: parseFloat(document.getElementById('fExpenses').value) || 0,
    rate: parseFloat(document.getElementById('fRate').value) || 10,
    clientPaid: false,
    commissionPaid: false
  };

  deals.push(deal);
  overlay.classList.add('hidden');
  render();
  await persist();
});

loadDeals();
</script>
</body>
</html>
