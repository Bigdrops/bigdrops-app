<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waybill Gateway</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /*
     * ─── DESIGN TOKEN MAP ───
     * --color-primary        → blue accent (External card bar, arrow hover)
     * --color-warning        → amber accent (Internal card bar)
     * --color-surface        → card background
     * --color-surface-hover  → card hover background
     * --color-border         → card borders, button borders
     * --color-border-hover   → border on hover
     * --color-text           → primary text (titles)
     * --color-text-muted     → secondary text (descriptions)
     * --color-text-subtle    → tertiary text (tags, labels)
     * --color-bg             → page background
     */

    body {
      background: var(--color-bg, #FFFFFF);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .gateway {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ─── HEADER ─── */
    .gateway-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--color-primary, #2563EB);
      text-transform: uppercase;
    }

    .gateway-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--color-text, #0F172A);
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .gateway-title span {
      color: var(--color-warning, #D97706);
    }

    .gateway-sub {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--color-text-subtle, #94A3B8);
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    /* ─── SELECTION CARDS ─── */
    .select-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 20px;
      border: 1px solid var(--color-border, #E2E8F0);
      border-radius: 4px;
      background: var(--color-surface, #F8FAFC);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .select-card:hover {
      border-color: var(--color-border-hover, #2563EB);
      background: var(--color-surface-hover, #F1F5F9);
    }

    .select-card-bar {
      width: 3px;
      height: 48px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .bar-primary  { background: var(--color-primary, #2563EB); }
    .bar-warning  { background: var(--color-warning, #D97706); }

    .select-card-body { flex: 1; }

    .select-card-tag {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--color-text-subtle, #94A3B8);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .select-card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text, #0F172A);
      margin-bottom: 4px;
    }

    .select-card-desc {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      color: var(--color-text-muted, #64748B);
      line-height: 1.5;
    }

    .select-card-arrow {
      font-family: 'Space Mono', monospace;
      color: var(--color-text-subtle, #CBD5E1);
      font-size: 18px;
      flex-shrink: 0;
      transition: color 0.2s, transform 0.2s;
    }

    .select-card:hover .select-card-arrow {
      color: var(--color-primary, #2563EB);
      transform: translateX(4px);
    }

    /* ─── DIVIDER ─── */
    .gateway-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 6px 0;
    }

    .gateway-divider-line {
      flex: 1;
      height: 1px;
      background: var(--color-border, #E2E8F0);
    }

    .gateway-divider-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--color-text-subtle, #94A3B8);
      text-transform: uppercase;
    }

    /* ─── BLANK DOWNLOAD BUTTONS ─── */
    .dl-group {
      display: flex;
      gap: 10px;
    }

    .dl-btn {
      flex: 1;
      padding: 14px;
      border: 1px solid var(--color-border, #E2E8F0);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }

    .dl-btn:hover {
      border-color: var(--color-border-hover, #94A3B8);
      background: var(--color-surface, #F8FAFC);
    }

    .dl-btn-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--color-text-subtle, #94A3B8);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .dl-btn-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted, #64748B);
    }
  </style>
</head>
<body>

  <div class="gateway">

    <div class="gateway-label">Create Document</div>
    <div class="gateway-title">New <span>Waybill</span></div>
    <div class="gateway-sub">Select document type</div>

    <!-- EXTERNAL CARD -->
    <div class="select-card">
      <div class="select-card-bar bar-primary"></div>
      <div class="select-card-body">
        <div class="select-card-tag">Type 01 / Outbound</div>
        <div class="select-card-title">External Delivery Note</div>
        <div class="select-card-desc">Outbound shipment to clients and vendors. Links to invoice on record.</div>
      </div>
      <div class="select-card-arrow">&rarr;</div>
    </div>

    <!-- INTERNAL CARD -->
    <div class="select-card">
      <div class="select-card-bar bar-warning"></div>
      <div class="select-card-body">
        <div class="select-card-tag">Type 02 / Internal</div>
        <div class="select-card-title">Internal Transfer Note</div>
        <div class="select-card-desc">Stock movement between depots, workshops, and service centers.</div>
      </div>
      <div class="select-card-arrow">&rarr;</div>
    </div>

    <!-- DIVIDER -->
    <div class="gateway-divider">
      <div class="gateway-divider-line"></div>
      <div class="gateway-divider-text">or download blank</div>
      <div class="gateway-divider-line"></div>
    </div>

    <!-- BLANK TEMPLATES -->
    <div class="dl-group">
      <button class="dl-btn">
        <div class="dl-btn-label">Blank Template</div>
        <div class="dl-btn-text">External (PDF)</div>
      </button>
      <button class="dl-btn">
        <div class="dl-btn-label">Blank Template</div>
        <div class="dl-btn-text">Internal (PDF)</div>
      </button>
    </div>

  </div>

</body>
</html>
