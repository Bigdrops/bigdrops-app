      const [selectedDepartmentFilter, setSelectedDepartmentFilter] = useState('all');
      const [toast, setToast] = useState(null);

      // Multi-select Batch Actions
      const [selectedMemberIds, setSelectedMemberIds] = useState([]);

      // Modal / Bottom Sheet States
      const [editingRole, setEditingRole] = useState(null); // role being edited
      const [selectedMemberDrawer, setSelectedMemberDrawer] = useState(null); // member drawer
      const [isInviteModalOpen, setIsInviteModalOpen] = useState(false);
      
      // Sandbox Simulator target
      const [testSimulatorTarget, setTestSimulatorTarget] = useState({ memberId: 'usr-2', permId: 'hardware.config' });

      // Trigger soft toast alert
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Handle Role Save / Update
      const handleSaveRole = (roleData) => {
        if (!roleData.name.trim()) {
          showToast('Please specify a role name.', 'error');
          return;
        }

        if (editingRole && editingRole.id && roles.some(r => r.id === editingRole.id)) {
          setRoles(prev => prev.map(r => r.id === editingRole.id ? { ...r, ...roleData } : r));
          showToast(`Updated permissions for "${roleData.name}"`);
        } else {
          const newRole = {
            id: `role-${Date.now()}`,
            name: roleData.name,
            desc: roleData.desc || 'Custom created role template.',
            color: 'purple',
            badgeStyle: 'bg-pastel-purpleLight text-pastel-purpleText border-purple-200',
            isSystem: false,
            permissions: roleData.permissions || []
          };
          setRoles(prev => [...prev, newRole]);
          showToast(`Created new custom role "${newRole.name}"`);
        }
        setEditingRole(null);
      };

      // Duplicate Role Template
      const handleDuplicateRole = (role) => {
        const dup = {
          ...role,
          id: `role-${Date.now()}`,
          name: `${role.name} (Copy)`,
          isSystem: false,
        };
        setRoles(prev => [...prev, dup]);
        showToast(`Duplicated role as "${dup.name}"`);
      };

      // Delete Custom Role
      const handleDeleteRole = (roleId, roleName) => {
        const count = members.filter(m => m.roleIds.includes(roleId)).length;
        if (count > 0) {
          showToast(`Cannot delete "${roleName}". ${count} member(s) hold this role.`, 'error');
          return;
        }
        setRoles(prev => prev.filter(r => r.id !== roleId));
        showToast(`Deleted custom role "${roleName}"`, 'info');
      };

      // Toggle Member Role
      const handleToggleMemberRole = (memberId, roleId) => {

                            </div>
                          </div>
                        </div>

                        {/* Footer Controls */}
                        <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                          <span className="text-[11px] font-medium text-slate-500">
                            <strong>{assignedCount}</strong> {assignedCount === 1 ? 'member' : 'members'}
                          </span>

                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => handleDuplicateRole(role)}
                              className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold active-tap"
                              title="Duplicate Template"
                            >
                              <Icon name="duplicate" className="w-4 h-4" />
                            </button>

                            <button
                              onClick={() => setEditingRole(role)}
                              className="px-3.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold active-tap flex items-center gap-1"
                            >
                              <Icon name="roleEdit" className="w-3.5 h-3.5" />
                              <span>Edit</span>
                            </button>

                            {!role.isSystem && (
                              <button
                                onClick={() => handleDeleteRole(role.id, role.name)}
                                className="p-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold active-tap"
                                title="Delete Role"
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

            {}
            {activeTab === 'matrix' && (
              <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-soft-sm animate-fade-in overflow-x-auto">
                <div className="mb-4">
                  <h3 className="text-base font-extrabold text-slate-900">Entitlements Matrix Overview</h3>
                  <p className="text-xs text-slate-500">Cross-reference map between system roles and operational policy tokens.</p>
                </div>

                <table className="w-full text-left text-xs border-collapse min-w-[650px]">
                  <thead>
                    <tr className="border-b-2 border-slate-200 bg-slate-50">
                      <th className="py-3.5 px-4 font-bold text-slate-600 uppercase text-[10px]">Policy Action Token</th>
                      {roles.map(r => (
                        <th key={r.id} className="py-3.5 px-3 font-extrabold text-slate-900 text-center">
                          {r.name}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {PERMISSION_TAXONOMY.flatMap(cat => cat.items).map(perm => (
                      <tr key={perm.id} className="hover:bg-slate-50/80">
                        <td className="py-3.5 px-4">
                          <p className="font-bold text-slate-900">{perm.label}</p>
                          <p className="text-[11px] text-slate-500">{perm.desc}</p>
                        </td>
                        {roles.map(r => {
                          const has = r.permissions.includes(perm.id);
                          return (
                            <td key={r.id} className="py-3.5 px-3 text-center">
                              {has ? (
                                <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 font-extrabold text-xs">
                                  ✓
                                </span>
                              ) : (
                                <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-300">
                                  -
                                </span>
                              )}
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {}
            {activeTab === 'test' && (
              <div className="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-soft-sm animate-fade-in">
                <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-200">
                  <div className="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold">
                    <Icon name="test" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">Live Policy Simulator</h3>
                    <p className="text-xs text-slate-500">Pick a team member and simulate whether their combined roles permit a specific ERP operational action.</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Selector Controls */}
                  <div className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Target Team Member</label>
                      <select
                        value={testSimulatorTarget.memberId}
                        onChange={(e) => setTestSimulatorTarget(prev => ({ ...prev, memberId: e.target.value }))}
                        className="w-full px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-indigo-500"
                      >
                        {members.map(m => (
                          <option key={m.id} value={m.id}>{m.name} ({m.department})</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Target Action Token</label>
                      <select
                        value={testSimulatorTarget.permId}
                        onChange={(e) => setTestSimulatorTarget(prev => ({ ...prev, permId: e.target.value }))}
                        className="w-full px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-indigo-500"
                      >
                        {PERMISSION_TAXONOMY.flatMap(cat => cat.items).map(p => (
                          <option key={p.id} value={p.id}>{p.label} [{p.id}]</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Simulator Result Canvas */}
                  {(() => {
                    const memberObj = members.find(m => m.id === testSimulatorTarget.memberId);
                    const permObj = PERMISSION_TAXONOMY.flatMap(cat => cat.items).find(p => p.id === testSimulatorTarget.permId);
                    const hasAccess = checkMemberPermission(testSimulatorTarget.memberId, testSimulatorTarget.permId);

                    return (
                      <div className={`p-5 rounded-3xl border flex flex-col justify-between ${
                        hasAccess 
                          ? 'bg-emerald-50/50 border-emerald-200 text-emerald-950' 
                          : 'bg-rose-50/50 border-rose-200 text-rose-950'
                      }`}>
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Evaluation Decision</span>
                            <span className={`px-3 py-1 rounded-full text-xs font-black uppercase ${
                              hasAccess ? 'bg-emerald-600 text-white shadow-soft-sm' : 'bg-rose-600 text-white'
                            }`}>
                              {hasAccess ? 'ACCESS GRANTED ✓' : 'ACCESS DENIED ✕'}
                            </span>
                          </div>

                          <h4 className="text-base font-extrabold mb-1">
                            {memberObj?.name} ➔ "{permObj?.label}"
                          </h4>
                          <p className="text-xs opacity-80 mb-4">{permObj?.desc}</p>

                          <div className="text-xs font-medium space-y-1.5 bg-white/90 p-3.5 rounded-2xl border border-slate-200">
                            <div className="font-bold text-slate-700 mb-1">Inherited Roles Evaluation:</div>
                            {memberObj?.roleIds.map(rId => {
                              const r = roles.find(x => x.id === rId);
                              const grantsIt = r?.permissions.includes(testSimulatorTarget.permId);
                              return (
                                <div key={rId} className="flex items-center justify-between">
                                  <span>• {r?.name}</span>
                                  <span className={`font-bold ${grantsIt ? 'text-emerald-700' : 'text-slate-400'}`}>
                                    {grantsIt ? 'Grants Policy Match' : 'No Policy Match'}
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-200/60 text-[11px] font-semibold text-slate-500">
                          Evaluated via BIGDROPS RBAC Engine v3
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

          </main>

          {}
          {editingRole && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full sm:max-w-2xl max-h-[90vh] sm:rounded-3xl rounded-t-3xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden animate-slide-up sm:animate-pop-in">
                
                <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">
                      {editingRole.id ? `Edit Role: ${editingRole.name}` : 'Create New Custom Role'}
                    </h3>
                    <p className="text-xs text-slate-500">Configure role identity and policy entitlements</p>
                  </div>
                  <button onClick={() => setEditingRole(null)} className="p-1 text-slate-400 hover:text-slate-700">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-5 flex-1">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Role Title *</label>
                      <input
                        type="text"
                        value={editingRole.name}
                        onChange={(e) => setEditingRole(prev => ({ ...prev, name: e.target.value }))}
                        placeholder="e.g. Field Inspector"
                        className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Description</label>
                      <input
                        type="text"
                        value={editingRole.desc}
                        onChange={(e) => setEditingRole(prev => ({ ...prev, desc: e.target.value }))}
                        placeholder="Short operational scope..."
                        className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <h4 className="text-xs font-black uppercase tracking-wider text-indigo-700 mb-3">
                      Entitlement Checklist ({editingRole.permissions?.length || 0} selected)
                    </h4>

                    <div className="space-y-4">
                      {PERMISSION_TAXONOMY.map(cat => (
                        <div key={cat.category} className="p-4 rounded-3xl bg-slate-50 border border-slate-200/80">
                          <h5 className="text-xs font-extrabold text-slate-900 mb-2">{cat.category}</h5>
                          <div className="space-y-2">
                            {cat.items.map(item => {
                              const checked = editingRole.permissions?.includes(item.id);
                              return (
                                <label
                                  key={item.id}
                                  className={`flex items-start gap-3 p-3 rounded-2xl border transition-all cursor-pointer ${
                                    checked ? 'bg-white border-indigo-500 shadow-soft-sm' : 'bg-transparent border-transparent hover:bg-white/60'
                                  }`}
                                >
                                  <input
                                    type="checkbox"
                                    checked={checked || false}
                                    onChange={(e) => {
                                      const perms = editingRole.permissions || [];
                                      const updated = e.target.checked
                                        ? [...perms, item.id]
                                        : perms.filter(x => x !== item.id);
                                      setEditingRole(prev => ({ ...prev, permissions: updated }));
                                    }}
                                    className="mt-0.5 accent-indigo-600 w-4 h-4 rounded"
                                  />
                                  <div>
                                    <span className="text-xs font-bold text-slate-900 block">{item.label}</span>
                                    <span className="text-[11px] text-slate-500 block">{item.desc}</span>
                                  </div>
                                </label>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end gap-3">
                  <button
                    onClick={() => setEditingRole(null)}
                    className="px-4 py-2.5 rounded-2xl bg-white border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-100 active-tap"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleSaveRole(editingRole)}
                    className="px-5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-soft-md active-tap"
                  >
                    Save Role Template
                  </button>
                </div>

              </div>
            </div>
          )}

          {}
          {selectedMemberDrawer && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-end bg-slate-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full sm:max-w-md h-[85vh] sm:h-full p-6 border-l border-slate-200 shadow-2xl flex flex-col justify-between overflow-y-auto rounded-t-3xl sm:rounded-none animate-slide-up sm:animate-fade-in">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-200">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-2xl ${selectedMemberDrawer.avatarBg} flex items-center justify-center font-bold text-sm text-white`}>
                        {selectedMemberDrawer.avatar}
                      </div>
                      <div>
                        <h3 className="text-base font-extrabold text-slate-900">{selectedMemberDrawer.name}</h3>
                        <p className="text-xs text-slate-500">{selectedMemberDrawer.email}</p>
                      </div>
                    </div>
                    <button onClick={() => setSelectedMemberDrawer(null)} className="p-1 text-slate-400 hover:text-slate-700">
                      <Icon name="cross" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="py-5 space-y-4">
                    <h4 className="text-xs font-black uppercase tracking-wider text-indigo-700">Role Assignments</h4>

                    <div className="space-y-2">
                      {roles.map(role => {
                        const hasRole = selectedMemberDrawer.roleIds.includes(role.id);
                        return (
                          <div key={role.id} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                            <div>
                              <span className="text-xs font-bold text-slate-900 block">{role.name}</span>
                              <span className="text-[10px] text-slate-500 block">{role.permissions.length} capabilities</span>
                            </div>
                            <button
                              onClick={() => handleToggleMemberRole(selectedMemberDrawer.id, role.id)}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold active-tap ${
                                hasRole
                                  ? 'bg-indigo-600 text-white shadow-soft-sm'
                                  : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'
                              }`}
                            >
                              {hasRole ? 'Assigned ✓' : '+ Assign'}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setSelectedMemberDrawer(null)}
                  className="w-full py-3 rounded-2xl bg-slate-900 text-white font-bold text-xs active-tap"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {}
          {isInviteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full max-w-md p-6 rounded-3xl border border-slate-200 shadow-2xl relative animate-pop-in">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-2xl bg-indigo-50 text-indigo-700 flex items-center justify-center font-bold">
                      <Icon name="mail" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base font-extrabold text-slate-900">Invite Team Member</h3>
                      <p className="text-xs text-slate-500">Dispatch email invitation with role template</p>
                    </div>
                  </div>
                  <button onClick={() => setIsInviteModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast('Invitation email dispatched!');
                  setIsInviteModalOpen(false);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Email Address</label>
                    <input
                      required
                      type="email"
                      placeholder="e.g. colleague@company.com"
                      className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Initial Role Template</label>
                    <select className="w-full px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-indigo-500">
                      {roles.map(r => (
                        <option key={r.id} value={r.id}>{r.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsInviteModalOpen(false)}
                      className="px-4 py-2 rounded-2xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-xs font-bold text-white shadow-soft-md"
                    >
                      Send Invitation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          <div className="fixed bottom-5 right-5 z-40 sm:hidden">
            <button
              onClick={() => setEditingRole({ name: '', desc: '', permissions: [] })}
              className="w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-float active-tap"
              title="Create Role"
            >
              <Icon name="plus" className="w-7 h-7" />
            </button>
          </div>

        </div>
      );
    }

    // Render Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
