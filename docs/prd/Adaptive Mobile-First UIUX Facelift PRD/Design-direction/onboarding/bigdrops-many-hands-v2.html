<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIGDROPS — Many Hands / Work Relay</title>
<style>
:root{
  --navy:#0b1d35;--slate:#53657a;--muted:#8a98a9;--line:#d9e0e8;
  --paper:#fff;--desk:#f3f6f9;--blue:#2e6ee6;--cyan:#38a9d8;--green:#16866c;
  --red:#b64c55;--skin:#d5a176;--skin2:#bc825d;--cuff:#dce5ef;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.35,.35,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Inter,Manrope,system-ui,sans-serif;background:var(--desk);color:var(--navy)}
.world{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(circle at 50% 44%,rgba(46,110,230,.07),transparent 31%),
 linear-gradient(145deg,#fff 0 58%,#eef3f7 100%)}
.brand{position:absolute;z-index:50;left:20px;top:calc(17px + env(safe-area-inset-top));font-weight:950;font-size:13px;letter-spacing:.27em}
.brand small{display:block;margin-top:7px;font:750 9px/1.2 ui-monospace,monospace;letter-spacing:.14em;color:var(--slate)}
.table{position:absolute;inset:78px 0 146px;overflow:hidden}
.zone{position:absolute;color:var(--muted);font:800 8px/1 ui-monospace,monospace;letter-spacing:.14em}
.z1{left:5%;top:7%}.z2{right:5%;top:7%}.z3{left:5%;bottom:6%}.z4{right:5%;bottom:6%}

/* actual paper being handed over */
.doc{position:absolute;z-index:15;left:50%;top:47%;width:92px;height:122px;margin:-61px -46px;background:#fff;border:1px solid #cbd5df;
 box-shadow:0 14px 28px -18px rgba(11,29,53,.45);border-radius:3px;transform:translateX(-145px) rotate(-7deg);
 animation:documentRelay 8s var(--ease) infinite}
.doc:before{content:"QUOTATION";position:absolute;left:10px;top:12px;font:900 7px/1 ui-monospace,monospace;letter-spacing:.12em;color:var(--navy)}
.doc .ln{position:absolute;left:10px;right:10px;height:2px;background:#dfe5ec}
.doc .l1{top:31px}.doc .l2{top:42px;right:28px}.doc .l3{top:60px}.doc .l4{top:71px;right:20px}
.doc .total{position:absolute;right:10px;bottom:13px;width:32px;height:8px;border-top:2px solid var(--navy)}
.doc .seal{position:absolute;right:8px;bottom:24px;border:2px solid var(--green);color:var(--green);padding:4px 3px;font:900 6px/1 ui-monospace,monospace;transform:rotate(-8deg);opacity:0;animation:seal 8s infinite}
@keyframes documentRelay{
  0%{transform:translateX(-190px) rotate(-10deg);opacity:0}
  7%{opacity:1}
  15%,27%{transform:translateX(-82px) rotate(-3deg)}
  38%,49%{transform:translateX(28px) rotate(2deg)}
  58%,69%{transform:translateX(94px) translateY(54px) rotate(-2deg)}
  78%,88%{transform:translateX(-58px) translateY(112px) rotate(4deg);opacity:1}
  100%{transform:translateX(-170px) translateY(150px) rotate(7deg);opacity:0}
}
@keyframes seal{0%,40%{opacity:0;transform:rotate(-8deg) scale(.5)}44%,82%{opacity:1;transform:rotate(-8deg) scale(1)}90%,100%{opacity:0}}

/* SVG hands: each pose is visibly different */
.hand{position:absolute;z-index:20;width:175px;height:130px;overflow:visible;filter:drop-shadow(0 8px 8px rgba(11,29,53,.08))}
.hand .skin{fill:var(--skin);stroke:#8f6348;stroke-width:1.6;stroke-linejoin:round}
.hand .skin2{fill:var(--skin2);stroke:#7f523c;stroke-width:1.6;stroke-linejoin:round}
.hand .cuff{fill:var(--cuff);stroke:#8797aa;stroke-width:1.6}
.hand .crease{fill:none;stroke:#9b6b4f;stroke-width:1.2;stroke-linecap:round;opacity:.7}

/* left hand: thumb + four fingers pinch left edge of document */
.h-place{left:-92px;top:35%;animation:placeHand 8s var(--ease) infinite}
@keyframes placeHand{0%{transform:translateX(-55px);opacity:0}8%{opacity:1}15%,26%{transform:translateX(105px)}34%,100%{transform:translateX(-55px);opacity:0}}
/* right hand: open receiving palm */
.h-receive{right:-105px;top:34%;transform:scaleX(-1);animation:receiveHand 8s var(--ease) infinite}
@keyframes receiveHand{0%,18%{transform:scaleX(-1) translateX(-55px);opacity:0}27%{opacity:1}37%,51%{transform:scaleX(-1) translateX(115px)}60%,100%{transform:scaleX(-1) translateX(-50px);opacity:0}}
/* top hand holds stamp */
.h-stamp{left:50%;top:-93px;margin-left:-87px;animation:stampHand 8s var(--spring) infinite}
@keyframes stampHand{0%,28%{transform:translateY(-50px);opacity:0}34%{opacity:1;transform:translateY(5px)}40%{transform:translateY(112px)}44%{transform:translateY(82px)}50%,100%{transform:translateY(-50px);opacity:0}}
.stamper{position:absolute;z-index:24;left:50%;top:18%;width:44px;height:48px;margin-left:-22px;animation:stampObj 8s var(--spring) infinite}
.stamper .knob{width:22px;height:26px;margin:auto;background:var(--navy);border-radius:8px 8px 3px 3px}
.stamper .base{height:10px;background:var(--navy);border-radius:3px}
@keyframes stampObj{0%,30%{transform:translateY(-70px);opacity:0}35%{opacity:1}40%{transform:translateY(125px)}44%{transform:translateY(96px)}51%,100%{transform:translateY(-70px);opacity:0}}

/* bottom filing hand */
.h-file{left:50%;bottom:-108px;margin-left:-88px;transform:rotate(-90deg);animation:fileHand 8s var(--ease) infinite}
@keyframes fileHand{0%,62%{transform:rotate(-90deg) translateX(-60px);opacity:0}70%{opacity:1}78%,89%{transform:rotate(-90deg) translateX(86px)}100%{opacity:0;transform:rotate(-90deg) translateX(-60px)}}

/* receipt is visibly smaller and emerges from approved work */
.receipt{position:absolute;z-index:16;left:50%;top:58%;width:54px;height:76px;background:#fff;border:1px dashed #9eabb9;box-shadow:0 8px 18px -14px #0b1d35;
 opacity:0;animation:receipt 8s var(--ease) infinite}
.receipt:before{content:"RECEIPT";position:absolute;left:7px;top:8px;font:900 6px/1 ui-monospace,monospace;letter-spacing:.1em}
.receipt:after{content:"";position:absolute;left:7px;right:7px;top:25px;height:1px;background:#b8c3cf;box-shadow:0 10px 0 #b8c3cf,0 20px 0 #b8c3cf}
@keyframes receipt{0%,53%{opacity:0;transform:translate(58px,-15px) scale(.7)}61%,76%{opacity:1;transform:translate(76px,12px) scale(1)}88%,100%{opacity:0;transform:translate(-80px,70px) rotate(6deg)}}

/* contextual accounting activity */
.ledger{position:absolute;left:5%;bottom:12%;width:108px;height:78px;background:#fff;border:1px solid var(--line);padding:10px;transform:rotate(-2deg)}
.ledger b{font:900 7px/1 ui-monospace,monospace;letter-spacing:.1em}
.ledger span{display:flex;justify-content:space-between;margin-top:9px;border-bottom:1px solid #dce3ea;font:700 6px/1.4 ui-monospace,monospace;color:var(--slate)}
.folder{position:absolute;right:5%;bottom:10%;width:112px;height:70px;background:#dbe5ef;border:1px solid #9aabba;border-radius:3px;transform:rotate(2deg)}
.folder:before{content:"RECORDS";position:absolute;left:8px;top:9px;background:#fff;border:1px solid #9aabba;padding:4px 6px;font:800 6px/1 ui-monospace,monospace;letter-spacing:.1em}

/* hand-drawn relay path indicates causality without becoming a loader */
.path{position:absolute;inset:0;pointer-events:none;opacity:.18}
.path svg{width:100%;height:100%}.path path{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:5 7}

/* large readable tip, presented as paper pushed toward viewer */
.tip{position:absolute;z-index:40;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));min-height:116px;background:#fff;border:1px solid #cfd8e3;
 box-shadow:0 18px 45px -28px rgba(11,29,53,.5);padding:16px 17px 17px 21px;transform:rotate(-.5deg)}
.tip:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--navy)}
.tip .label{font:900 9px/1 ui-monospace,monospace;letter-spacing:.17em;color:var(--blue);margin-bottom:9px}
.tip p{margin:0;font-size:15px;line-height:1.45;font-weight:650;color:var(--navy);transition:.3s opacity,.3s transform}
.tip p.out{opacity:0;transform:translateY(8px)}

@media(min-width:640px){
 .table{inset:76px 0 118px}
 .doc{width:112px;height:146px;margin:-73px -56px}.hand{width:205px;height:150px}
 .h-place{left:-82px}.h-receive{right:-95px}.h-stamp{margin-left:-102px}.h-file{margin-left:-102px}
 .ledger{left:7%;width:150px;height:96px}.folder{right:7%;width:150px;height:92px}
 .tip{left:50%;right:auto;width:min(520px,70vw);transform:translateX(-50%) rotate(-.4deg);min-height:100px}
 .zone{font-size:9px}.z1{left:7%}.z2{right:7%}.z3{left:7%}.z4{right:7%}
}
@media(min-width:1000px){
 .table{left:5%;right:5%;bottom:42px}
 .doc{left:46%;top:42%}.ledger{left:3%;bottom:20%;width:190px;height:112px}.folder{right:3%;bottom:18%;width:190px;height:108px}
 .tip{left:auto;right:3%;bottom:30px;transform:rotate(-.4deg);width:430px}
 .h-place{left:5%;top:32%}.h-receive{right:17%;top:30%}.h-stamp{left:46%}.h-file{left:58%;bottom:-65px}
}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important}.doc{opacity:1;transform:none}.doc .seal{opacity:1}.receipt{opacity:1;transform:translate(70px,18px)}
 .h-place{opacity:1;transform:translateX(105px)}.h-receive{opacity:1;transform:scaleX(-1) translateX(115px)}
 .h-stamp,.h-file,.stamper{display:none}
}
</style>
</head>
<body>
<main class="world">
 <header class="brand">BIGDROPS<small>YOUR BUSINESS TEAM · ALREADY AT WORK</small></header>
 <section class="table" aria-label="A coordinated business team passing work between functions">
  <span class="zone z1">SALES · PREPARE</span><span class="zone z2">REVIEW · APPROVE</span>
  <span class="zone z3">ACCOUNTS · TAX</span><span class="zone z4">RECORDS · FILE</span>
  <div class="path" aria-hidden="true"><svg viewBox="0 0 400 600" preserveAspectRatio="none"><path d="M20 220 C120 180 160 235 205 240 S310 205 382 220 M205 250 C250 330 250 380 335 430 M205 260 C160 345 130 395 62 440"/></svg></div>

  <div class="ledger"><b>ACCOUNTS</b><span><i>INVOICE</i><i>FILED</i></span><span><i>VAT</i><i>LEDGER</i></span><span><i>PAYMENT</i><i>RECEIPT</i></span></div>
  <div class="folder"></div>
  <div class="doc"><i class="ln l1"></i><i class="ln l2"></i><i class="ln l3"></i><i class="ln l4"></i><i class="total"></i><strong class="seal">APPROVED</strong></div>
  <div class="receipt"></div>

  <!-- placing/pinching hand: visible palm, thumb, four fingers, cuff -->
  <svg class="hand h-place" viewBox="0 0 180 130" aria-hidden="true">
   <path class="cuff" d="M0 38h43v58H0z"/>
   <path class="skin" d="M38 43c18-8 31-19 48-30 7-5 15 4 10 11L76 43l47-20c9-4 14 8 6 13L91 55l43-8c10-2 12 11 3 14l-42 8 37 5c10 2 8 15-2 15l-48-1c-12 0-20 12-32 12H38z"/>
   <path class="skin" d="M72 55c10 3 20 8 29 14l-9 14c-9-6-18-10-29-12z"/>
   <path class="crease" d="M52 72c12-3 21-1 31 5M82 45l13 9M97 37l11 10"/>
  </svg>

  <!-- receiving/open hand -->
  <svg class="hand h-receive" viewBox="0 0 180 130" aria-hidden="true">
   <path class="cuff" d="M0 37h42v61H0z"/>
   <path class="skin2" d="M39 42c17-7 24-18 34-30 6-7 16 0 12 8L72 42l22-29c6-8 17-1 12 8L87 49l31-26c7-6 16 4 9 11L99 59l35-14c9-4 14 8 5 13L98 81c-14 8-19 20-37 20H39z"/>
   <path class="crease" d="M58 75c15-7 26-5 38 0M77 47l10 12M94 43l9 12"/>
  </svg>

  <!-- hand descending with stamp -->
  <svg class="hand h-stamp" viewBox="0 0 180 130" aria-hidden="true">
   <path class="cuff" d="M61 0h59v36H61z"/>
   <path class="skin" d="M65 32c-4 15-6 34-2 49 2 9 11 17 20 13l7-4 7 4c10 5 19-4 20-14l2-46z"/>
   <path class="skin" d="M66 59c-13 1-19 8-18 18 1 9 11 12 18 6l11-10z"/>
   <path class="skin" d="M117 58c14 0 20 8 18 18-2 9-12 11-19 5l-10-10z"/>
   <path class="crease" d="M76 72c9 5 18 5 28 0"/>
  </svg>
  <div class="stamper"><div class="knob"></div><div class="base"></div></div>

  <!-- filing hand -->
  <svg class="hand h-file" viewBox="0 0 180 130" aria-hidden="true">
   <path class="cuff" d="M0 38h44v58H0z"/>
   <path class="skin2" d="M40 43c15-5 26-17 38-28 7-6 16 2 10 10L75 42l37-19c9-5 15 7 7 13L88 56l43-4c10-1 11 12 1 14l-40 5 34 11c9 3 5 15-5 13L80 86c-12-3-21 12-39 12z"/>
   <path class="crease" d="M55 72c13-4 23-2 33 4"/>
  </svg>
 </section>

 <aside class="tip">
  <div class="label">HANDED TO YOU · BIGDROPS TIP</div>
  <p id="tipText">Every recorded payment automatically generates a receipt. View and download it from the Receipts page.</p>
 </aside>
</main>
<script>
(()=>{
 const tips=[
 "Every recorded payment automatically generates a receipt. View and download it from the Receipts page.",
 "Set an expiry date on quotations to automatically flag overdue responses.",
 "Tap the search icon to find any document across all modules. Search by document number, client name, or project name."
 ];
 const el=document.getElementById("tipText");let i=0;
 if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  setInterval(()=>{el.classList.add("out");setTimeout(()=>{i=(i+1)%tips.length;el.textContent=tips[i];el.classList.remove("out")},300)},5200)
 }
})();
</script>
</body>
</html>
