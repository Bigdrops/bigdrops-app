    .mode-strip{display:flex;gap:7px;margin:10px 0 15px;overflow:auto;scrollbar-width:none}.mode-strip button{display:flex;align-items:center;gap:5px;flex:0 0 auto;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:9px;font-weight:800;color:var(--sub)}.mode-strip button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.mode-strip svg{width:14px}

    .client{width:100%;display:grid;grid-template-columns:37px 1fr 17px;gap:10px;align-items:center;min-height:61px;padding:10px;text-align:left;border:0;background:transparent}.client.locked{background:#f4f1ec}.avatar{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:var(--olive-soft);color:var(--olive);font-size:11px;font-weight:800}.client small,.client b,.client em{display:block;font-style:normal}.client small{font-size:8px;color:var(--sub);text-transform:uppercase;letter-spacing:.09em;font-weight:800}.client b{margin:2px 0;font-size:11px}.client em{font-size:9px;color:var(--sub)}.client>svg{width:16px;color:var(--sub)}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}.info{padding:8px 10px;border-right:1px solid var(--line)}.info:last-child{border:0}.info b,.info small{display:block}.info b{font-size:9px}.info small{margin-top:2px;color:var(--sub);font:500 8px var(--mono)}.info small:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 4px 1px 0;background:var(--olive)}.info.warn small:before{background:var(--amber)}

    .group-wrap{border-bottom:1px solid var(--line)}.group-wrap:last-child{border-bottom:0}.group{display:grid;grid-template-columns:20px 1fr auto 26px;gap:7px;align-items:center;padding:9px 10px;background:var(--olive-soft);color:var(--olive)}.group b{font-size:10px}.group span{font:500 9px var(--mono)}.group .mini{background:rgba(255,255,255,.55);color:var(--olive)}.group-items{padding-left:8px;border-left:2px solid #d9e0ea;margin-left:10px}

    .summary{padding:10px 11px;border:1px solid #dbe3ee;border-radius:15px;background:#f7f9fc}.sumline{display:flex;justify-content:space-between;min-height:22px;color:var(--sub);font-size:9px}.sumline b{color:var(--ink);font:500 9px var(--mono)}.sumline.minus{color:var(--red)}.sumline.minus b{color:var(--red)}.sumtotal{display:flex;justify-content:space-between;align-items:end;padding-top:9px;margin-top:5px;border-top:1px solid #e3e9f1}.sumtotal small{display:block;color:var(--sub);font-size:8px;font-weight:800;letter-spacing:.08em}.sumtotal b{font:500 18px var(--mono);letter-spacing:-.08em;color:var(--rust)}.words{padding:8px 10px;margin:8px 0;border:1px dashed #cfcbc3;border-radius:10px;background:var(--soft);font-size:9px;color:var(--sub);font-style:italic}
    .row{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;min-height:55px;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}.row:last-child{border:0}.row .r-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--soft);color:var(--olive)}.row.rust .r-icon{background:var(--rust-soft);color:var(--rust)}.row b,.row small{display:block}.row b{font-size:10px}.row small{margin-top:3px;color:var(--sub);font-size:8.5px}.row>svg{width:14px;color:var(--sub)}
    .dock{margin:18px 0 0;padding:5px;border-radius:17px;background:var(--ink)}.dock-in{display:grid;grid-template-columns:44px 1fr;gap:8px}.dock button{height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}.dock .primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--rust);font-size:10px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,0.16)}
    .save-fab-popup{position:absolute;z-index:16;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:52px;height:52px;border:0;border-radius:16px;background:var(--rust);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(30,58,95,0.32),0 4px 12px rgba(0,0,0,0.14), inset 0 1px 0 rgba(255,255,255,0.2)}
    .overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:end;background:rgba(15,23,42,.46);backdrop-filter:blur(4px)}.sheet{width:100%;max-height:88dvh;overflow:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom));background:var(--paper);border-radius:23px 23px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18)}.grip{width:36px;height:4px;border-radius:99px;background:#d2cec7;margin:0 auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}.sheet-head h3{margin:0;font:800 17px var(--display);letter-spacing:-.06em}.sheet-head button{width:38px;height:38px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center}.sheet-copy{margin:0 0 14px;color:var(--sub);font-size:10px;line-height:16px}.form{display:grid;gap:9px}.two{grid-template-columns:1fr 1fr;gap:8px}.three{grid-template-columns:1fr 1fr 1fr;gap:8px}.field label{display:block;margin:0 0 4px;color:var(--sub);font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.field input,.field textarea,.field select{width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:10px;outline:none}.field textarea{min-height:62px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rust);box-shadow:0 0 0 3px rgba(30,58,95,.1)}.mono{font-family:var(--mono)!important}.choice{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;width:100%;min-height:53px;padding:8px 9px;margin:7px 0;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}.choice .cicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--olive-soft);color:var(--olive)}.choice b,.choice small{display:block}.choice b{font-size:10px}.choice small{margin-top:2px;font-size:8.5px;color:var(--sub)}.choice>svg{width:15px;color:var(--sub)}.switch{width:38px;height:23px;border:0;border-radius:20px;background:#d8d4cc;position:relative;flex-shrink:0}.switch:after{content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:.2s var(--ease)}.switch.on{background:var(--rust)}.switch.on:after{transform:translateX(15px)}.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;margin:7px 0;background:var(--soft);border-radius:10px}.seg button{height:31px;border:0;border-radius:8px;background:transparent;font-size:9px;font-weight:800;color:var(--sub)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}.cta{width:100%;height:47px;margin-top:14px;border:0;border-radius:13px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}.cta.rust{background:var(--rust)}.cta.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.cta.danger{background:#fff5f5;border:1px solid #f3c9c4;color:var(--red)}.list-field{display:grid;grid-template-columns:1fr 1.3fr 31px;gap:6px;margin-bottom:7px}.list-field input{min-height:36px;padding:7px;border:1px solid var(--line);border-radius:9px;font-size:9px}.list-field button{border:0;border-radius:9px;background:#fff4f2;color:var(--red);display:grid;place-items:center}.list-field svg{width:14px}.toast{position:absolute;z-index:50;left:50%;bottom:96px;transform:translate(-50%,14px);padding:9px 11px;border-radius:11px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;opacity:0;transition:.2s var(--ease);white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    .suggestion-wrap{position:relative}
    .suggestion-dropdown{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:180px;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 24px rgba(0,0,0,0.12);z-index:20}
    .suggestion-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid var(--soft);background:transparent;text-align:left}
    .suggestion-row:last-child{border-bottom:0}
    .suggestion-row:hover{background:var(--soft)}
    .suggestion-name{flex:1;min-width:0;font:700 12px var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .suggestion-price{flex-shrink:0;font:700 12px var(--mono);color:var(--rust)}
    .price-context{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--soft);border:1px dashed var(--line);font:500 9px var(--body);color:var(--sub);line-height:13px;white-space:pre-line}
    .suggestion-loading{padding:10px 12px;font:500 9px var(--body);color:var(--sub)}
    .col-row{display:flex;align-items:center;min-height:50px;padding:9px 10px;gap:10px;border-bottom:1px solid var(--line);background:var(--paper)}.col-row:last-child{border-bottom:0}.col-row b{flex:1;font-size:10px}.col-row small{display:block;margin-top:2px;color:var(--sub);font-size:8.5px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>

<body><div class="phone"><main id="app"></main><div id="toast" class="toast"></div></div>
<script>
const I=n=>`<i data-lucide="${n}"></i>`;const uid=()=>Math.random().toString(36).slice(2,9);const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const state={tab:'items',sheet:null,active:null,mode:'create',invoice:{type:'Invoice',title:'Quarterly equipment overhaul',number:'INV-2026-0142',po:'PO-3278',client:{id:'c1',name:'Adeyemi & Partners',person:'Ijeoma Adeyemi',initials:'A&'},issue:'2026-08-18',due:'2026-09-01',payment:'Net 14',customPayment:'Payment due within 14 days',headers:[{id:uid(),label:'Project',value:'Ikoyi Office Retrofit'}],items:[{id:uid(),description:'Molded case circuit breaker 125A',subDescription:'4 pole, adjustable thermal-magnetic trip unit',itemId:'catalog-mccb',qty:3,unit:'pcs',price:184000,make:'Schneider',partNo:'NSX160F',condition:'New',installRate:0,vatRate:7.5,discountRate:0,image:null,groupId:'g1',customData:{colour:'Black'}},{id:uid(),description:'Copper cable 4mm²',subDescription:'FR PVC insulated copper cable',itemId:'catalog-cable',qty:40,unit:'m',price:6800,make:'Nexans',partNo:'CAB-4MM',condition:'New',installRate:0,vatRate:7.5,discountRate:0,image:null,groupId:'g1',customData:{colour:'Copper'}}],groups:[{id:'g1',name:'Electrical materials',showSubtotal:true}],columns:{make:true,unit:true,partNo:true,condition:true,installRate:false,itemVat:true,itemDiscount:true},charges:[{id:uid(),label:'Transportation',value:25000,withTax:false}],discount:0,discountType:'percent',discountTiming:'after',vat:7.5,wht:0,whtType:'percent',notes:'Thank you for the opportunity to support this project.',terms:'Payment is due within fourteen days of issue.',notesTitle:'Notes',termsTitle:'Terms & Conditions',additional:[{id:uid(),label:'Delivery',value:'7 working days'}],signatory:{id:'sig-1',name:'Nneka Okoro',role:'Operations Director'},links:[{id:uid(),label:'Project folder',url:'https://example.com/ikoyi'}],pdf:{showBankDetails:true,bankAccountId:'zenith-1',showFooter:false,showTagline:false,showBalanceDue:true,showAmountInWords:true,showVatPercentage:true,showWhtPercentage:true,showDiscountPercentage:true,compact:false}}};

// ── Bank accounts (single source of truth so PDF settings never drift from the picker) ──
const BANK_ACCOUNTS=[['zenith-1','Zenith Bank','1234567890'],['gtb-1','Guaranty Trust Bank','0045528713'],['access-1','Access Bank','0213465780']];
function selectedBank(){return BANK_ACCOUNTS.find(a=>a[0]===state.invoice.pdf.bankAccountId)||BANK_ACCOUNTS[0]}

// ── Live price suggestion mock (mirrors MobileItemCard useItemSuggestionEngine) ──
const mockSuggestions=[
  {item_id:'cat-mccb',name:'Molded case circuit breaker 125A',standard_price:184000},
  {item_id:'cat-cable',name:'Copper cable 4mm²',standard_price:6800},
  {item_id:'cat-led',name:'LED panel light 36W',standard_price:23500},
  {item_id:'cat-cement',name:'Portland cement 50kg',standard_price:8500},
  {item_id:'cat-paint',name:'Emulsion paint 20L — white',standard_price:42000},
];
const priceContextMap={
  'cat-mccb':'Last sold ₦178,000 to Adeyemi & Partners · 3d ago · 12 in stock',
  'cat-cable':'Last sold ₦6,500 to Uptown Facilities · 1w ago',
  'cat-led':'Last sold ₦22,000 to Wellspring Homes · 2d ago',
};
let suggestionOpenId=null;
function getFilteredSuggestions(q){const t=String(q||'').trim().toLowerCase();if(t.length<2)return[];return mockSuggestions.filter(s=>s.name.toLowerCase().includes(t)).slice(0,5)}
function selectSuggestion(itemId,suggestionId){const s=mockSuggestions.find(x=>x.item_id===suggestionId);if(!s)return;const it=by(itemId)||active();if(it){it.description=s.name;it.price=s.standard_price;it.itemId=s.item_id}suggestionOpenId=null;render();toast('Price suggestion applied')}

// Re-renders only the dropdown region under the description field, so typing never
// steals focus from the textarea (this was the "crashes while testing" bug).
function refreshSuggestionBox(itemId){const box=document.getElementById('suggestBox');if(!box)return;const it=by(itemId);const q=it?it.description:'';const show=suggestionOpenId===itemId&&String(q||'').trim().length>=2;box.innerHTML=suggestionDropdown(itemId,q,show)}
function suggestionDropdown(itemId,q,show){if(!show)return contextNote(itemId,q);const filtered=getFilteredSuggestions(q);if(filtered.length===0)return `<div class="suggestion-dropdown"><div class="suggestion-loading">No matches — try “cable” or “breaker”</div></div>`;return `<div class="suggestion-dropdown">${filtered.map(s=>`<button type="button" class="suggestion-row" onmousedown="event.preventDefault();selectSuggestion('${itemId}','${s.item_id}')"><span class="suggestion-name">${esc(s.name)}</span><span class="suggestion-price">₦${Number(s.standard_price).toLocaleString()}</span></button>`).join('')}</div>`}
function contextNote(itemId,q){const m=mockSuggestions.find(s=>s.name===q);return m&&priceContextMap[m.item_id]?`<div class="price-context">${priceContextMap[m.item_id]}</div>`:''}

function calc(){let raw=0,install=0;state.invoice.items.forEach(a=>{const base=a.qty*a.price;const disc=base*(a.discountRate||0)/100;a.line=base-disc;raw+=a.line;install+=Number(a.installRate||0)});const taxable=state.invoice.charges.filter(c=>c.withTax).reduce((s,c)=>s+Number(c.value||0),0);const post=state.invoice.charges.filter(c=>!c.withTax).reduce((s,c)=>s+Number(c.value||0),0);const disc=state.invoice.discountType==='percent'?raw*state.invoice.discount/100:state.invoice.discount;const pre=state.invoice.discountTiming==='before'?disc:0;const vat=(raw+taxable-pre)*state.invoice.vat/100;const after=state.invoice.discountTiming==='after'?disc:0;const wht=state.invoice.whtType==='percent'?(raw+taxable+vat-after)*state.invoice.wht/100:state.invoice.wht;return{raw,install,disc,vat,wht,charges:taxable+post,total:raw+taxable+post+install+vat-disc-wht}}
function words(n){return n?'Amount payable: '+money(n)+' only.':'Zero Naira only.'}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function by(id){return state.invoice.items.find(a=>a.id===id)}
function active(){return by(state.active)||state.invoice.items[0]}

// Groups consecutive items sharing a groupId into one section, so a group's items
// render nested under its header instead of floating disconnected from it.
function buildSections(){const sections=[];state.invoice.items.forEach(it=>{const gid=it.groupId||null;const last=sections[sections.length-1];if(last&&last.groupId===gid){last.items.push(it)}else{sections.push({groupId:gid,items:[it]})}});return sections}

function render(){const x=state.invoice,t=calc();document.getElementById('app').innerHTML=`<header class="nav"><button class="icon" aria-label="Back" onclick="toast('Back to documents')">${I('chevron-left')}</button><h1>${x.type.toUpperCase()} EDITOR</h1><button class="icon" aria-label="Document actions" onclick="openSheet('actions')">${I('ellipsis')}</button></header><section class="identity"><button class="type" onclick="openSheet('type')" aria-label="Document type">${I(x.type==='Invoice'?'receipt-text':'file-text')}</button><div><b>${esc(x.title||'Untitled document')}</b><span>${esc(x.number)} · ${state.mode==='edit'?'RECORDED':'DRAFT'}</span></div><button class="total" onclick="openSheet('terms')"><small>PAYABLE</small><strong>${money(t.total)}</strong></button></section><div class="mode-strip"><button class="primary" onclick="openSheet('client')">${I(state.mode==='edit'?'lock-keyhole':'contact-round')}${state.mode==='edit'?'Identity locked':'Client'}</button><button onclick="openSheet('import')">${I('file-input')} Import</button><button onclick="openSheet('columns')">${I('table-properties')} Columns</button><button onclick="openSheet('preview')">${I('eye')} Preview</button></div><div class="tabs"><button class="${state.tab==='items'?'on':''}" onclick="tab('items')">Items</button><button class="${state.tab==='document'?'on':''}" onclick="tab('document')">Document</button><button class="${state.tab==='output'?'on':''}" onclick="tab('output')">Output</button></div>${state.tab==='items'?itemsView(t):state.tab==='document'?documentView(t):outputView(t)}<div class="dock"><div class="dock-in"><button aria-label="Preview" onclick="openSheet('preview')">${I('eye')}</button><button class="primary" onclick="openSheet('save')">${I('send')}${state.mode==='edit'?'Save changes':'Create invoice'}</button></div></div>${state.sheet?sheet():''}`;document.getElementById('app').insertAdjacentHTML('beforeend',`<button class="save-fab-popup" style="position:fixed" aria-label="Save draft" onclick="draft()">${I('save')}</button>`);if(window.lucide&&typeof lucide.createIcons==='function'){lucide.createIcons({attrs:{'stroke-width':'1.8'}})}}
function clientBlock(){const x=state.invoice;return `<div class="block"><div class="cap"><h2>Client</h2><button onclick="openSheet('client')">${state.mode==='edit'?'Protected':'Change'} ${I(state.mode==='edit'?'lock-keyhole':'pencil')}</button></div><div class="cell-box"><button class="client ${state.mode==='edit'?'locked':''}" onclick="openSheet('client')"><span class="avatar">${state.mode==='edit'?I('lock-keyhole'):esc(x.client.initials)}</span><span><small>${state.mode==='edit'?'Client identity':'Bill to'}</small><b>${esc(x.client.name)}</b><em>${esc(x.client.person)}</em></span>${I('chevron-right')}</button><div class="info-grid"><div class="info"><b>Payment</b><small>${esc(x.payment)}</small></div><div class="info warn"><b>Due ${new Date(x.due+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</b><small>${Math.max(0,Math.round((new Date(x.due)-new Date())/864e5))} days remaining</small></div></div></div></div>`}
function itemsView(t){const x=state.invoice;const sections=buildSections();return `${clientBlock()}<div class="block"><div class="cap"><h2>Line items · ${x.items.length}</h2><button onclick="openSheet('columns')">Fields ${I('sliders-horizontal')}</button></div><div class="cell-box">${sections.map(sec=>sectionBlock(sec,t)).join('')}<button class="add" onclick="addItem()">${I('plus')} Add line item</button></div></div><div class="block"><div class="cap"><h2>Totals</h2><button onclick="openSheet('terms')">Edit ${I('badge-percent')}</button></div>${summary(t)}</div>`}
function sectionBlock(sec,t){const nums=state.invoice.items;if(!sec.groupId){return sec.items.map(a=>item(a,nums.indexOf(a))).join('')}const g=state.invoice.groups.find(g=>g.id===sec.groupId);if(!g)return sec.items.map(a=>item(a,nums.indexOf(a))).join('');const sum=sec.items.reduce((s,a)=>s+(a.line||0),0);return `<div class="group-wrap"><div class="group">${I('braces')}<b>${esc(g.name)}</b><span>${g.showSubtotal?money(sum):'Subtotal hidden'}</span><button class="mini" aria-label="Edit group" onclick="openSheet('group','${g.id}')">${I('settings-2')}</button></div><div class="group-items">${sec.items.map(a=>item(a,nums.indexOf(a))).join('')}</div></div>`}
function item(a,i){return `<article class="item"><button class="item-main" onclick="openSheet('item','${a.id}')"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="item-copy"><b>${esc(a.description||'Item description')}</b><span>${a.qty} ${esc(a.unit)} × ${money(a.price)}</span></span><span class="amount"><b>${money(a.line)}</b><small>${esc(a.make||'No make')}</small></span>${I('chevron-right')}</button><div class="item-tools"><button class="mini" aria-label="Move up" ${i===0?'disabled':''} onclick="moveItem('${a.id}',-1)">${I('arrow-up')}</button><button class="mini" aria-label="Move down" ${i===state.invoice.items.length-1?'disabled':''} onclick="moveItem('${a.id}',1)">${I('arrow-down')}</button><button class="mini" onclick="openSheet('item','${a.id}')">Edit</button><button class="mini danger" aria-label="Remove ${esc(a.description||'item')}" onclick="removeItem('${a.id}')">${I('trash-2')}</button></div></article>`}
function summary(t){return `<div class="summary"><div class="sumline"><span>Subtotal</span><b>${money(t.raw)}</b></div>${t.disc?`<div class="sumline minus"><span>Discount</span><b>−${money(t.disc)}</b></div>`:''}${t.vat?`<div class="sumline"><span>VAT${state.invoice.pdf.showVatPercentage?' ('+state.invoice.vat+'%)':''}</span><b>${money(t.vat)}</b></div>`:''}${t.install?`<div class="sumline"><span>Install rate</span><b>${money(t.install)}</b></div>`:''}${t.charges?`<div class="sumline"><span>Extra charges</span><b>${money(t.charges)}</b></div>`:''}${t.wht?`<div class="sumline minus"><span>WHT${state.invoice.pdf.showWhtPercentage?' ('+state.invoice.wht+'%)':''}</span><b>−${money(t.wht)}</b></div>`:''}${state.invoice.pdf.showAmountInWords?`<div class="words">${words(t.total)}</div>`:''}<div class="sumtotal"><small>Grand total</small><b>${money(t.total)}</b></div></div>`}
function documentView(t){const x=state.invoice;return `${clientBlock()}<div class="block"><div class="cap"><h2>Document details</h2><button onclick="openSheet('details')">Edit ${I('pencil')}</button></div><div class="cell-box"><button class="row" onclick="openSheet('details')"><span class="r-icon">${I('file-pen-line')}</span><span><b>${esc(x.title)}</b><small>${esc(x.number)} · PO ${esc(x.po||'not set')}</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('dates')"><span class="r-icon">${I('calendar-days')}</span><span><b>${x.type==='Quotation'?'Quotation date':'Issue date'} · ${x.issue}</b><small>${x.type==='Quotation'?'Valid until':'Due date'} · ${x.due}</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('headers')"><span class="r-icon">${I('rows-3')}</span><span><b>${x.headers.length} header field${x.headers.length===1?'':'s'}</b><small>Project, PO, work order or reference</small></span>${I('chevron-right')}</button></div></div><div class="block"><div class="cap"><h2>Commercial terms</h2><button onclick="openSheet('terms')">Edit ${I('badge-percent')}</button></div><div class="cell-box"><button class="row rust" onclick="openSheet('terms')"><span class="r-icon">${I('receipt')}</span><span><b>VAT ${x.vat}% · Discount ${x.discount||'not set'}</b><small>Tax timing, withholding, additional charges</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('notes')"><span class="r-icon">${I('notebook-pen')}</span><span><b>Notes & terms</b><small>${x.notes?'Copy included':'No customer copy added'}</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('additional')"><span class="r-icon">${I('list-plus')}</span><span><b>Additional fields</b><small>${x.additional.length?'Included in PDF':'No fields'}</small></span>${I('chevron-right')}</button></div></div>${summary(t)}`}
function outputView(t){const x=state.invoice,bank=selectedBank();return `<div class="block"><div class="cap"><h2>Output & sharing</h2><button onclick="openSheet('preview')">Preview ${I('eye')}</button></div><div class="cell-box"><button class="row" onclick="openSheet('attachments')"><span class="r-icon">${I('paperclip')}</span><span><b>Attachments</b><small>${x.links.length} reference link${x.links.length===1?'':'s'} · files available</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('signatory')"><span class="r-icon">${I('signature')}</span><span><b>${esc(x.signatory.name||'No signatory')}</b><small>Signing block for document PDF</small></span>${I('chevron-right')}</button><button class="row" onclick="openSheet('links')"><span class="r-icon">${I('link-2')}</span><span><b>Reference links</b><small>${x.links.length} linked reference${x.links.length===1?'':'s'}</small></span>${I('chevron-right')}</button><button class="row rust" onclick="openSheet('pdf')"><span class="r-icon">${I('file-output')}</span><span><b>PDF output settings</b><small>${x.pdf.showBankDetails?bank[1]+' selected':'Bank, tagline, values and labels'}</small></span>${I('chevron-right')}</button></div></div><div class="block"><div class="cap"><h2>Recipient total</h2></div>${summary(t)}</div>`}

function sheet(){let s=state.sheet,b='';if(s==='client')b=clientSheet();if(s==='type')b=typeSheet();if(s==='item')b=itemSheet();if(s==='details')b=detailsSheet();if(s==='dates')b=datesSheet();if(s==='headers')b=headersSheet();if(s==='terms')b=termsSheet();if(s==='notes')b=notesSheet();if(s==='additional')b=additionalSheet();if(s==='attachments')b=attachmentsSheet();if(s==='signatory')b=signatorySheet();if(s==='links')b=linksSheet();if(s==='pdf')b=pdfSheet();if(s==='bank')b=bankSheet();if(s==='columns')b=columnsSheet();if(s==='import')b=importSheet();if(s==='actions')b=actionsSheet();if(s==='group')b=groupSheet();if(s==='preview'||s==='save')b=sendSheet(s);return `<aside class="overlay" role="dialog" aria-modal="true"><section class="sheet">${b}</section></aside>`}

function itemSheet(){const a=active(),c=state.invoice.columns;const show=suggestionOpenId===a.id&&String(a.description||'').trim().length>=2;return head('Line item','Description, quantity and unit price are always available. Field visibility is controlled by Table Columns.')+`<div class="form"><div class="field suggestion-wrap"><label>Description</label><textarea oninput="iv('description',this.value);suggestionOpenId='${a.id}';refreshSuggestionBox('${a.id}');updateItemAmounts('${a.id}')" onfocus="suggestionOpenId='${a.id}';refreshSuggestionBox('${a.id}')" onblur="setTimeout(()=>{suggestionOpenId=null;refreshSuggestionBox('${a.id}')},180)">${esc(a.description)}</textarea><div id="suggestBox">${suggestionDropdown(a.id,a.description,show)}</div></div><div class="three form"><div class="field"><label>Qty</label><input class="mono" inputmode="decimal" value="${a.qty}" oninput="iv('qty',this.value,1);updateItemAmounts('${a.id}')"></div><div class="field"><label>Unit</label><input value="${esc(a.unit)}" oninput="iv('unit',this.value)"></div><div class="field"><label>Unit price</label><input class="mono" inputmode="decimal" value="${a.price}" oninput="iv('price',this.value,1);updateItemAmounts('${a.id}')"></div></div><div class="field"><label>Group</label><select onchange="iv('groupId',this.value||null);render()"><option value="">No group</option>${state.invoice.groups.map(g=>`<option value="${g.id}" ${a.groupId===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>${c.make?`<div class="field"><label>Make</label><input value="${esc(a.make)}" oninput="iv('make',this.value)"></div>`:''}${c.partNo||c.condition?`<div class="two form">${c.partNo?`<div class="field"><label>Part no.</label><input value="${esc(a.partNo)}" oninput="iv('partNo',this.value)"></div>`:''}${c.condition?`<div class="field"><label>Condition</label><input value="${esc(a.condition)}" oninput="iv('condition',this.value)"></div>`:''}</div>`:''}${c.installRate?`<div class="field"><label>Install rate override</label><input class="mono" inputmode="decimal" value="${a.installRate}" oninput="iv('installRate',this.value,1);updateItemAmounts('${a.id}')"></div>`:''}${c.itemVat||c.itemDiscount?`<div class="two form">${c.itemVat?`<div class="field"><label>Item VAT %</label><input class="mono" inputmode="decimal" value="${a.vatRate||''}" oninput="iv('vatRate',this.value,1)"></div>`:''}${c.itemDiscount?`<div class="field"><label>Item discount %</label><input class="mono" inputmode="decimal" value="${a.discountRate||''}" oninput="iv('discountRate',this.value,1);updateItemAmounts('${a.id}')"></div>`:''}</div>`:''}<div class="field"><label>Sub-description</label><textarea oninput="iv('subDescription',this.value)">${esc(a.subDescription)}</textarea></div><div class="field"><label>Custom colour</label><input value="${esc(a.customData.colour||'')}" oninput="ivcustom('colour',this.value)"></div></div><div class="seg"><button class="${a.image?'on':''}" onclick="toggleImage()">${I('image')} ${a.image?'Photo attached':'Attach photo'}</button><button onclick="removeImage()">${I('image-minus')} Remove photo</button></div><button class="cta" onclick="closeSheet()">${I('check')} Apply line item</button><button class="cta danger" onclick="removeItem('${a.id}')">${I('trash-2')} Remove item</button>`}
function detailsSheet(){const x=state.invoice;const locked=state.mode==='edit';return head('Document details','Title and PO remain editable. Number is generated in create state and protected in edit state.')+`<div class="form"><div class="field"><label>Invoice title</label><input value="${esc(x.title)}" oninput="dv('title',this.value)"></div><div class="two form"><div class="field"><label>Invoice number</label><input class="mono" ${locked?'readonly':''} value="${esc(x.number)}" oninput="dv('number',this.value)"></div><div class="field"><label>PO number</label><input value="${esc(x.po)}" oninput="dv('po',this.value)"></div></div></div>${locked?`<button class="cta ghost" onclick="openSheet('client')">${I('lock-keyhole')} Identity protection options</button>`:''}<button class="cta" onclick="closeSheet()">${I('check')} Done</button>`}

function termsSheet(){const x=state.invoice;return head('Commercial terms','All amount rows are computed live from this sheet and the line item data.')+`<div class="form"><div class="two form"><div class="field"><label>VAT rate %</label><input class="mono" inputmode="decimal" value="${x.vat}" oninput="dv('vat',this.value,1);renderTotalsLive()"></div><div class="field"><label>Discount</label><input class="mono" inputmode="decimal" value="${x.discount}" oninput="dv('discount',this.value,1);renderTotalsLive()"></div></div><div class="seg"><button class="${x.discountType==='percent'?'on':''}" onclick="set('discountType','percent')">Percent</button><button class="${x.discountType==='fixed'?'on':''}" onclick="set('discountType','fixed')">Fixed amount</button></div><div class="seg"><button class="${x.discountTiming==='before'?'on':''}" onclick="set('discountTiming','before')">Before VAT</button><button class="${x.discountTiming==='after'?'on':''}" onclick="set('discountTiming','after')">After VAT</button></div><div class="two form"><div class="field"><label>WHT</label><input class="mono" inputmode="decimal" value="${x.wht}" oninput="dv('wht',this.value,1);renderTotalsLive()"></div><div class="field"><label>WHT type</label><select onchange="dv('whtType',this.value);renderTotalsLive()"><option ${x.whtType==='percent'?'selected':''} value="percent">Percent</option><option ${x.whtType==='fixed'?'selected':''} value="fixed">Fixed amount</option></select></div></div><div class="cap"><h2>Extra charges</h2><button onclick="addCharge()">${I('plus')} Add</button></div>${x.charges.map((c,i)=>`<div class="list-field"><input value="${esc(c.label)}" oninput="charge(${i},'label',this.value)"><input class="mono" value="${c.value}" oninput="charge(${i},'value',this.value,1);renderTotalsLive()"><button aria-label="Remove charge" onclick="xremove('charges',${i})">${I('x')}</button></div><button class="choice" onclick="charge(${i},'withTax',!${c.withTax});render()"><span class="cicon">${I('landmark')}</span><span><b>${c.withTax?'Taxable charge':'Post-tax charge'}</b><small>Tap to change VAT treatment</small></span><span class="switch ${c.withTax?'on':''}"></span></button>`).join('')}</div><button class="cta rust" onclick="closeSheet()">${I('badge-check')} Apply commercial terms</button>`}

function pdfSheet(){const p=state.invoice.pdf,bank=selectedBank();let opts=[['showBankDetails','Bank details'],['showTagline','Tagline'],['showFooter','Footer'],['showBalanceDue','Show balance due'],['showAmountInWords','Show amount in words'],['showVatPercentage','Show VAT % in brackets'],['showWhtPercentage','Show WHT % in brackets'],['showDiscountPercentage','Show discount % in brackets']];return head('PDF output settings','Recipient-facing document controls are kept here, separate from invoice data.')+`<button class="choice" onclick="openSheet('bank')" role="switch" aria-checked="${p.showBankDetails}"><span class="cicon">${I('landmark')}</span><span><b>${esc(bank[1])} · ${esc(bank[2])}</b><small>Selected account</small></span>${I('chevron-right')}</button>`+opts.map(o=>`<button class="choice" onclick="pdf('${o[0]}')" role="switch" aria-checked="${!!p[o[0]]}"><span class="cicon">${I('file-output')}</span><span><b>${o[1]}</b><small>${p[o[0]]?'Included in PDF':'Not included'}</small></span><span class="switch ${p[o[0]]?'on':''}"></span></button>`).join('')+`<button class="cta" onclick="closeSheet()">${I('check')} Save output settings</button>`}
function bankSheet(){const selected=state.invoice.pdf.bankAccountId;return head('Bank account','Choose the account to show if bank details are enabled in PDF output.')+BANK_ACCOUNTS.map(a=>`<button class="choice" onclick="state.invoice.pdf.bankAccountId='${a[0]}';openSheet('pdf')"><span class="cicon">${I('landmark')}</span><span><b>${a[1]}</b><small>${a[2]}</small></span>${selected===a[0]?I('circle-check'):I('chevron-right')}</button>`).join('')}
function columnsSheet(){const c=state.invoice.columns;const opts=[['make','Make','Manufacturer or brand'],['partNo','Part number','Catalog / SKU reference'],['condition','Condition','New, refurbished, used'],['installRate','Install rate','Per-line installation charge'],['itemVat','Item VAT %','Per-line VAT override'],['itemDiscount','Item discount %','Per-line discount override']];return head('Table columns','Description, quantity, unit and unit price always show. Toggle any extra field on or off — hidden fields are kept in the data, just not shown.')+`<div class="cell-box" style="margin-bottom:12px">${opts.map(o=>`<div class="col-row"><div><b>${o[1]}</b><small>${o[2]}</small></div><button class="switch ${c[o[0]]?'on':''}" role="switch" aria-checked="${!!c[o[0]]}" aria-label="Toggle ${o[1]}" onclick="col('${o[0]}')"></button></div>`).join('')}</div><button class="cta ghost" onclick="resetColumns()">${I('rotate-ccw')} Reset to defaults</button><button class="cta" onclick="closeSheet()">${I('check')} Done</button>`}
function importSheet(){return `<div class="sheet-head"><h3>Import JSON items</h3><button aria-label="Close" onclick="closeSheet()">${I('x')}</button></div><p class="sheet-copy">Add new line items from JSON — handy for pasting output extracted by an AI assistant from a source document.</p><div style="padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);margin-bottom:12px"><div style="font:800 9px var(--body);letter-spacing:0.08em;text-transform:uppercase;color:var(--rust);margin-bottom:4px">Append mode</div><div style="font:500 11px var(--body);color:var(--ink);line-height:14px">New items are added to the end of the list — nothing existing is changed or removed.</div><div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px dashed var(--line);font:500 9px var(--mono);color:var(--sub);line-height:14px">[{ "description": "...", "qty": 1, "unit": "pcs", "price": 0 }]</div></div><div class="field"><label>Pasted JSON</label><textarea id="json" placeholder='[{"description":"Cable","qty":2,"price":12000,"unit":"m"}]' style="min-height:110px"></textarea></div><button class="cta rust" onclick="importJSON()">${I('file-down')} Add items to document</button>`}
function groupSheet(){let g=state.invoice.groups.find(g=>g.id===state.active);const memberCount=state.invoice.items.filter(a=>a.groupId===g.id).length;return head('Line group')+`<div class="form"><div class="field"><label>Group name</label><input value="${esc(g.name)}" oninput="gval('name',this.value)"></div><button class="choice" onclick="gval('showSubtotal',!${g.showSubtotal});render()" role="switch" aria-checked="${!!g.showSubtotal}"><span class="cicon">${I('calculator')}</span><span><b>Show group subtotal</b><small>Display this group subtotal below its items</small></span><span class="switch ${g.showSubtotal?'on':''}"></span></button></div><p class="sheet-copy">${memberCount} item${memberCount===1?'':'s'} in this group. Assign or remove items from a line item's own editor.</p><button class="cta" onclick="closeSheet()">${I('check')} Done</button><button class="cta danger" onclick="removeGroup('${g.id}')">${I('trash-2')} Delete group</button>`}
function actionsSheet(){return head('Document actions')+`<button class="choice" onclick="state.mode=state.mode==='create'?'edit':'create';closeSheet();render();toast('Mode changed')"><span class="cicon">${I('lock-keyhole')}</span><span><b>${state.mode==='create'?'Switch to edit state':'Switch to create state'}</b><small>Preview the source lock condition</small></span>${I('chevron-right')}</button><button class="choice" onclick="addGroup()"><span class="cicon">${I('braces')}</span><span><b>Add group</b><small>Create a named group for line items</small></span>${I('chevron-right')}</button><button class="choice" onclick="clearItems()"><span class="cicon">${I('trash-2')}</span><span><b>Clear line items</b><small>Remove all line items after confirmation</small></span>${I('chevron-right')}</button>`}
function sendSheet(s){const t=calc();return head(s==='save'?(state.mode==='edit'?'Save changes':'Create invoice'):'Recipient preview',s==='save'?'Save sets the document status to unpaid in the source workflow.':'Review the result before it leaves your workspace.')+`<div class="summary"><div class="sumline"><span>${esc(state.invoice.client.name)}</span><b>${esc(state.invoice.number)}</b></div><div class="sumtotal"><small>Recipient total</small><b>${money(t.total)}</b></div></div><button class="cta rust" onclick="commit()">${I(s==='save'?'save':'check-circle-2')} ${s==='save'?'Confirm save':'Looks good'}</button>`}
function openSheet(s,id=null){state.sheet=s;if(id)state.active=id;render()}function closeSheet(){state.sheet=null;render()}function tab(t){state.tab=t;render()}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function set(k,v){state.invoice[k]=v;render()}function dv(k,v,n=0){state.invoice[k]=n?Number(v||0):v}function iv(k,v,n=0){active()[k]=n?Number(v||0):v}function ivcustom(k,v){active().customData[k]=v}function hv(i,k,v){state.invoice.headers[i][k]=v}function av(i,k,v){state.invoice.additional[i][k]=v}function lv(i,k,v){state.invoice.links[i][k]=v}function sv(k,v){state.invoice.signatory[k]=v}function gval(k,v){state.invoice.groups.find(g=>g.id===state.active)[k]=v}function charge(i,k,v,n=0){state.invoice.charges[i][k]=n?Number(v||0):v}function pdf(k){state.invoice.pdf[k]=!state.invoice.pdf[k];render()}function col(k){state.invoice.columns[k]=!state.invoice.columns[k];render()}function resetColumns(){Object.keys(state.invoice.columns).forEach(k=>state.invoice.columns[k]=true);render()}function xremove(k,i){state.invoice[k].splice(i,1);render()}function addPair(k){state.invoice[k].push({id:uid(),label:'',value:''});render()}function addLink(){state.invoice.links.push({id:uid(),label:'',url:''});render()}function addCharge(){state.invoice.charges.push({id:uid(),label:'Additional charge',value:0,withTax:false});render()}
// Live-updates the payable badge and totals summary in the header without a full re-render, so typing in totals fields keeps focus.
function renderTotalsLive(){const t=calc();const strong=document.querySelector('.total strong');if(strong)strong.textContent=money(t.total)}
function updateItemAmounts(id){const t=calc();const strong=document.querySelector('.total strong');if(strong)strong.textContent=money(t.total)}
function chooseClient(i){let a=[['Adeyemi & Partners','Ijeoma Adeyemi','A&'],['Uptown Facilities','Oma Okoro','UF'],['Wellspring Homes','Wale Peters','WH']][i];state.invoice.client={id:'c'+i,name:a[0],person:a[1],initials:a[2]};closeSheet();toast('Client selected')}
function duplicate(){state.mode='create';state.invoice.number='INV-2026-'+Math.floor(1000+Math.random()*8999);closeSheet();toast('Duplicated as a new draft')}
function addItem(){let a={id:uid(),description:'New line item',subDescription:'',itemId:null,qty:1,unit:'pcs',price:0,make:'',partNo:'',condition:'New',installRate:0,vatRate:null,discountRate:null,image:null,groupId:null,customData:{}};state.invoice.items.push(a);openSheet('item',a.id)}
function removeItem(id){state.invoice.items=state.invoice.items.filter(a=>a.id!==id);closeSheet();toast('Line item removed')}
function moveItem(id,d){let a=state.invoice.items,i=a.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=a.length)return;let moved=a.splice(i,1)[0];a.splice(j,0,moved);render()}
function addGroup(){let g={id:uid(),name:'New group',showSubtotal:true};state.invoice.groups.push(g);state.active=g.id;openSheet('group')}
function removeGroup(id){state.invoice.items.forEach(a=>{if(a.groupId===id)a.groupId=null});state.invoice.groups=state.invoice.groups.filter(g=>g.id!==id);closeSheet();toast('Group deleted — its items are now ungrouped')}
function clearItems(){if(confirm('Clear all line items?')){state.invoice.items=[];closeSheet();toast('Line items cleared')}}
function toggleImage(){active().image='uploaded-image';render()}
function removeImage(){active().image=null;render()}
function importJSON(){try{let xs=JSON.parse(document.getElementById('json').value);if(!Array.isArray(xs))throw 0;xs.forEach(a=>state.invoice.items.push({id:uid(),description:a.description||a.name||'Imported item',subDescription:a.subDescription||'',itemId:null,qty:Number(a.qty)||1,unit:a.unit||'pcs',price:Number(a.price||a.rate)||0,make:a.make||'',partNo:a.partNo||'',condition:a.condition||'New',installRate:Number(a.installRate)||0,vatRate:a.vatRate||null,discountRate:a.discountRate||null,image:null,groupId:null,customData:a.customData||{}}));closeSheet();toast(xs.length+' item'+(xs.length===1?'':'s')+' imported')}catch(e){toast('Use a valid JSON array')}}
function draft(){toast('Draft saved locally')}
function commit(){closeSheet();toast(state.mode==='edit'?'Changes saved':'Invoice created successfully')}
render();
</script></div></body></html>
