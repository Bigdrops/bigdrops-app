<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f0f4f8"><title>BIGDROPS — Invoice Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{
      --canvas:#f0f4f8;--paper:#ffffff;--ink:#0f172a;--sub:#475569;--line:rgba(15,23,42,.07);
      --soft:#f8fafc;--rust:#1e3a5f;--rust-soft:#eef2ff;--olive:#64748b;--olive-soft:#f1f5f9;
      --amber:#b45309;--red:#ef4444;--indigo:#1e3a5f;--indigo-soft:#eef2ff;
      --violet:#6d28d9;--green:#059669;--amber-strong:#d9770b;
      --app-bottom-nav-offset:88px;
      --mono:"DM Mono",monospace;--body:Manrope,sans-serif;--display:Syne,sans-serif;
      --ease:cubic-bezier(.2,.8,.2,1)
    }
    *{box-sizing:border-box}html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:active{transform:scale(.98)}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
    svg{width:18px;height:18px;stroke-width:1.8}
    .phone{width:min(100%,430px);height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(34,27,18,.14)}
    main{height:100dvh;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(var(--app-bottom-nav-offset) + env(safe-area-inset-bottom));scrollbar-width:none}main::-webkit-scrollbar{display:none}
    .nav{height:44px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:0 -4px 9px}
    .nav h1{margin:0;font:800 14px var(--display);letter-spacing:-.06em;text-align:center}
    .icon{width:42px;height:42px;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;color:var(--ink)}.icon:hover{background:rgba(0,0,0,.04)}
    .identity{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
    .type{width:33px;height:33px;border:0;border-radius:10px;background:var(--rust-soft);color:var(--rust);display:grid;place-items:center}.type svg{width:16px}
    .identity b,.identity span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .identity b{font-size:12px;letter-spacing:-.03em}
    .identity span{margin-top:3px;color:var(--sub);font:500 9px var(--mono)}
    .identity .total{border:0;background:transparent;text-align:right}
    .total small{display:block;color:var(--sub);font-size:8px;letter-spacing:.08em;font-weight:800}
    .total strong{display:block;margin-top:3px;font:500 11px var(--mono);color:var(--rust)}
    .mode-strip{display:flex;gap:7px;margin:10px 0 15px;overflow:auto;scrollbar-width:none}
    .mode-strip button{display:flex;align-items:center;gap:5px;flex:0 0 auto;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:9px;font-weight:800;color:var(--sub)}
    .mode-strip button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .mode-strip .lock{background:var(--amber)/15%;color:var(--amber)}
    .mode-strip svg{width:14px}
    .cap{display:flex;align-items:center;justify-content:space-between;margin:0 3px 7px}
    .cap h2{margin:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .cap h2.amber{color:var(--amber)}.cap h2.indigo{color:var(--indigo)}.cap h2.violet{color:var(--violet)}.cap h2.green{color:var(--green)}.cap h2.rust{color:var(--rust)}.cap h2.neutral{color:var(--sub)}
    .cap button{border:0;background:transparent;color:var(--rust);font-size:10px;font-weight:800;display:flex;align-items:center;gap:4px}.cap svg{width:14px}
    .cell-box{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
    .client{width:100%;display:grid;grid-template-columns:37px 1fr 17px;gap:10px;align-items:center;min-height:61px;padding:12px;text-align:left;border:0;background:transparent}
    .client.locked{background:#f4f1ec}
    .avatar{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:var(--olive-soft);color:var(--olive);font-size:11px;font-weight:800}
    .client small,.client b,.client em{display:block;font-style:normal}
    .client small{font-size:8px;color:var(--sub);text-transform:uppercase;letter-spacing:.09em;font-weight:800}
    .client b{margin:2px 0;font-size:11px}
    .client em{font-size:9px;color:var(--sub)}
    .client>svg{width:16px;color:var(--sub)}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
    .info{padding:8px 10px;border-right:1px solid var(--line)}.info:last-child{border:0}
    .info b,.info small{display:block}.info b{font-size:9px}
    .info small{margin-top:2px;color:var(--sub);font:500 8px var(--mono)}
    .info small:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;margin:0 4px 1px 0;background:var(--olive)}
    .info.warn small:before{background:var(--amber)}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;margin:14px 0;background:#e8e3dc;border-radius:12px}
    .tabs button{height:32px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:9px;font-weight:800}
    .tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(44,37,30,.12)}
    .block{margin:16px 0}
    .item-image{display:flex;align-items:center;gap:8px;padding:5px 0}
    .item-image .img{width:44px;height:44px;border:1px dashed var(--line);border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--sub);overflow:hidden}
    .item-image .img img{max-width:100%;max-height:100%;display:block}
    .item-image button{width:26px;height:26px;border:0;border-radius:7px;background:var(--soft);display:grid;place-items:center;color:var(--sub)}
    .item-image button.danger{background:var(--red)/10%;color:var(--red)}
    .item{border-bottom:1px solid var(--line)}.item:last-of-type{border-bottom:0}
    .item-main{display:grid;grid-template-columns:25px 1fr auto 15px;gap:8px;align-items:center;width:100%;min-height:62px;padding:9px 10px;border:0;background:transparent;text-align:left}.item-main:focus{outline:2px solid var(--rust);outline-offset:2px}
    .num{width:25px;height:25px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:500 9px var(--mono);color:var(--sub)}
    .item-copy{min-width:0}.item-copy b,.item-copy span{display:block}
    .item-copy b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
    .item-copy span{margin-top:3px;color:var(--sub);font:500 8px var(--mono)}
    .amount{text-align:right}.amount b,.amount small{display:block}
    .amount b{font:500 10px var(--mono)}.amount small{margin-top:3px;color:var(--sub);font-size:8px}
    .item-main>svg{width:14px;color:var(--sub)}
    .item.invalid .item-main{box-shadow:0 0 0 2px var(--red)/20%;background:var(--red)/3%}
    .item-tools{display:flex;align-items:center;gap:2px;padding:0 9px 7px 43px}
    .mini{height:25px;min-width:25px;padding:0 5px;border:0;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:8px;font-weight:800}
    .mini svg{width:13px}.mini.danger{color:var(--red)}.mini:disabled{opacity:.35}
    .group-wrap{border-bottom:1px solid var(--line)}.group-wrap:last-child{border-bottom:0}
    .group-header{display:grid;grid-template-columns:auto 1fr auto auto;gap:7px;align-items:center;padding:9px 10px;background:var(--rust);color:#fff}
    .group-header.collapsed{background:var(--indigo)}
    .group-mark{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
    .group-b{border:0;background:transparent;color:#fff;font-size:9px;font-weight:800;text-align:left}
    .group-b small{display:block;margin-top:2px;font-size:7px;opacity:.6}
    .group-header .group-toggle{width:24px;height:24px;border:0;border-radius:7px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
    .group-header .group-toggle.on{background:rgba(255,255,255,.32)}
    .group-items{padding-left:8px;border-left:2px solid #d9e0ea;margin-left:10px}
    .add{width:100%;height:42px;border:0;border-top:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:800}
    .add svg{width:15px;color:var(--rust)}
    .summary{padding:10px 11px;border:1px solid #dbe3ee;border-radius:15px;background:#f7f9fc}
    .sumline{display:flex;justify-content:space-between;min-height:22px;color:var(--sub);font-size:9px}
    .sumline b{color:var(--ink);font:500 9px var(--mono)}
    .sumline.minus{color:var(--red)}.sumline.minus b{color:var(--red)}
    .sumline.dedicated b{color:var(--amber)}
    .sumtotal{display:flex;justify-content:space-between;align-items:end;padding-top:9px;margin-top:5px;border-top:1px solid #e3e9f1}
    .sumtotal small{display:block;color:var(--sub);font-size:8px;font-weight:800;letter-spacing:.08em}
    .sumtotal b{font:500 18px var(--mono);letter-spacing:-.08em;color:var(--rust)}
    .words{padding:8px 10px;margin:8px 0;border:1px dashed #cfcbc3;border-radius:10px;background:var(--soft);font-size:9px;color:var(--sub);font-style:italic}
    .dock{margin:18px 0 0;padding:5px;border-radius:17px;background:var(--ink)}
    .dock-in{display:grid;grid-template-columns:44px 1fr;gap:8px}
    .dock button{height:44px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center}
    .dock .primary{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--rust);font-size:10px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,0.16)}
    .save-fab-popup{position:absolute;z-index:16;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:52px;height:52px;border:0;border-radius:16px;background:var(--rust);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(30,58,95,0.32),0 4px 12px rgba(0,0,0,0.14),inset 0 1px 0 rgba(255,255,255,0.2)}
    .overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:end;background:rgba(15,23,42,.46);backdrop-filter:blur(4px)}
    .sheet{width:100%;max-height:88dvh;overflow:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom));background:var(--paper);border-radius:23px 23px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18)}
    .grip{width:36px;height:4px;border-radius:99px;background:#d2cec7;margin:0 auto 13px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
    .sheet-head h3{margin:0;font:800 17px var(--display);letter-spacing:-.06em}
    .sheet-head button{width:38px;height:38px;border:0;border-radius:12px;background:var(--soft);display:grid;place-items:center}
    .cta{width:100%;height:44px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)}
    .cta.rust{background:var(--rust);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18),0 4px 12px rgba(140,98,13,0.22)}
    .cta.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
    .cta.danger{background:var(--red)}
    .sheet-copy{margin:0 0 14px;color:var(--sub);font-size:10px;line-height:16px}
    .form{display:grid;gap:9px}.two{grid-template-columns:1fr 1fr;gap:8px}.three{grid-template-columns:1fr 1fr 1fr;gap:8px}
    .field label{display:block;margin:0 0 4px;color:var(--sub);font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
    .field input,.field textarea,.field select{width:100%;min-height:40px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:10px;outline:none;font-family:inherit}
    .field textarea{min-height:62px;resize:vertical}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rust);box-shadow:0 0 0 3px var(--rust)/10%}
    .mono{font-family:var(--mono)!important}
    .choice{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;width:100%;min-height:53px;padding:8px 9px;gap:9px;margin:7px 0;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left}
    .choice .cicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--olive-soft);color:var(--olive)}
    .choice.locked .cicon{background:var(--amber);color:#fff}
    .choice b,.choice small{display:block}
    .choice b{font-size:10px}
    .choice small{margin-top:2px;font-size:8.5px;color:var(--sub)}
    .choice>svg{width:15px;color:var(--sub)}
    .switch{width:38px;height:23px;border:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer}
    .switch.on{background:var(--rust)}
    .switch::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .16s}
    .switch.on::after{transform:translateX(15px)}
    .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0}
    .seg button{flex:1;height:28px;border:0;background:var(--paper);color:var(--sub);font-size:8px;font-weight:800}
    .seg button.on{background:var(--rust);color:#fff}
    .list-field{display:flex;gap:4px;align-items:center;margin-bottom:6px}
    .list-field input{flex:1;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:9px;background:var(--soft);color:var(--ink);font-family:inherit}
    .list-field button{width:28px;height:28px;border:0;border-radius:6px;background:var(--soft);color:var(--sub);display:grid;place-items:center}
    .col-row{display:flex;align-items:center;min-height:50px;padding:9px 10px;gap:10px;border-bottom:1px solid var(--line);background:var(--paper)}
    .col-row:last-child{border-bottom:0}
    .col-row b{flex:1;font-size:10px}
    .col-row small{display:block;margin-top:2px;color:var(--sub);font-size:8.5px}
    .toast{width:max-content;position:absolute;z-index:60;left:50%;bottom:80px;transform:translate(-50%,10px);padding:8px 12px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:8px;font-weight:700;opacity:0;transition:all .2s var(--ease);white-space:nowrap;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 11px;border-bottom:1px solid var(--line);background:var(--paper);text-align:left;border:0}
    .row:last-child{border-bottom:0}
    .row.rust{border-left:3px solid var(--rust)}
    .row .r-icon{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--sub);display:grid;place-items:center}
    .row b,.row small{display:block}
    .row b{font-size:10px}
    .row small{margin-top:2px;font-size:8.5px;color:var(--sub)}
    .row>svg{width:15px;color:var(--sub);margin-left:auto}
    .badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:5px;font-size:7px;font-weight:800}
    .badge.green{background:var(--green)/15%;color:var(--green)}
    .badge.blue{background:var(--indigo)/15%;color:var(--indigo)}
    .badge.amber{background:var(--amber)/15%;color:var(--amber)}
    .badge.red{background:var(--red)/15%;color:var(--red)}
    .sig-box{width:100%;height:110px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--sub);margin-bottom:8px;overflow:hidden}
    .sig-box img{max-width:100%;max-height:100%;display:block}
    .price-context{padding:5px 8px;margin:4px 0;border-radius:7px;background:#eff6ff;color:var(--indigo);font-size:8px}
    .suggestion-dropdown{position:absolute;z-index:100;margin-top:4px;width:calc(100% - 30px);max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--paper);box-shadow:0 8px 24px rgba(15,23,42,.14)}
    .suggestion-row{width:100%;padding:8px 10px;text-align:left;border:0;background:transparent;display:flex;justify-content:space-between;align-items:center;font-size:9px;border-bottom:1px solid var(--line)}
    .suggestion-row:last-child{border-bottom:0}
    .suggestion-row:hover{background:var(--soft)}
    .suggestion-row .suggestion-name{color:var(--ink)}.suggestion-row .suggestion-price{color:var(--sub);font-family:var(--mono);font-weight:700}
    .field-wrap{position:relative}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="phone">
    <main id="app"></main>
    <div id="toast" class="toast"></div>
  </div>
  <script>
    const I = n => '<i data-lucide="' + n + '"></i>';
    const uid = () => Math.random().toString(36).slice(2, 9);
    const money = n => 'N' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = s => String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    const q = sel => document.querySelector(sel);
    const qa = sel => document.querySelectorAll(sel);

    window.toast = function (msg, duration = 1400) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(window._toastT);
      window._toastT = setTimeout(() => t.classList.remove('show'), duration);
    };

    window.openSheet = function (sheet, arg) { state.sheet = sheet; state.active = arg || null; render(); };
    window.closeSheet = function () { state.sheet = null; state.active = null; render(); };
    window.tab = function (t) { state.tab = t; render(); };

    // ── State ── mirrors SharedDocumentForm / invoice domain ──
    const state = {
      tab: 'items', sheet: null, active: null, mode: 'create',
      suggestionOpenId: null,
      invoice: {
        type: 'Invoice', title: 'Quarterly equipment overhaul', number: 'INV-2026-0142', po: 'PO-3278',
        client: { id: 'c1', name: 'Adeyemi & Partners', person: 'Ijeoma Adeyemi', initials: 'A&' },
        issue: '2026-08-18', due: '2026-09-01', paymentTerms: 'Net 14',
        customPaymentTerms: 'Payment due within 14 days',
        headers: [{ id: uid(), label: 'Project', value: 'Ikoyi Office Retrofit' }],
        items: [
          { id: uid(), description: 'Molded case circuit breaker 125A', subDescription: '4 pole, adjustable thermal-magnetic trip unit', qty: 3, unit: 'pcs', price: 184000, make: 'Schneider', partNo: 'NSX160F', condition: 'New', installRate: 0, vatRate: 7.5, discountRate: 0, image: null, groupId: 'g1', customData: { colour: 'Black' } },
          { id: uid(), description: 'Copper cable 4mm²', subDescription: 'FR PVC insulated copper cable', qty: 40, unit: 'm', price: 6800, make: 'Nexans', partNo: 'CAB-4MM', condition: 'New', installRate: 0, vatRate: 7.5, discountRate: 0, image: null, groupId: 'g1', customData: { colour: 'Copper' } }
        ],
        groups: [{ id: 'g1', name: 'Electrical materials', showSubtotal: true, collapsed: false }],
        columns: { make: true, unit: true, partNo: true, condition: true, installRate: false, itemVat: true, itemDiscount: true },
        discount: 0, discountType: 'percent', discountTiming: 'after', vat: 7.5, wht: 0, whtType: 'percent',
        workmanship: 15000, transportation: 25000, shipping: 0,
        chargeLabels: { workmanship: 'Workmanship', transportation: 'Transportation', shipping: 'Shipping' },
        extraCharges: [], additionalFields: [{ id: uid(), label: 'Delivery', value: '7 working days' }],
        notes: 'Thank you for the opportunity to support this project.',
        terms: 'Payment is due within fourteen days of issue.',
        notesTitle: 'Notes', termsTitle: 'Terms & Conditions',
        signatory: { id: 'sig-1', name: 'Nneka Okoro', role: 'Operations Director', signature: null },
        links: [{ id: uid(), label: 'Project folder', url: 'https://example.com/ikoyi' }],
        bankAccountId: 'zenith-1',
        pdf: { showBankDetails: true, showFooter: false, showTagline: false, showBalanceDue: true, showAmountInWords: true, showVatPercentage: true, showWhtPercentage: true, showDiscountPercentage: true, compact: false }
      },
      invalidRowIndex: null
    };

    const BANK_ACCOUNTS = [['zenith-1', 'Zenith Bank', '1234567890'], ['gtb-1', 'Guaranty Trust Bank', '0045528713'], ['access-1', 'Access Bank', '0213465780']];
    function selectedBank() { return BANK_ACCOUNTS.find(a => a[0] === state.invoice.bankAccountId) || BANK_ACCOUNTS[0]; }

    const savedClients = [['Adeyemi & Partners', 'Ijeoma Adeyemi', 'A&'], ['Uptown Facilities', 'Oma Okoro', 'UF'], ['Wellspring Homes', 'Wale Peters', 'WH'], ['Bod & Co', 'Ada Nwosu', 'BOC'], ['Crestview Ltd', 'Tayo Mensah', 'CV']];
    const mockSuggestions = [
      { item_id: 'cat-mccb', name: 'Molded case circuit breaker 125A', standard_price: 184000 },
      { item_id: 'cat-cable', name: 'Copper cable 4mm²', standard_price: 6800 },
      { item_id: 'cat-led', name: 'LED panel light 36W', standard_price: 23500 },
      { item_id: 'cat-cement', name: 'Portland cement 50kg', standard_price: 8500 },
      { item_id: 'cat-paint', name: 'Emulsion paint 20L — white', standard_price: 42000 }
    ];
    const priceContextMap = {
      'cat-mccb': 'Last sold NGN 178,000 to Adeyemi & Partners · 3d ago · 12 in stock',
      'cat-cable': 'Last sold NGN 6,500 to Uptown Facilities · 1w ago',
      'cat-led': 'Last sold NGN 22,000 to Wellspring Homes · 2d ago'
    };

    function getFilteredSuggestions(query) {
      const t = String(query || '').trim().toLowerCase();
      if (t.length < 2) return [];
      return mockSuggestions.filter(s => s.name.toLowerCase().includes(t)).slice(0, 5);
    }
    function selectSuggestion(itemId, suggestionId) {
      const s = mockSuggestions.find(x => x.item_id === suggestionId);
      if (!s) return;
      const it = by(itemId);
      if (it) { it.description = s.name; it.price = s.standard_price; it.itemId = s.item_id; }
      state.suggestionOpenId = null;
      render();
      toast('Price suggestion applied');
    }

    function validateRows() {
      let idx = null;
      state.invoice.items.forEach((a, i) => {
        if (!idx && (!a.description || Number(a.price || 0) <= 0 || Number(a.qty || 0) <= 0)) idx = i;
      });
      state.invalidRowIndex = idx;
    }

    function calc() {
      let raw = 0;
      state.invoice.items.forEach(a => {
        const base = a.qty * a.price;
        const disc = base * (a.discountRate || 0) / 100;
        a.line = base - disc;
        raw += a.line;
      });
      const taxable = state.invoice.extraCharges.filter(c => c.withTax).reduce((s, c) => s + Number(c.value || 0), 0);
      const postTax = state.invoice.extraCharges.filter(c => c.withTax === false).reduce((s, c) => s + Number(c.value || 0), 0);
      const ded = state.invoice.discountType === 'percent' ? raw * state.invoice.discount / 100 : state.invoice.discount;
      const pre = state.invoice.discountTiming === 'before' ? ded : 0;
      const vatVal = (raw + taxable - pre) * state.invoice.vat / 100;
      const post = state.invoice.discountTiming === 'after' ? ded : 0;
      const whtVal = state.invoice.whtType === 'percent' ? (raw + taxable + vatVal - post) * state.invoice.wht / 100 : state.invoice.wht;
      const dedicated = (state.invoice.workmanship || 0) + (state.invoice.transportation || 0) + (state.invoice.shipping || 0);
      return { raw, disc: ded, vat: vatVal, wht: whtVal, taxable, nonTax: postTax, dedicated, charges: taxable + postTax + dedicated, total: raw + taxable + postTax + dedicated + vatVal - ded - whtVal };
    }
    function words(n) { return n ? ('Amount in words: ' + money(n) + ' only.') : 'Zero Naira only.'; }
    function by(id) { return state.invoice.items.find(a => a.id === id); }
    function buildSections() {
      const sections = [];
      state.invoice.items.forEach(it => {
        const gid = it.groupId || null;
        const last = sections[sections.length - 1];
        if (last && last.groupId === gid) last.items.push(it);
        else sections.push({ groupId: gid, items: [it] });
      });
      return sections;
    }
    function refreshClientSheet() { if (state.sheet === 'client' && state.mode !== 'edit') render(); }

    // ── Render ──
    function render() {
      const x = state.invoice, t = calc(), isEdit = state.mode === 'edit';
      document.getElementById('app').innerHTML =
        '<header class="nav">'
        + '<button class="icon" aria-label="Back" onclick="toast(\'Back to documents\')">' + I('chevron-left') + '</button>'
        + '<h1>BIGDROPS</h1>'
        + '<button class="icon' + (isEdit ? ' lock' : '') + '" aria-label="Document actions" onclick="openSheet(\'actions\')">' + I(isEdit ? 'lock-keyhole' : 'ellipsis') + '</button>'
        + '</header>'
        + identityRow(x, t, isEdit)
        + modeStrip(isEdit)
        + tabsBar()
        + (state.tab === 'items' ? itemsView(t)
          : state.tab === 'document' ? documentView(t)
          : outputView(t));
      document.getElementById('app').insertAdjacentHTML('beforeend',
        '<button class="dock"><div class="dock-in"><button aria-label="Preview" onclick="openSheet(\'preview\')">' + I('eye') + '</button><button class="primary" aria-label="Save" onclick="commit()">' + I('save') + (isEdit ? 'Save' : 'Create invoice') + '</button></div></div>'
        + (state.sheet ? sheet() : '')
      );
      // O11 floating save FAB
      const fab = document.createElement('button');
      fab.className = 'save-fab-popup';
      fab.setAttribute('aria-label', 'Quick save');
      fab.innerHTML = I('save');
      fab.onclick = () => commit();
      document.getElementById('app').appendChild(fab);
      lucide.createIcons({ attrs: { 'stroke-width': '1.8' } });
    }

    function identityRow(x, t, isEdit) {
      return '<section class="identity">'
        + '<button class="type" onclick="openSheet(\'type\')" aria-label="Document type">' + I(x.type === 'Invoice' ? 'receipt-text' : 'file-text') + '</button>'
        + '<div><b>' + esc(x.title || 'Untitled document') + '</b><span>' + esc(x.number) + ' · ' + (isEdit ? 'RECORDED' : 'DRAFT') + '</span></div>'
        + '<button class="total" onclick="openSheet(\'send\')"><small>PAYABLE</small><strong>' + money(t.total) + '</strong></button>'
        + '</section>';
    }

    function modeStrip(isEdit) {
      return '<div class="mode-strip">'
        + '<button class="lock" onclick="openSheet(\'client\')">' + I('lock-keyhole') + (isEdit ? ' Identity locked' : ' Client') + '</button>'
        + '<button onclick="openSheet(\'import\')">' + I('file-input') + ' Import</button>'
        + '<button onclick="openSheet(\'columns\')">' + I('table-properties') + ' Columns</button>'
        + '<button onclick="openSheet(\'preview\')">' + I('eye') + ' Preview</button>'
        + '</div>';
    }
    function tabsBar() {
      return '<div class="tabs">'
        + '<button class="' + (state.tab === 'items' ? 'on' : '') + '" onclick="tab(\'items\')">Items</button>'
        + '<button class="' + (state.tab === 'document' ? 'on' : '') + '" onclick="tab(\'document\')">Document</button>'
        + '<button class="' + (state.tab === 'output' ? 'on' : '') + '" onclick="tab(\'output\')">Output</button>'
        + '</div>';
    }

    function itemsView(t) {
      const x = state.invoice;
      const sections = buildSections();
      return clientBlock()
        + '<div class="block">'
        + '<div class="cap"><h2 class="amber">Line items · ' + x.items.length + '</h2><button onclick="openSheet(\'columns\')">' + esc('Fields') + ' ' + I('sliders-horizontal') + '</button></div>'
        + '<div class="cell-box">'
        + sections.map(s => sectionBlock(s, t)).join('')
        + '<button class="add" onclick="addItem()">' + I('plus') + ' Add line item</button>'
        + '</div></div>'
        + '<div class="block"><div class="cap"><h2 class="green">Totals</h2><button onclick="openSheet(\'terms\')">' + esc('Edit') + ' ' + I('badge-percent') + '</button></div>' + summary(t) + '</div>';
    }

    function sectionBlock(sec, t) {
      const nums = state.invoice.items;
      if (!sec.groupId) return sec.items.map(a => item(a, nums.indexOf(a))).join('');
      const g = state.invoice.groups.find(gr => gr.id === sec.groupId);
      if (!g) return sec.items.map(a => item(a, nums.indexOf(a))).join('');
      const sum = sec.items.reduce((s, a) => s + (a.line || 0), 0);
      const collapsed = g.collapsed; // O5 group collapse
      return '<div class="group-wrap">'
        + '<header class="group-header' + (collapsed ? ' collapsed' : '') + '">'
        + '<button class="group-mark" aria-label="' + (collapsed ? 'Expand group' : 'Collapse group') + '" onclick="groupCollapse(\'' + g.id + '\')">' + I(collapsed ? 'chevron-down' : 'chevron-up') + '</button>'
        + '<div class="group-b"><b>' + esc(g.name) + '</b><small>GID ' + esc(g.id.slice(0, 4)) + '</small></div>'
        + '<span class="group-sum"><small>SUBTOTAL</small><b>' + (g.showSubtotal ? money(sum) : 'hidden') + '</b></span>'
        + '<button class="group-toggle' + (g.showSubtotal ? ' on' : '') + '" aria-label="Toggle group subtotal" onclick="groupToggle(\'' + g.id + '\')">' + I('calculator') + '</button>'
        + '<button class="group-toggle" aria-label="Ungroup items" onclick="ungroup(\'' + g.id + '\')">' + I('git-pull-request') + '</button>'
        + '</header>'
        + '<div class="group-items" style="' + (collapsed ? 'display:none' : '') + '">'
        + sec.items.map(a => item(a, nums.indexOf(a))).join('')
        + '</div></div>';
    }
    function groupToggle(id) { const g = state.invoice.groups.find(gr => gr.id === id); if (g) { g.showSubtotal = !g.showSubtotal; render(); toast('Subtotal ' + (g.showSubtotal ? 'shown' : 'hidden')); } }
    function groupCollapse(id) { const g = state.invoice.groups.find(gr => gr.id === id); if (g) { g.collapsed = !g.collapsed; render(); toast(g.collapsed ? 'Group collapsed' : 'Group expanded'); } }
    function ungroup(gid) { state.invoice.items.forEach(a => { if (a.groupId === gid) a.groupId = null; }); state.invoice.groups = state.invoice.groups.filter(g => g.id !== gid); render(); toast('Items ungrouped'); }

    function item(a, i) {
      const invalid = i === state.invalidRowIndex; // O19
      const hasImage = !!a.image;
      return '<article class="item' + (invalid ? ' invalid' : '') + '" data-id="' + a.id + '">'
        + '<button class="item-main" onclick="openSheet(\'item\',\'' + a.id + '\')">'
        + '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>'
        + '<span class="item-copy"><b title="' + esc(a.description) + '">' + esc((a.description || 'Item description').slice(0, 34)) + '</b>'
        + '<span>' + a.qty + ' ' + esc(a.unit) + ' × ' + money(a.price) + '</span>'
        + (hasImage ? '<span style="color:var(--green)">📎 1 photo</span>' : '')
        + '<span>' + esc(a.subDescription || '').slice(0, 38) + '</span>'
        + '</span>'
        + (invalid ? '<span title="Fix this row" style="color:var(--red)">' + I('alert-circle') + '</span>' : '')
        + '<span class="amount"><b>' + money(a.line) + '</b><small>' + esc(a.make || 'No make') + '</small></span>'
        + I('chevron-right')
        + '</button>'
        + '<div class="item-tools">'
        + '<button class="mini" aria-label="Move up" ' + (i === 0 ? 'disabled' : '') + ' onclick="moveItem(\'' + a.id + '\',-1)">' + I('arrow-up') + '</button>'
        + '<button class="mini" aria-label="Move down" ' + (i === state.invoice.items.length - 1 ? 'disabled' : '') + ' onclick="moveItem(\'' + a.id + '\',1)">' + I('arrow-down') + '</button>'
        + '<button class="mini" onclick="openSheet(\'item\',\'' + a.id + '\')">' + esc('Edit') + '</button>'
        + '<button class="mini" onclick="duplicateItem(\'' + a.id + '\')" aria-label="Duplicate">' + I('copy') + '</button>'
        + '<button class="mini danger" aria-label="Remove" onclick="removeItem(\'' + a.id + '\')">' + I('trash-2') + '</button>'
        + '</div></article>';
    }
    function duplicateItem(id) { const it = Object.assign({}, by(id)); it.id = uid(); it.description += ' (Copy)'; it.image = null; state.invoice.items.splice(state.invoice.items.findIndex(a => a.id === id) + 1, 0, it); render(); toast('Item duplicated'); }
    function addItem() {
      const a = { id: uid(), description: 'New line item', subDescription: '', qty: 1, unit: 'pcs', price: 0, make: '', partNo: '', condition: 'New', installRate: 1500, vatRate: 7.5, discountRate: 0, image: null, groupId: null, customData: {} };
      state.invoice.items.push(a); openSheet('item', a.id);
    }
    function insertAfter(id) {
      const idx = state.invoice.items.findIndex(a => a.id === id);
      state.invoice.items.splice(idx + 1, 0, { id: uid(), description: 'New line item', subDescription: '', qty: 1, unit: 'pcs', price: 0, make: '', partNo: '', condition: 'New', installRate: 0, vatRate: 7.5, discountRate: 0, image: null, groupId: state.invoice.items[idx] ? state.invoice.items[idx].groupId : null, customData: {} });
      render(); toast('Item inserted below');
    }
    function removeItem(id) { state.invoice.items = state.invoice.items.filter(a => a.id !== id); closeSheet(); toast('Line item removed'); }
    function moveItem(id, d) {
      const a = state.invoice.items, i = a.findIndex(x => x.id === id), j = i + d;
      if (j < 0 || j >= a.length) return;
      if (a[i].groupId !== a[j].groupId) { toast('Cannot move across groups'); return; }
      const [m] = a.splice(i, 1); a.splice(j, 0, m); render(); toast(d < 0 ? 'Moved up' : 'Moved down');
    }

    function clientBlock() {
      const x = state.invoice, isEdit = state.mode === 'edit';
      return '<div class="block">'
        + '<div class="cap"><h2 class="indigo">Client</h2><button onclick="openSheet(\'client\')">' + (isEdit ? 'Protected' : 'Change') + ' ' + I(isEdit ? 'lock-keyhole' : 'pencil') + '</button></div>'
        + '<div class="cell-box">'
        + '<button class="client' + (isEdit ? ' locked' : '') + '" onclick="openSheet(\'client\')">'
        + '<span class="avatar">' + (isEdit ? I('lock-keyhole') : esc(x.client.initials)) + '</span>'
        + '<span><small>' + (isEdit ? 'Client identity' : 'Bill to') + '</small><b>' + esc(x.client.name) + '</b><em>' + esc(x.client.person) + '</em></span>'
        + I('chevron-right')
        + '</button>'
        + '<div class="info-grid"><div class="info"><b>Payment</b><small>' + esc(x.paymentTerms) + '</small></div><div class="info warn"><b>Due ' + new Date(x.due + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + '</b><small>' + Math.max(0, Math.round((new Date(x.due) - new Date()) / 864e5)) + ' days remaining</small></div></div>'
        + '</div></div>';
    }

    function documentView(t) {
      const x = state.invoice;
      return clientBlock()
        + '<div class="block"><div class="cap"><h2 class="amber">Document details</h2><button onclick="openSheet(\'details\')">' + esc('Edit') + ' ' + I('pencil') + '</button></div>'
        + '<div class="cell-box">'
        + '<button class="row" onclick="openSheet(\'details\')"><span class="r-icon">' + I('file-pen-line') + '</span><span><b>' + esc(x.title) + '</b><small>' + esc(x.number) + ' · PO ' + esc(x.po || 'not set') + '</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'dates\')"><span class="r-icon">' + I('calendar-days') + '</span><span><b>Issue date · ' + x.issue + '</b><small>Due date · ' + x.due + '</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'headers\')"><span class="r-icon">' + I('rows-3') + '</span><span><b>' + x.headers.length + ' header field' + (x.headers.length === 1 ? '' : 's') + '</b><small>Project, PO or reference</small></span>' + I('chevron-right') + '</button>'
        + '</div></div>'
        + '<div class="block"><div class="cap"><h2 class="amber">Commercial terms</h2><button onclick="openSheet(\'terms\')">' + esc('Edit') + ' ' + I('badge-percent') + '</button></div>'
        + '<div class="cell-box">'
        + '<button class="row rust" onclick="openSheet(\'terms\')"><span class="r-icon">' + I('receipt') + '</span><span><b>VAT ' + x.vat + '% · Discount ' + (x.discount || 'not set') + '</b><small>Tax timing, withholding, dedicated charges</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'notes\')"><span class="r-icon">' + I('notebook-pen') + '</span><span><b>Notes & terms</b><small>' + (x.notes ? 'Copy included' : 'No customer copy added') + '</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'additional\')"><span class="r-icon">' + I('list-plus') + '</span><span><b>Additional fields</b><small>' + (x.additionalFields.length ? 'Included in PDF' : 'No fields') + '</small></span>' + I('chevron-right') + '</button>'
        + '</div></div>'
        + summary(t);
    }

    function outputView(t) {
      const x = state.invoice, bank = selectedBank();
      return '<div class="block"><div class="cap"><h2 class="violet">Output & sharing</h2><button onclick="openSheet(\'preview\')">' + esc('Preview') + ' ' + I('eye') + '</button></div>'
        + '<div class="cell-box">'
        + '<button class="row" onclick="openSheet(\'attachments\')"><span class="r-icon">' + I('paperclip') + '</span><span><b>Attachments</b><small>' + x.links.length + ' reference link' + (x.links.length === 1 ? '' : 's') + '</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'signatory\')"><span class="r-icon">' + I('signature') + '</span><span><b>' + esc(x.signatory.name || 'No signatory') + '</b><small>Signing block for PDF</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row" onclick="openSheet(\'links\')"><span class="r-icon">' + I('link-2') + '</span><span><b>Reference links</b><small>' + x.links.length + ' linked reference' + (x.links.length === 1 ? '' : 's') + '</small></span>' + I('chevron-right') + '</button>'
        + '<button class="row rust" onclick="openSheet(\'pdf\')"><span class="r-icon">' + I('file-output') + '</span><span><b>PDF output settings</b><small>' + (x.pdf.showBankDetails ? bank[1] + ' selected' : 'Bank, tagline, values and labels') + '</small></span>' + I('chevron-right') + '</button>'
        + '</div></div>'
        + '<div class="block"><div class="cap"><h2 class="green">Recipient total</h2></div>' + summary(t) + '</div>';
    }

    // O10 totals summary with VAT-adjust + O22 color label
    function summary(t) {
      const x = state.invoice;
      return '<div class="summary">'
        + sumline('Subtotal', t.raw)
        + (t.disc ? sumline('Discount', -t.disc, true) : '')
        + (t.taxable ? '<div class="sumline"><span>VAT on charges</span><b>' + money(t.taxable) + '</b></div>' : '')
        + (state.invoice.workmanship ? sumline('Workmanship', state.invoice.workmanship, false, true) : '')
        + (state.invoice.transportation ? sumline('Transportation', state.invoice.transportation, false, true) : '')
        + (state.invoice.shipping ? sumline('Shipping', state.invoice.shipping, false, true) : '')
        + (t.vat ? '<div class="sumline"><span>VAT' + (x.pdf.showVatPercentage ? ' (' + x.vat + '%)' : '') + '</span><b>' + money(t.vat) + '</b></div>' : '')
        + (t.nonTax ? '<div class="sumline"><span>Extra charges</span><b>' + money(t.nonTax) + '</b></div>' : '')
        + (t.wht ? '<div class="sumline minus"><span>WHT' + (x.pdf.showWhtPercentage ? ' (' + x.wht + '%)' : '') + '</span><b>−' + money(t.wht) + '</b></div>' : '')
        + '<div style="margin-top:6px"><button class="mini" aria-label="Adjust VAT" onclick="openSheet(\'vat\')">' + I('percent') + ' VAT adjust</button></div>'
        + (x.pdf.showAmountInWords ? '<div class="words">' + words(t.total) + '</div>' : '')
        + '<div class="sumtotal"><small>Grand total</small><b>' + money(t.total) + '</b></div>'
        + '</div>';
    }
    function sumline(label, val, negative, dedicated) {
      const n = negative ? '-' : '';
      return '<div class="sumline ' + (negative ? 'minus' : '') + ' ' + (dedicated ? 'dedicated' : '') + '"><span>' + label + '</span><b>' + n + money(Math.abs(val || 0)) + '</b></div>';
    }

    function head(title, copy) {
      return '<div class="grip"></div><div class="sheet-head"><h3>' + title + '</h3><button aria-label="Close" onclick="closeSheet()">' + I('x') + '</button></div>'
        + (copy ? '<p class="sheet-copy">' + copy + '</p>' : '');
    }

    function sheet() {
      const m = {
        'client': clientSheet, 'clientCreate': clientCreateSheet, 'type': typeSheet,
        'item': itemSheet, 'details': detailsSheet, 'dates': datesSheet, 'headers': headersSheet,
        'terms': termsSheet, 'vat': vatSheet, 'notes': notesSheet, 'additional': additionalSheet,
        'attachments': attachmentsSheet, 'signatory': signatorySheet, 'links': linksSheet,
        'pdf': pdfSheet, 'bank': bankSheet, 'columns': columnsSheet, 'import': importSheet,
        'actions': actionsSheet, 'preview': previewSheet, 'send': sendSheet
      };
      const fn = m[state.sheet];
      if (!fn) return '';
      return '<aside class="overlay" role="dialog" aria-modal="true" onclick="if(event.target===this)closeSheet()"><section class="sheet">' + fn() + '</section></aside>';
    }

    function clientSheet() {
      const isEdit = state.mode === 'edit';
      if (isEdit) return head('Client identity locked', 'This is a recorded document. Its client is protected to preserve the audit trail.')
        + '<button class="choice locked"><span class="cicon">' + I('shield-check') + '</span><span><b>Duplicate as new document</b><small>Create a new draft with exact items and terms.</small></span>' + I('copy-plus') + '</button>'
        + '<button class="cta rust" onclick="duplicate()">' + I('copy-plus') + ' Duplicate as new</button>';
      return head('Choose client', 'Set client_name together from the client selector.')
        + '<div class="client-search"><input id="clientSearch" placeholder="Search clients…" oninput="refreshClientSheet()" /></div>'
        + '<div id="clientList">' + clientSheetList() + '</div>'
        + '<div class="client-create"><button class="cta ghost" onclick="openSheet(\'clientCreate\')">' + I('user-plus') + ' Add new client</button></div>';
    }
    function clientSheetList() {
      const qv = String(q('#clientSearch') ? q('#clientSearch').value : '').toLowerCase();
      const list = savedClients.filter(a => !qv || a[0].toLowerCase().includes(qv) || a[1].toLowerCase().includes(qv));
      if (!list.length) return '<div style="padding:12px;font-size:8px;color:var(--sub)">No clients match "' + esc(qv) + '"</div>';
      return list.map(a => '<button class="choice" onclick="chooseClientByName(\'' + a[0].replace(/'/g, '&#39;') + '\')"><span class="cicon">' + a[2] + '</span><span><b>' + esc(a[0]) + '</b><small>' + esc(a[1]) + '</small></span>' + I('chevron-right') + '</button>').join('');
    }
    function clientCreateSheet() {
      return head('New client', 'Fill the client form. On save the client is selected for this invoice.')
        + '<div class="form">'
        + '<div class="field"><label>Company name</label><input id="newClientName" placeholder="Adeyemi & Partners"></div>'
        + '<div class="field"><label>Contact person</label><input id="newClientPerson" placeholder="Ijeoma Adeyemi"></div>'
        + '<div class="field"><label>Email</label><input id="newClientEmail" type="email" placeholder="contact@example.com"></div>'
        + '<div class="field"><label>Phone</label><input id="newClientPhone" placeholder="+234 800 000 0000"></div>'
        + '</div><button class="cta rust" onclick="saveNewClient()">' + I('save') + ' Create client</button>';
    }
    window.chooseClientByName = function (name) {
      const a = savedClients.find(c => c[0] === name);
      if (a) { state.invoice.client = { id: 'c-' + uid(), name: a[0], person: a[1], initials: a[2] }; }
      closeSheet(); toast('Client selected');
    };
    window.saveNewClient = function () {
      const name = q('#newClientName').value.trim();
      const person = q('#newClientPerson').value.trim();

        arr.forEach(o => {
          if (!o || typeof o !== 'object' || !o.description) return;
          state.invoice.items.push({ id: uid(), description: String(o.description), subDescription: o.subDescription || '', qty: Number(o.qty) || 1, unit: o.unit || 'pcs', price: Number(o.price) || 0, make: o.make || '', partNo: o.partNo || '', condition: o.condition || 'New', installRate: Number(o.installRate || 0), vatRate: Number(o.vatRate || 7.5), discountRate: Number(o.discountRate || 0), image: null, groupId: null, customData: o.customData || {} });
          added++;
        });
        closeSheet(); toast(added + ' item' + (added === 1 ? '' : 's') + ' imported');
      } catch (e) { toast('Invalid JSON: ' + e.message); }
    };

    // O14 document action sheet — 11 actions mirroring DocumentActionKey list
    function actionsSheet() {
      const isEdit = state.mode === 'edit';
      return head(isEdit ? 'Document actions' : 'Document actions', 'Choose an action.')
        + '<div class="form">'
        + actionRow('payment', 'Payment', 'Record a payment', 'credit-card', isEdit)
        + actionRow('copy', 'Copy link', 'Share a view-only link', 'link', true)
        + actionRow('clone', 'Clone', 'Duplicate as a new draft', 'copy-plus', true)
        + actionRow('convert', 'Convert', 'Change document type', 'Refresh-ccw', true)
        + actionRow('archive', 'Archive', isEdit ? 'Archive this recorded document' : 'Archive draft', 'archive', isEdit)
        + actionRow('delete', 'Delete', isEdit ? 'Delete permanently' : 'Delete this draft', 'trash-2', true, 'danger')
        + actionRow('open', 'Open', 'Open in browser', 'external-link', true)
        + actionRow('export', 'Export PDF', 'Download the rendered PDF', 'file-output', isEdit)
        + actionRow('pdf', 'Export to PDF tool', 'Open the full PDF tool', 'printer', true)
        + actionRow('projectLink', 'Project link', 'Open linked project', 'folder-open', true)
        + actionRow('documentsView', 'View documents', 'See all documents', 'files', true)
        + '</div>';
    }
    function actionRow(key, label, sub, icon, enabled, variant) {
      if (!enabled) return '<button class="row" style="opacity:.35;cursor:not-allowed">' + iconCell(icon) + '<span><b>' + esc(label) + '</b><small>' + esc(sub) + '</small></span>' + I('chevron-right') + '</button>';
      const danger = variant === 'danger' ? 'danger' : '';
      return '<button class="row ' + danger + '" onclick="doAction(\'' + key + '\')">' + iconCell(icon) + '<span><b>' + esc(label) + '</b><small>' + esc(sub) + '</small></span>' + I('chevron-right') + '</button>';
    }
    function iconCell(icon) { return '<span class="r-icon">' + I(icon) + '</span>'; }
    window.doAction = function (key) {
      const labels = { payment: 'Payment received', copy: 'Link copied', clone: 'Cloned as new draft', convert: 'Type changed', archive: 'Archived', delete: 'Deleted', open: 'Opened', export: 'PDF exported', pdf: 'PDF tool opened', projectLink: 'Project opened', documentsView: 'Documents opened' };
      closeSheet(); toast(labels[key] || ('Action: ' + key));
    };

    function previewSheet() {
      return head('Preview', 'A rendering preview of the current document.')
        + '<div class="sig-box" style="height:180px">' + I('eye') + '</div>'
        + '<p class="sheet-copy">The preview above mirrors the PDF rendering of the current state.</p>'
        + '<button class="cta rust" onclick="downloadPdf()">' + I('download') + ' Download PDF</button>';
    }
    window.downloadPdf = function () { toast('Downloading PDF… (rendering stub)'); closeSheet(); };

    function sendSheet() {
      return head('Send / share', 'Send this document to your client.')
        + '<div class="form">'
        + '<div class="field"><label>Recipient email</label><input id="sendEmail" type="email" placeholder="client@example.com"></div>'
        + '<div class="field"><label>Message</label><textarea placeholder="Please find the attached invoice for your review."></textarea></div>'
        + '</div><button class="cta rust" onclick="sendDocument()">' + I('send') + ' Send document</button>';
    }
    window.sendDocument = function () { closeSheet(); toast('Document sent (stub)'); };

    // ── top-level commit / duplicate / insert helpers ──
    function commit() { validateRows(); toast('Saved'); }
    window.commit = commit;
    function duplicate() { toast('Duplicated as new draft'); }
    window.duplicate = duplicate;
    function insertBelowConfirm(id) { insertAfter(id); }
    window.insertBelowConfirm = insertBelowConfirm;

    render();
    lucide.createIcons({ attrs: { 'stroke-width': '1.8' } });
  </script>
</body>
</html>
