<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f0f4f8"><title>BIGDROPS — Invoice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --canvas:#f0f4f8;--paper:#fff;--ink:#0f172a;--sub:#64748b;--line:rgba(15,23,42,.08);
      --soft:#f8fafc;--rust:#1e3a5f;--rust-soft:#eef2ff;--red:#ef4444;--red-soft:#fee2e2;
      --amber:#b45309;--amber-soft:#fef3c7;--green:#059669;--green-soft:#d1fae5;
      --indigo:#4f46e5;--indigo-soft:#e0e7ff;--violet:#7c3aed;--violet-soft:#ede9fe;
      --mono:"DM Mono",monospace;--body:Manrope,sans-serif;--display:Syne,sans-serif;
      --ease:cubic-bezier(.2,.8,.2,1);--nav-offset:88px;
    }
    [data-theme="dark"]{
      --canvas:#0b1120;--paper:#111827;--ink:#e2e8f0;--sub:#94a3b8;--line:rgba(148,163,184,.12);
      --soft:#1e293b;--rust:#60a5fa;--rust-soft:rgba(96,165,250,.12);--red:#f87171;--red-soft:rgba(248,113,113,.1);
      --amber:#fbbf24;--amber-soft:rgba(251,191,36,.1);--green:#34d399;--green-soft:rgba(52,211,153,.1);
      --indigo:#818cf8;--indigo-soft:rgba(129,140,248,.1);--violet:#a78bfa;--violet-soft:rgba(167,139,250,.1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0}
    html,body{background:var(--canvas);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;height:100%}
    button,input,textarea,select{font:inherit;border:0;outline:0;background:none;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.97)}
    svg{width:18px;height:18px;stroke-width:1.8}

    .phone{width:min(100%,420px);height:100dvh;margin:auto;background:var(--paper);position:relative;overflow:hidden}
    main{height:100dvh;overflow-y:auto;padding:0 16px calc(var(--nav-offset) + env(safe-area-inset-bottom));scrollbar-width:none}
    main::-webkit-scrollbar{display:none}

    /* Nav */
    .nav{display:flex;align-items:center;height:52px;padding:0 4px;gap:4px;position:sticky;top:0;z-index:10;background:var(--paper)}
    .nav-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
    .nav-btn:hover{background:var(--soft)}
    .nav h1{flex:1;text-align:center;font:800 15px var(--display);letter-spacing:-.04em}
    .nav-save{width:40px;height:40px;border-radius:12px;background:var(--rust);color:#fff;display:grid;place-items:center}

    /* Sections */
    .section{margin-bottom:16px}
    .section-label{font:700 9px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;padding-left:2px}

    /* Field row */
    .f-row{display:flex;gap:8px;margin-bottom:8px}
    .f-row>.f{flex:1}
    .f{margin-bottom:8px}
    .f label{display:block;font:600 8px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:3px}
    .f input,.f textarea,.f select{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:12px;background:var(--soft)}
    .f textarea{height:72px;padding:10px 12px;resize:vertical}
    .f input:focus,.f textarea:focus,.f select:focus{border-color:var(--rust);background:var(--paper)}

    /* Client card */
    .client-card{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s}
    .client-card:hover{border-color:var(--rust)}
    .client-avatar{width:40px;height:40px;border-radius:12px;background:var(--rust-soft);color:var(--rust);display:grid;place-items:center;font:800 14px var(--display);flex-shrink:0}
    .client-info{flex:1;min-width:0}
    .client-name{font:700 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .client-detail{font:500 10px var(--body);color:var(--sub);margin-top:2px}
    .client-arrow{color:var(--sub);flex-shrink:0}

    /* Quick chips */
    .chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .chips::-webkit-scrollbar{display:none}
    .chip{display:flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font:600 10px var(--body);color:var(--ink);white-space:nowrap;flex-shrink:0}
    .chip:hover{background:var(--soft)}
    .chip svg{width:14px;height:14px}
    .chip.accent{background:var(--rust);color:#fff;border-color:var(--rust)}

    /* Item card */
    .item-card{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
    .item-card.invalid{box-shadow:inset 3px 0 0 var(--red)}
    .item-top{display:flex;align-items:center;gap:8px;padding:10px 12px}
    .item-num{width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font:700 9px var(--mono);color:var(--sub);flex-shrink:0}
    .item-name{flex:1;min-width:0;font:600 12px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-amt{font:700 12px var(--mono);color:var(--rust);flex-shrink:0}
    .item-btns{display:flex;gap:2px;flex-shrink:0}
    .item-btns button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--sub)}
    .item-btns button:hover{background:var(--soft);color:var(--ink)}
    .item-btns .del:hover{color:var(--red)}

    /* Group bar */
    .grp{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:linear-gradient(115deg,#0f172a 0%,#1e3a5f 55%,#334155 100%);color:#fff}
    .grp .g-icon{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center}
    .grp .g-name{flex:1;font:700 11px var(--body)}
    .grp .g-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:rgba(255,255,255,.7)}
    .grp .g-btn:hover{background:rgba(255,255,255,.12);color:#fff}

    /* Totals */
    .totals{position:sticky;bottom:0;left:0;right:0;padding:12px 16px;background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;z-index:5}
    .totals-info{flex:1}
    .totals-lbl{font:500 9px var(--body);color:var(--sub)}
    .totals-val{font:800 20px var(--mono);color:var(--ink);letter-spacing:-.02em}
    .totals-sub{font:500 10px var(--mono);color:var(--sub);margin-top:1px}
    .totals-send{height:44px;padding:0 20px;border-radius:12px;background:var(--rust);color:#fff;font:800 12px var(--body);display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(30,58,95,.25)}

    /* Overlay — SINGLE element, properly managed */
    .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
    .overlay.open{display:flex}
    .sheet{width:min(100%,420px);max-height:82dvh;background:var(--paper);border-radius:20px 20px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;transform:translateY(100%);transition:transform .28s var(--ease)}
    .overlay.open .sheet{transform:translateY(0)}
    .sheet-grip{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .sheet-head h2{font:800 17px var(--display);letter-spacing:-.04em}
    .sheet-x{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center}
    .s-field{margin-bottom:10px}
    .s-field label{display:block;font:600 9px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
    .s-field input,.s-field textarea,.s-field select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px;background:var(--soft)}
    .s-field textarea{height:80px;padding:10px 12px;resize:vertical}
    .s-field input:focus,.s-field textarea:focus{border-color:var(--rust);background:var(--paper)}
    .s-btn{width:100%;height:44px;border-radius:12px;font:700 12px var(--body);display:flex;align-items:center;justify-content:center;gap:6px}
    .s-btn.primary{background:var(--rust);color:#fff}
    .s-btn.ghost{border:1px solid var(--line);color:var(--ink);margin-top:8px}
    .s-btn.red{border:1px solid var(--red);color:var(--red);margin-top:8px}

    /* Choice list (for client picker, type picker) */
    .choice{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);border-radius:12px;text-align:left;background:var(--paper);transition:border-color .12s}
    .choice:hover{border-color:var(--rust)}
    .choice .c-icon{width:36px;height:36px;border-radius:10px;background:var(--rust-soft);color:var(--rust);display:grid;place-items:center;flex-shrink:0;font:800 13px var(--display)}
    .choice .c-info{flex:1;min-width:0}
    .choice .c-name{display:block;font:700 12px var(--body)}
    .choice .c-sub{display:block;font:500 10px var(--body);color:var(--sub);margin-top:1px}
    .choice.active{border-color:var(--rust);background:var(--rust-soft)}

    /* Empty */
    .empty{text-align:center;padding:28px 16px}
    .empty svg{width:32px;height:32px;color:var(--line);margin-bottom:8px}
    .empty p{font:500 12px var(--body);color:var(--sub)}

    /* Toast */
    .toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,10px);padding:8px 16px;border-radius:99px;background:var(--ink);color:var(--paper);font:700 11px var(--body);opacity:0;transition:all .2s var(--ease);z-index:100;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <div class="phone" data-theme="light">
    <main id="app"></main>
    <div id="sheetOverlay" class="overlay" onclick="if(event.target===this)closeSheet()">
      <div class="sheet"><div class="sheet-grip"></div><div id="sheetContent"></div></div>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const I = n => '<i data-lucide="' + n + '"></i>';
    const uid = () => Math.random().toString(36).slice(2, 9);
    const money = n => '\u20A6' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    const q = s => document.querySelector(s);

    /* ═══ STATE ═══ */
    const state = {
      mode: 'create',
      sheet: null,
      sheetArg: null,
      searchClient: '',
      theme: localStorage.getItem('bd-theme') || 'light',

      invoice: {
        title: 'Service Invoice',
        number: 'INV-0047',
        poNumber: '',
        date: new Date().toISOString().slice(0, 10),
        dueDate: '',
        type: 'service',
        client: null,

        items: [
          { id: 'i1', description: 'UI/UX Design Sprint', quantity: 1, unit: 'lot', unit_price: 250000, discount_rate: 0, vat_rate: null, groupId: 'g1', image_url: '', make: '', partNo: '', condition: '', sub_description: '' },
          { id: 'i2', description: 'Frontend Development', quantity: 1, unit: 'lot', unit_price: 450000, discount_rate: 0, vat_rate: null, groupId: 'g1', image_url: '', make: '', partNo: '', condition: '', sub_description: '' },
          { id: 'i3', description: 'API Integration', quantity: 1, unit: 'lot', unit_price: 180000, discount_rate: 0, vat_rate: null, groupId: null, image_url: '', make: '', partNo: '', condition: '', sub_description: '' }
        ],
        groups: [{ id: 'g1', name: 'Development Phase', collapsed: false }],

        payment_terms: 'Net 30',
        custom_payment_terms: '',
        discount: 0,
        discountType: 'percent',
        discountTiming: 'after_vat',
        vat: 7.5,
        wht: 0,
        whtType: 'percent',
        extraCharges: [],
        additionalFields: [],

        notes: '',
        terms: '',
        signatory: { name: '', title: '', image: null },
        links: [],
        bank: { name: '', number: '', sortCode: '' },

        commercial: { subtotal: 0, vat: 0, wht: 0, total: 0 }
      },

      savedClients: [
        { name: 'Andela Nigeria', email: 'billing@andela.com', phone: '+234 801 234 5678', address: '14 Broad St, Lagos Island', city: 'Lagos', state: 'Lagos' },
        { name: 'Flutterwave Inc', email: 'pay@flutterwave.com', phone: '+234 908 765 4321', address: '21 Ozumba Mbadiwe Ave, VI', city: 'Lagos', state: 'Lagos' },
        { name: 'Kuda Microfinance', email: 'accounts@kuda.com', phone: '+234 700 111 2233', address: '15 Adeola Odeku St, VI', city: 'Lagos', state: 'Lagos' },
        { name: 'Paystack', email: 'finance@paystack.com', phone: '+234 812 345 6789', address: '42 Saka Tinubu St, VI', city: 'Lagos', state: 'Lagos' },
        { name: 'Interswitch', email: 'ops@interswitch.com', phone: '+234 803 456 7890', address: '164 Broad St, Lagos Island', city: 'Lagos', state: 'Lagos' }
      ],

      savedSignatories: [
        { name: 'Adewale Smith', title: 'CEO', image: null },
        { name: 'Chidinma Obi', title: 'CFO', image: null }
      ]
    };

    /* ═══ OVERLAY SYSTEM ═══ */
    const overlay = q('#sheetOverlay');
    const sheetContent = q('#sheetContent');

    function openSheet(name, arg) {
      state.sheet = name;
      state.sheetArg = arg;
      renderSheetContent();
      overlay.classList.add('open');
    }

    function closeSheet() {
      overlay.classList.remove('open');
      state.sheet = null;
      state.sheetArg = null;
    }

    function renderSheetContent() {
      const fns = {
        client: shClient, clientCreate: shClientCreate, type: shType,
        itemEdit: shItemEdit, vat: shVat, signatory: shSignatory,
        links: shLinks, bank: shBank, pdf: shPdf, actions: shActions,
        import: shImport, preview: shPreview, charges: shCharges,
        fields: shFields, notes: shNotes
      };
      const fn = fns[state.sheet];
      sheetContent.innerHTML = fn ? fn() : '';
      lucide.createIcons();
    }

    function toast(msg) {
      const t = q('#toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ═══ CALCULATIONS ═══ */
    function calc() {
      const x = state.invoice;
      let itemsTotal = 0;
      x.items.forEach(it => {
        let line = (it.quantity || 0) * (it.unit_price || 0);
        if (it.discount_rate) line -= line * it.discount_rate / 100;
        itemsTotal += line;
      });
      let subtotal = itemsTotal;
      x.extraCharges.forEach(c => { subtotal += Number(c.value) || 0; });
      if (x.discountType === 'percent') subtotal -= subtotal * (x.discount || 0) / 100;
      else subtotal -= (x.discount || 0);
      const vat = subtotal * (x.vat || 0) / 100;
      const wht = subtotal * (x.wht || 0) / 100;
      return { itemsTotal, subtotal, vat, wht, total: subtotal + vat - wht };
    }

    /* ═══ MAIN RENDER ═══ */
    function render() {
      const x = state.invoice;
      const t = calc();
      const c = x.client;

      let h = '';

      /* ── Nav ── */
      h += '<div class="nav">'
        + '<button class="nav-btn" onclick="history.back()" aria-label="Back">' + I('arrow-left') + '</button>'
        + '<h1>' + esc(x.title) + '</h1>'
        + '<button class="nav-save" onclick="toast(\'Saved\')" aria-label="Save">' + I('check') + '</button>'
        + '</div>';

      /* ── Header: Title + Number + Dates ── */
      h += '<div class="section"><div class="section-label">Details</div>';
      h += '<div class="f"><label>Invoice Title</label><input value="' + esc(x.title) + '" onchange="state.invoice.title=this.value;render()"></div>';
      h += '<div class="f-row">';
      h += '<div class="f"><label>Number</label><input value="' + esc(x.number) + '" onchange="state.invoice.number=this.value"></div>';
      h += '<div class="f"><label>PO Number</label><input value="' + esc(x.poNumber) + '" placeholder="Optional" onchange="state.invoice.poNumber=this.value"></div>';
      h += '</div>';
      h += '<div class="f-row">';
      h += '<div class="f"><label>Issue Date</label><input type="date" value="' + esc(x.date) + '" onchange="state.invoice.date=this.value"></div>';
      h += '<div class="f"><label>Due Date</label><input type="date" value="' + esc(x.dueDate) + '" onchange="state.invoice.dueDate=this.value"></div>';
      h += '</div>';
      h += '</div>';

      /* ── Client ── */
      h += '<div class="section"><div class="section-label">Client</div>';
      if (c) {
        h += '<div class="client-card" onclick="openSheet(\'client\')">'
          + '<div class="client-avatar">' + esc((c.name || '?')[0]) + '</div>'
          + '<div class="client-info"><div class="client-name">' + esc(c.name) + '</div>'
          + '<div class="client-detail">' + esc(c.email || '') + (c.phone ? ' · ' + esc(c.phone) : '') + '</div></div>'
          + '<span class="client-arrow">' + I('chevron-right') + '</span></div>';
      } else {
        h += '<div class="client-card" onclick="openSheet(\'client\')">'
          + '<div class="client-avatar">?</div>'
          + '<div class="client-info"><div class="client-name" style="color:var(--sub)">Select client...</div></div>'
          + '<span class="client-arrow">' + I('chevron-right') + '</span></div>';
      }
      h += '</div>';

      /* ── Quick chips ── */
      h += '<div class="chips">'
        + '<button class="chip" onclick="openSheet(\'type\')">' + I('file-text') + esc(x.type) + '</button>'
        + '<button class="chip" onclick="openSheet(\'vat\')">' + I('percent') + 'VAT ' + (x.vat || 0) + '%</button>'
        + '<button class="chip" onclick="openSheet(\'notes\')">' + I('notebook-text') + 'Notes</button>'
        + '<button class="chip" onclick="openSheet(\'signatory\')">' + I('pen-tool') + 'Signatory</button>'
        + '<button class="chip" onclick="openSheet(\'bank\')">' + I('landmark') + 'Bank</button>'
        + '<button class="chip" onclick="openSheet(\'links\')">' + I('link-2') + 'Links</button>'
        + '<button class="chip" onclick="openSheet(\'charges\')">' + I('plus-circle') + 'Charges</button>'
        + '<button class="chip accent" onclick="openSheet(\'actions\')">' + I('send') + 'Actions</button>'
        + '</div>';

      /* ── Items ── */
      h += '<div class="section"><div class="section-label">Items (' + x.items.length + ')</div>';

      const grouped = {};
      const ungrouped = [];
      x.items.forEach((it, idx) => {
        const card = itemCard(it, idx + 1, idx);
        if (it.groupId) { (grouped[it.groupId] = grouped[it.groupId] || []).push(card); }
        else { ungrouped.push(card); }
      });

      ungrouped.forEach(r => { h += r; });

      x.groups.forEach(g => {
        const items = grouped[g.id] || [];
        const col = g.collapsed;
        h += '<div class="grp">'
          + '<span class="g-icon">' + I('package') + '</span>'
          + '<span class="g-name">' + esc(g.name) + ' (' + items.length + ')</span>'
          + '<button class="g-btn" onclick="toggleGroup(\'' + g.id + '\')">' + I(col ? 'chevron-down' : 'chevron-up') + '</button>'
          + '<button class="g-btn" onclick="ungroup(\'' + g.id + '\')" title="Ungroup">' + I('unlink') + '</button>'
          + '</div>';
        if (!col) items.forEach(r => { h += r; });
      });

      if (!x.items.length) h += '<div class="empty">' + I('package-open') + '<p>No items yet</p></div>';
      h += '<button class="chip" onclick="addItem()" style="width:100%;justify-content:center;height:38px">' + I('plus') + 'Add Item</button>';
      h += '</div>';

      /* ── Totals ── */
      h += '<div class="totals">'
        + '<div class="totals-info">'
        + '<div class="totals-lbl">Total</div>'
        + '<div class="totals-val">' + money(t.total) + '</div>'
        + '<div class="totals-sub">Sub ' + money(t.subtotal) + (x.vat ? ' · VAT ' + x.vat + '%: ' + money(t.vat) : '') + (x.wht ? ' · WHT -' + x.wht + '%: -' + money(t.wht) : '') + '</div>'
        + '</div>'
        + '<button class="totals-send" onclick="openSheet(\'actions\')">' + I('send') + ' Send</button>'
        + '</div>';

      q('#app').innerHTML = h;
      lucide.createIcons();
    }

    /* ═══ ITEM CARD ═══ */
    function itemCard(it, num, idx) {
      const invalid = !it.quantity || it.quantity <= 0 || !it.unit_price || it.unit_price <= 0;
      const lineTotal = (it.quantity || 0) * (it.unit_price || 0);
      return '<div class="item-card' + (invalid ? ' invalid' : '') + '">'
        + '<div class="item-top">'
        + '<span class="item-num">' + num + '</span>'
        + '<span class="item-name">' + esc(it.description || 'Untitled') + '</span>'
        + '<span class="item-amt">' + money(lineTotal) + '</span>'
        + '<span class="item-btns">'
        + '<button onclick="openSheet(\'itemEdit\',' + idx + ')" title="Edit">' + I('pencil') + '</button>'
        + '<button class="del" onclick="removeItem(' + idx + ')" title="Remove">' + I('trash-2') + '</button>'
        + '</span></div></div>';
    }

    /* ═══ SHEET: Client Picker ═══ */
    function shClient() {
      const q2 = (state.searchClient || '').toLowerCase();
      const list = state.savedClients.filter(c => !q2 || c.name.toLowerCase().includes(q2) || (c.email||'').toLowerCase().includes(q2));

    /* ═══ ACTIONS ═══ */
    function pickClient(i) { state.invoice.client = { ...state.savedClients[i] }; closeSheet(); render(); toast('Client selected'); }
    function createClient() {
      const name = q('#ncName').value.trim();
      if (!name) { toast('Name required'); return; }
      const c = { name, email: q('#ncEmail').value.trim(), phone: q('#ncPhone').value.trim(), address: q('#ncAddr').value.trim(), city: q('#ncCity').value.trim(), state: q('#ncState').value.trim() };
      state.savedClients.push(c);
      state.invoice.client = c;
      closeSheet(); render(); toast('Client created');
    }
    function setType(t) { state.invoice.type = t; state.invoice.title = t.charAt(0).toUpperCase() + t.slice(1) + ' Invoice'; closeSheet(); render(); }
    function saveVat() {
      const x = state.invoice;
      x.vat = Number(q('#svVat').value); x.wht = Number(q('#svWht').value); x.whtType = q('#svWhtType').value;
      x.discount = Number(q('#svDisc').value); x.discountType = q('#svDiscType').value; x.discountTiming = q('#svDiscTiming').value;
      closeSheet(); render(); toast('VAT & discounts saved');
    }
    function saveSignatory() { state.invoice.signatory.name = q('#ssName').value.trim(); state.invoice.signatory.title = q('#ssTitle').value.trim(); closeSheet(); render(); toast('Signatory saved'); }
    function saveLinks() {
      state.invoice.links = state.invoice.links.map((_, i) => ({ label: q('#lkLab' + i).value.trim(), url: q('#lkUrl' + i).value.trim() })).filter(l => l.label || l.url);
      closeSheet(); render(); toast('Links saved');
    }
    function addLink() { state.invoice.links.push({ label: '', url: '' }); renderSheetContent(); }
    function removeLink(i) { state.invoice.links.splice(i, 1); renderSheetContent(); }
    function saveBank() { const b = state.invoice.bank; b.name = q('#sbName').value.trim(); b.number = q('#sbNum').value.trim(); b.sortCode = q('#sbSort').value.trim(); closeSheet(); toast('Bank details saved'); }
    function saveNotes() { state.invoice.notes = q('#snNotes').value; state.invoice.terms = q('#snTerms').value; closeSheet(); toast('Notes saved'); }
    function saveCharges() {
      state.invoice.extraCharges = state.invoice.extraCharges.map((_, i) => ({ label: q('#chLab' + i).value.trim(), value: Number(q('#chVal' + i).value) })).filter(c => c.label || c.value);
      closeSheet(); render(); toast('Charges saved');
    }
    function addCharge() { state.invoice.extraCharges.push({ label: '', value: 0 }); renderSheetContent(); }
    function removeCharge(i) { state.invoice.extraCharges.splice(i, 1); renderSheetContent(); }
    function saveFields() {
      state.invoice.additionalFields = state.invoice.additionalFields.map((_, i) => ({ label: q('#afLab' + i).value.trim(), value: q('#afVal' + i).value.trim() })).filter(f => f.label || f.value);
      closeSheet(); toast('Fields saved');
    }
    function addField() { state.invoice.additionalFields.push({ label: '', value: '' }); renderSheetContent(); }
    function removeField(i) { state.invoice.additionalFields.splice(i, 1); renderSheetContent(); }

    function addItem() {
      state.invoice.items.push({ id: 'i' + uid(), description: 'New Item', quantity: 1, unit: 'lot', unit_price: 0, discount_rate: 0, vat_rate: null, groupId: null, image_url: '', make: '', partNo: '', condition: '', sub_description: '' });
      openSheet('itemEdit', state.invoice.items.length - 1);
    }
    function removeItem(idx) { state.invoice.items.splice(idx, 1); render(); toast('Item removed'); }
    function saveItemEdit(idx) {
      const it = state.invoice.items[idx];
      if (!it) return;
      it.description = q('#eiDesc').value.trim() || 'Untitled';
      it.quantity = Math.max(1, Number(q('#eiQty').value));
      it.unit = q('#eiUnit').value.trim() || 'lot';
      it.unit_price = Math.max(0, Number(q('#eiRate').value));
      it.discount_rate = Math.max(0, Math.min(100, Number(q('#eiDisc').value)));
      it.groupId = q('#eiGroup').value || null;
      it.make = q('#eiMake').value.trim();
      it.partNo = q('#eiPart').value.trim();
      it.condition = q('#eiCond').value.trim();
      it.sub_description = q('#eiSub').value;
      closeSheet(); render(); toast('Item saved');
    }
    function toggleGroup(id) { const g = state.invoice.groups.find(a => a.id === id); if (g) g.collapsed = !g.collapsed; render(); }
    function ungroup(id) { state.invoice.items.forEach(a => { if (a.groupId === id) a.groupId = null; }); state.invoice.groups = state.invoice.groups.filter(a => a.id !== id); render(); toast('Group dissolved'); }
    function parseImport() {
      try {
        const data = JSON.parse(q('#siJson').value);
        if (data.items) data.items.forEach(it => {
          state.invoice.items.push({ id: 'i' + uid(), description: it.description || it.name || 'Imported', quantity: it.quantity || 1, unit: it.unit || 'lot', unit_price: it.unit_price || it.rate || 0, discount_rate: it.discount_rate || it.discount || 0, vat_rate: it.vat_rate || null, groupId: null, image_url: '', make: '', partNo: '', condition: '', sub_description: '' });
        });
        closeSheet(); render(); toast('Items imported');
      } catch (e) { toast('Invalid JSON: ' + e.message); }
    }

    /* ═══ INIT ═══ */
    render();
  </script>
</body>
</html>
