<!DOCTYPE html>
<!--
  SETTINGS REDESIGN CANDIDATE v2 — Material Design 3 expression.
  Same 17-section IA as v1 (see settings-live-wireframe.md).
  M3 system: md-sys color roles, typescale labels, shape scale,
  tonal elevation, filled/tonal buttons, M3 switches, segmented
  mode control, snackbar toast. Offline, no build step.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Settings Redesign v2 (M3) — BIGDROPS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --phone-width: 430px;
    --font-ui: 'Roboto Flex', 'Roboto', -apple-system, 'Segoe UI', sans-serif;

    --md-sys-shape-corner-extra-small: 4px;
    --md-sys-shape-corner-small: 8px;
    --md-sys-shape-corner-medium: 12px;
    --md-sys-shape-corner-large: 16px;
    --md-sys-shape-corner-extra-large: 28px;
    --md-sys-shape-corner-full: 9999px;
  }

  html[data-theme="light"] {
    --md-sys-color-primary: #1e3a5f;
    --md-sys-color-on-primary: #ffffff;
    --md-sys-color-primary-container: #d6e2f0;
    --md-sys-color-on-primary-container: #0f172a;
    --md-sys-color-secondary: #475569;
    --md-sys-color-on-secondary: #ffffff;
    --md-sys-color-secondary-container: #e2e8f0;
    --md-sys-color-on-secondary-container: #0f172a;
    --md-sys-color-surface: #f0f4f8;
    --md-sys-color-on-surface: #0f172a;
    --md-sys-color-on-surface-variant: #475569;
    --md-sys-color-surface-container-lowest: #ffffff;
    --md-sys-color-surface-container-low: #f8fafc;
    --md-sys-color-surface-container: #eef2f7;
    --md-sys-color-surface-container-high: #e2e8f0;
    --md-sys-color-error: #ba1a1a;
    --md-sys-color-on-error: #ffffff;
    --md-sys-color-error-container: #ffdad6;
    --md-sys-color-outline: #64748b;
    --md-sys-color-outline-variant: #cbd5e1;
    --md-sys-color-inverse-surface: #0f172a;
    --md-sys-color-inverse-on-surface: #f1f5f9;
    --md-sys-color-success: #16a34a;
  }

  html[data-theme="dark"] {
    --md-sys-color-primary: #9ec1f0;
    --md-sys-color-on-primary: #0f172a;
    --md-sys-color-primary-container: #1e3a5f;
    --md-sys-color-on-primary-container: #d6e2f0;
    --md-sys-color-secondary: #94a3b8;
    --md-sys-color-on-secondary: #0f172a;
    --md-sys-color-secondary-container: #334155;
    --md-sys-color-on-secondary-container: #e2e8f0;
    --md-sys-color-surface: #0f172a;
    --md-sys-color-on-surface: #f1f5f9;
    --md-sys-color-on-surface-variant: #94a3b8;
    --md-sys-color-surface-container-lowest: #0b1220;
    --md-sys-color-surface-container-low: #16213a;
    --md-sys-color-surface-container: #1e293b;
    --md-sys-color-surface-container-high: #334155;
    --md-sys-color-error: #ffb4ab;
    --md-sys-color-on-error: #690005;
    --md-sys-color-error-container: #93000a;
    --md-sys-color-outline: #94a3b8;
    --md-sys-color-outline-variant: #475569;
    --md-sys-color-inverse-surface: #f1f5f9;
    --md-sys-color-inverse-on-surface: #0f172a;
    --md-sys-color-success: #4ade80;
  }

  body {
    font-family: var(--font-ui);
    background: #020617;
    min-height: 100dvh;
    display: flex; justify-content: center;
    padding: 24px 12px 48px;
  }

  .phone {
    width: min(var(--phone-width), 100%);
    height: min(880px, calc(100dvh - 48px));
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    border-radius: 28px;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    border: 1px solid rgba(255,255,255,.12);
  }

  /* M3 small top app bar */
  .appbar {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 4px 8px 8px; flex-shrink: 0;
    background: var(--md-sys-color-surface);
  }
  .appbar h1 { font-size: 22px; font-weight: 500; letter-spacing: 0; flex: 1; padding-left: 8px; }
  .icon-btn {
    width: 48px; height: 48px;
    display: grid; place-items: center;
    border: none; border-radius: var(--md-sys-shape-corner-full);
    background: transparent; color: var(--md-sys-color-on-surface-variant);
    cursor: pointer;
  }
  .icon-btn:active { background: var(--md-sys-color-surface-container-high); }

  .stage { flex: 1; overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
  .view[hidden] { display: none; }

  /* M3 search bar */
  .searchbar {
    display: flex; align-items: center; gap: 8px;
    height: 56px; padding: 0 16px;
    background: var(--md-sys-color-surface-container-high);
    border-radius: var(--md-sys-shape-corner-full);
    color: var(--md-sys-color-on-surface-variant);
    margin: 4px 0 12px;
  }
  .searchbar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 16px; color: var(--md-sys-color-on-surface); min-width: 0;
  }

  .group-title {
    font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-primary);
    padding: 16px 16px 6px;
  }

  /* M3 lists: one-line rows, dividers */
  .md-list {
    background: var(--md-sys-color-surface-container-lowest);
    border-radius: var(--md-sys-shape-corner-medium);
    overflow: hidden;
  }
  .md-row {
    display: flex; align-items: center; gap: 16px;
    width: 100%; min-height: 56px;
    padding: 8px 16px 8px 16px;
    background: none; border: none;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    font-family: inherit; text-align: left;
    cursor: pointer; color: var(--md-sys-color-on-surface);
  }
  .md-row:last-child { border-bottom: none; }
  .md-row:active { background: var(--md-sys-color-surface-container); }
  .md-row .lead { color: var(--md-sys-color-on-surface-variant); flex-shrink: 0; display: grid; place-items: center; }
  .md-row[data-active="true"] .lead { color: var(--md-sys-color-primary); }
  .md-row .t { flex: 1; min-width: 0; }
  .md-row .t b { display: block; font-size: 16px; font-weight: 500; }
  .md-row .t span { display: block; font-size: 14px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md-row .trail { color: var(--md-sys-color-on-surface-variant); flex-shrink: 0; }

  /* Section view */
  .back-row { display: flex; align-items: center; margin: 0 0 2px -8px; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 2px;
    background: none; border: none; cursor: pointer;
    color: var(--md-sys-color-primary); font-family: inherit;
    font-size: 16px; font-weight: 500; padding: 8px;
  }
  .sec-title { font-size: 24px; font-weight: 500; letter-spacing: 0; }
  .sec-desc { margin-top: 4px; font-size: 14px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); }

  /* M3 cards: filled tonal, medium corners, no shadow by default */
  .md-card {
    background: var(--md-sys-color-surface-container-low);
    border-radius: var(--md-sys-shape-corner-medium);
    padding: 16px; margin-top: 16px;
  }
  .md-card h4 { font-size: 14px; font-weight: 500; color: var(--md-sys-color-primary); margin-bottom: 12px; }

  /* M3 outlined text fields */
  .md-field { margin-bottom: 14px; }
  .md-field:last-child { margin-bottom: 0; }
  .md-field label { display: block; font-size: 12px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); margin-bottom: 6px; }
  .md-field input, .md-field select {
    width: 100%; height: 56px;
    border: 1px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-small);
    background: transparent; color: var(--md-sys-color-on-surface);
    font-family: inherit; font-size: 16px; padding: 0 16px; outline: none;
  }
  .md-field input:focus, .md-field select:focus { border: 2px solid var(--md-sys-color-primary); padding: 0 15px; }

  /* M3 switch: 52x32 track, thumb with room */
  .md-switch-row {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid var(--md-sys-color-outline-variant);
  }
  .md-switch-row:last-child { border-bottom: none; }
  .md-switch-row .t { flex: 1; min-width: 0; }
  .md-switch-row .t b { display: block; font-size: 16px; font-weight: 500; }
  .md-switch-row .t span { display: block; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }
  .md-switch {
    width: 52px; height: 32px; flex-shrink: 0;
    border: 2px solid var(--md-sys-color-outline);
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-surface-container-highest, var(--md-sys-color-surface-container-high));
    position: relative; cursor: pointer; padding: 0;
  }
  .md-switch .knob {
    position: absolute; top: 50%; left: 4px; transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--md-sys-color-outline);
    transition: transform .18s ease-out, width .18s ease-out, background .18s;
  }
  .md-switch[aria-checked="true"] { background: var(--md-sys-color-primary); border-color: var(--md-sys-color-primary); }
  .md-switch[aria-checked="true"] .knob { transform: translateY(-50%) translateX(20px); width: 24px; height: 24px; left: 2px; background: var(--md-sys-color-on-primary); }

  /* M3 list rows inside cards (members, banks, archives) */
  .md-item { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
  .md-item:last-child { border-bottom: none; }
  .md-avatar {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
    display: grid; place-items: center; font-size: 14px; font-weight: 500;
  }
  .md-chip {
    font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: var(--md-sys-shape-corner-small);
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
    flex-shrink: 0;
  }
  .md-chip--ok { background: rgba(22,163,74,.14); color: var(--md-sys-color-success, #16a34a); }
  html[data-theme="dark"] .md-chip--ok { background: rgba(74,222,128,.16); }
  .md-chip--err { background: var(--md-sys-color-error-container, rgba(220,38,38,.1)); color: var(--md-sys-color-error); }

  /* Preset carousel */
  .preset-strip { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .preset-strip::-webkit-scrollbar { display: none; }
  .preset {
    flex-shrink: 0; width: 132px; cursor: pointer;
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    overflow: hidden; background: var(--md-sys-color-surface-container-lowest);
    font-family: inherit; padding: 0; text-align: left;
  }
  .preset[data-active="true"] { border: 2px solid var(--md-sys-color-primary); }
  .preset-sw { height: 64px; display: flex; }
  .preset-sw i { flex: 1; }
  .preset-name { display: block; font-size: 13px; font-weight: 500; padding: 8px 12px; color: var(--md-sys-color-on-surface); }

  /* M3 segmented buttons */
  .seg { display: flex; margin-top: 12px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-full); overflow: hidden; }
  .seg button {
    flex: 1; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-on-surface-variant); padding: 10px 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg button + button { border-left: 1px solid var(--md-sys-color-outline); }
  .seg button[data-active="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

  /* M3 buttons: filled full-radius, tonal, text */
  .md-actions { display: flex; gap: 8px; margin-top: 20px; }
  .md-filled {
    flex: 1.6; height: 48px; border: none; cursor: pointer;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
    font-family: inherit; font-size: 15px; font-weight: 500;
  }
  .md-filled:active { filter: brightness(.92); }
  .md-text {
    flex: 1; height: 48px; border: none; cursor: pointer;
    border-radius: var(--md-sys-shape-corner-full);
    background: none; color: var(--md-sys-color-primary);
    font-family: inherit; font-size: 15px; font-weight: 500;
  }
  .md-text:active { background: var(--md-sys-color-surface-container-high); }
  .md-tonal {
    width: 100%; height: 48px; border: none; cursor: pointer;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container);
    font-family: inherit; font-size: 15px; font-weight: 500; margin-top: 12px;
  }
  .md-error-btn {
    width: 100%; height: 48px; border: none; cursor: pointer;
    border-radius: var(--md-sys-shape-corner-full);
    background: var(--md-sys-color-error); color: var(--md-sys-color-on-error);
    font-family: inherit; font-size: 15px; font-weight: 500; margin-top: 12px;
  }

  .md-error-block {
    margin-top: 12px; font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-error);
    background: var(--md-sys-color-error-container, rgba(220,38,38,.08));
    border-radius: var(--md-sys-shape-corner-small); padding: 10px 12px;
  }
  .md-error-block[hidden], .md-ok-block[hidden] { display: none; }
  .md-ok-block {
    margin-top: 12px; font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-success, #16a34a);
    padding: 4px 0;
  }

  .empty { text-align: center; padding: 32px 20px; }
  .empty b { display: block; font-size: 18px; font-weight: 500; margin-top: 12px; }
  .empty p { margin-top: 4px; font-size: 14px; color: var(--md-sys-color-on-surface-variant); }

  .skel { border-radius: 6px; background: var(--md-sys-color-surface-container-high); position: relative; overflow: hidden; }
  .skel::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation: shimmer 1.2s infinite;
  }
  html[data-theme="dark"] .skel::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent); }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* M3 modal bottom sheet */
  .scrim { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; z-index: 42; left: 0; right: 0; bottom: 0;
    max-height: 80%;
    background: var(--md-sys-color-surface-container-low);
    border-radius: var(--md-sys-shape-corner-extra-large) var(--md-sys-shape-corner-extra-large) 0 0;
    transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2,.9,.24,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet.show { transform: translateY(0); }
  .grab { width: 32px; height: 4px; border-radius: 2px; background: var(--md-sys-color-outline-variant); margin: 12px auto 4px; flex-shrink: 0; }
  .sheet-head { padding: 8px 24px 12px; }
  .sheet-head b { font-size: 20px; font-weight: 500; }
  .sheet-body { overflow-y: auto; padding: 0 24px calc(20px + env(safe-area-inset-bottom)); }

  /* M3 basic dialog */
  .dialog {
    position: absolute; z-index: 43;
    left: 28px; right: 28px; top: 50%;
    transform: translateY(-50%) scale(.95);
    background: var(--md-sys-color-surface-container-high);
    border-radius: var(--md-sys-shape-corner-extra-large);
    padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .dialog.show { opacity: 1; pointer-events: auto; transform: translateY(-50%) scale(1); }
  .dialog h3 { font-size: 20px; font-weight: 500; }
  .dialog p { margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--md-sys-color-on-surface-variant); }

  /* M3 snackbar */
  .snackbar {
    position: absolute; z-index: 50;
    left: 16px; right: 16px; bottom: 20px;
    background: var(--md-sys-color-inverse-surface);
    color: var(--md-sys-color-inverse-on-surface);
    border-radius: var(--md-sys-shape-corner-extra-small);
    font-size: 14px; font-weight: 500;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .snackbar.show { opacity: 1; transform: translateY(0); }
  .snackbar button {
    margin-left: auto; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--md-sys-color-inverse-primary, #9ec1f0);
  }
  html[data-theme="light"] .snackbar button { color: #9ec1f0; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .dialog, .snackbar { transition: opacity .15s ease; transform: none !important; }
    .skel::after { animation: none; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="appbar">
    <button class="icon-btn" id="backTopBtn" type="button" aria-label="Back" style="display:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
    </button>
    <h1 id="topTitle">Settings</h1>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark">
      <svg id="themeIconSun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="view" id="view-home">
      <div class="searchbar" role="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="homeSearch" type="search" placeholder="Search settings" aria-label="Search settings">
      </div>
      <div id="homeGroups"></div>
    </div>
    <div class="view" id="view-section" hidden>
      <h2 class="sec-title" id="secTitle" style="font-size:24px"></h2>
      <p class="sec-desc" id="secDesc"></p>
      <div id="secBody"></div>
      <div class="md-actions" id="saveBar" hidden>
        <button class="md-text" type="button" id="cancelBtn">Discard</button>
        <button class="md-filled" type="button" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="bankSheet" role="dialog" aria-label="Bank account">
    <div class="grab"></div>
    <div class="sheet-head"><b id="bankSheetTitle">Add bank account</b></div>
    <div class="sheet-body">
      <div class="md-field"><label>Bank name</label><input type="text" value="First Bank"></div>
      <div class="md-field"><label>Account name</label><input type="text" value="BigDrops Ltd"></div>
      <div class="md-field"><label>Account number</label><input type="text" inputmode="numeric" value="3012345678"></div>
      <div class="md-field"><label>Sort code</label><input type="text" inputmode="numeric" value="011152303"></div>
      <div class="md-actions">
        <button class="md-text" type="button" data-close>Cancel</button>
        <button class="md-filled" type="button" data-close data-toast="Bank account saved">Save</button>
      </div>
    </div>
  </div>

  <div class="dialog" id="inviteDialog" role="alertdialog" aria-label="Invite member">
    <h3>Invite member</h3>
    <p>They join this workspace with the role you choose.</p>
    <div class="md-field" style="margin-top:14px"><label>Email</label><input type="email" id="inviteEmail" placeholder="teammate@company.com"></div>
    <div class="md-field"><label>Role</label><select id="inviteRole"><option>Member</option><option>Admin</option><option>Viewer</option></select></div>
    <div class="md-error-block" id="inviteError" hidden>Email is required to send an invite.</div>
    <div class="md-actions">
      <button class="md-text" type="button" data-close>Cancel</button>
      <button class="md-filled" type="button" id="inviteSend">Send</button>
    </div>
  </div>

  <div class="dialog" id="archiveDialog" role="alertdialog" aria-label="Confirm archive">
    <h3 id="archiveTitle">Archive company?</h3>
    <p>Archived items leave the active list but stay restorable.</p>
    <div class="md-actions">
      <button class="md-text" type="button" data-close>Cancel</button>
      <button class="md-error-btn" type="button" data-close data-toast="Archived. Restore anytime." style="flex:1.6">Archive</button>
    </div>
  </div>

  <div class="snackbar" id="snackbar"><span id="snackText"></span><button type="button" id="snackAction" hidden>Undo</button></div>

    return '<div class="md-switch-row"><div class="t"><b>' + t + '</b><span>' + sub + '</span></div>' +

  function renderHome(filter) {
    var host = document.getElementById('homeGroups');
    host.innerHTML = '';
    var q = (filter || '').trim().toLowerCase();
    GROUPS.forEach(function (g) {
      var items = g.items.filter(function (it) {
        return !q || it.label.toLowerCase().indexOf(q) > -1 || it.sub.toLowerCase().indexOf(q) > -1;
      });
      if (!items.length) return;
      var html = '<div class="group-title">' + g.label + '</div><div class="md-list">';
      items.forEach(function (it) {
        html += '<button class="md-row" type="button" data-section="' + it.id + '">' +
          '<span class="lead">' + icon(it.icon, 22) + '</span>' +
          '<span class="t"><b>' + it.label + '</b><span>' + it.sub + '</span></span>' +

          '</button>';
      });
      html += '</div>';
      host.innerHTML += html;
    });
    if (!host.innerHTML) host.innerHTML = '<div class="empty"><b>No matches</b><p>Try a different search term.</p></div>';
  }

  function skeletonThen(el, html, done) {
    el.innerHTML = '<div class="md-card">' +
      '<div class="skel" style="height:16px;width:45%"></div>' +
      '<div class="skel" style="height:56px;margin-top:10px"></div>' +
      '<div class="skel" style="height:56px;margin-top:10px"></div>' +
      '</div>';
    setTimeout(function () { el.innerHTML = html; bindDynamic(el); if (done) done(); }, 350);
  }

  function bindDynamic(scope) {
    scope.querySelectorAll('[data-switch]').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        btn.setAttribute('aria-checked', String(btn.getAttribute('aria-checked') !== 'true'));
      });
    });
    scope.querySelectorAll('[data-sheet]').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () { openSheet(btn.dataset.sheet); });
    });
    scope.querySelectorAll('[data-dialog]').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () { openDialog(btn.dataset.dialog); });
    });
    scope.querySelectorAll('[data-archive]').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () {
        document.getElementById('archiveTitle').textContent = 'Archive ' + btn.dataset.archive + '?';
        openDialog('archiveDialog');
      });
    });
    scope.querySelectorAll('[data-toast]').forEach(function (btn) {
      if (btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', function () { snack(btn.dataset.toast); });
    });
  }

  function openSection(id) {
    var s = SECTIONS[id];
    if (!s) return;
    document.getElementById('topTitle').textContent = s.title;
    document.getElementById('secTitle').textContent = s.title;
    document.getElementById('secDesc').textContent = s.desc;
    document.getElementById('saveBar').hidden = !s.save;
    document.getElementById('backTopBtn').style.display = '';
    showView('view-section');
    var body = document.getElementById('secBody');
    skeletonThen(body, s.body, function () {
      if (id === 'theme') renderPresets();
      if (id === 'notifications') renderSwitchList('notifRows', NOTIFS);
      if (id === 'dashboard') renderSwitchList('kpiRows', KPIS);
      if (id === 'documents') renderSwitchList('docRows', DOCS);
      if (id === 'prefixes') renderPrefixes();
    });
    document.getElementById('stage').scrollTop = 0;
  }

  function renderSwitchList(hostId, rows) {
    var host = document.getElementById(hostId);
    if (!host) return;
    host.innerHTML = rows.map(function (r) { return switchRow(r[0], r[1], r[2]); }).join('');
    bindDynamic(host.parentNode);
  }

  function renderPrefixes() {
    var host = document.getElementById('prefixRows');
    if (!host) return;
    var card = host.closest('.md-card');
    card.innerHTML = PREFIXES.map(function (p) {
      return '<div class="md-field"><label>' + p[0] + '</label><input type="text" value="' + p[1] + '"></div>';
    }).join('');
  }

  function renderPresets() {

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'preset';
      b.dataset.active = i === 0 ? 'true' : 'false';
      b.innerHTML = '<span class="preset-sw"><i style="background:' + p[1] + '"></i><i style="background:' + p[1] + '"></i><i style="background:' + p[2] + '"></i></span>' +
        '<span class="preset-name">' + p[0] + '</span>';
      b.addEventListener('click', function () {
        host.querySelectorAll('.preset').forEach(function (x) { x.dataset.active = 'false'; });
        b.dataset.active = 'true';
        snack(p[0] + ' applied');
      });
      host.appendChild(b);
    });
  }

  function showView(id) {
    document.getElementById('view-home').hidden = id !== 'view-home';
    document.getElementById('view-section').hidden = id !== 'view-section';
    var home = id === 'view-home';
    document.getElementById('topTitle').textContent = home ? 'Settings' : document.getElementById('secTitle').textContent;
    document.getElementById('backTopBtn').style.display = home ? 'none' : '';
  }

  function snack(msg, action) {
    var s = document.getElementById('snackbar');
    document.getElementById('snackText').textContent = msg;
    var btn = document.getElementById('snackAction');
    btn.hidden = !action;
    if (action) btn.onclick = action;
    s.classList.add('show');
    clearTimeout(s._h);
    s._h = setTimeout(function () { s.classList.remove('show'); }, 2600);
  }

  function openSheet(id) {
    document.getElementById('scrim').classList.add('show');
    document.getElementById(id).classList.add('show');
  }
  function openDialog(id) {
    document.getElementById('scrim').classList.add('show');
    document.getElementById(id).classList.add('show');
  }
  function closeOverlays() {
    document.getElementById('scrim').classList.remove('show');
    document.querySelectorAll('.sheet.show,.dialog.show').forEach(function (el) { el.classList.remove('show'); });
  }

  document.getElementById('scrim').addEventListener('click', closeOverlays);
  document.getElementById('backTopBtn').addEventListener('click', function () { showView('view-home'); });
  document.getElementById('saveBtn').addEventListener('click', function () { snack('Changes saved'); });
  document.getElementById('cancelBtn').addEventListener('click', function () { showView('view-home'); });
  document.getElementById('homeSearch').addEventListener('input', function (e) { renderHome(e.target.value); });
  document.getElementById('homeGroups').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-section]');
    if (btn) openSection(btn.dataset.section);
  });
  document.getElementById('secBody').addEventListener('click', function (e) {
    var segBtn = e.target.closest('#modeSeg button');
    if (!segBtn) return;
    var seg = document.getElementById('modeSeg');
    seg.querySelectorAll('button').forEach(function (x) { x.dataset.active = 'false'; });
    segBtn.dataset.active = 'true';
    snack('Mode: ' + segBtn.textContent);
  });
  document.getElementById('themeToggle').addEventListener('click', function () {
    var html = document.documentElement;
    var dark = html.dataset.theme !== 'dark';
    html.dataset.theme = dark ? 'dark' : 'light';
    document.getElementById('themeIconSun').style.display = dark ? 'none' : '';
    document.getElementById('themeIconMoon').style.display = dark ? '' : 'none';
    snack(dark ? 'Dark preview' : 'Light preview');
  });
  document.getElementById('inviteSend').addEventListener('click', function () {
    var email = document.getElementById('inviteEmail').value.trim();
    var err = document.getElementById('inviteError');
    if (!email || email.indexOf('@') < 0) { err.hidden = false; return; }
    err.hidden = true;
    closeOverlays();
    snack('Invite sent');
  });

  renderHome('');
</script>
</body>
</html>
