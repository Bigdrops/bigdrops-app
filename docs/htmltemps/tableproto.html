<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Table Settings — Stratus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Stratus Design Tokens ── */
:root {
  --primary:    #0F1620;
  --secondary:  #61738C;
  --tertiary:   #F2A03D;
  --neutral:    #EDF1F7;
  --surface:    #FFFFFF;
  --on-primary: #FFFFFF;

  --border:     #D8E0EB;
  --border-2:   #C4CDD9;
  --surface-2:  #F5F7FA;
  --surface-3:  #EDF1F7;

  /* Semantic */
  --red:        #C0392B;
  --red-dim:    rgba(192,57,43,0.08);
  --red-border: rgba(192,57,43,0.22);
  --green:      #1A7A4A;
  --green-dim:  rgba(26,122,74,0.08);
  --green-border: rgba(26,122,74,0.22);
  --amber-dim:  rgba(242,160,61,0.10);

  --r-sm:  6px;
  --r-md:  12px;
  --r-lg:  22px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 32px;

  --shadow: 0 8px 40px rgba(15,22,32,0.12), 0 2px 8px rgba(15,22,32,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Outfit', system-ui, sans-serif;
  font-size: 0.95rem;
  line-height: 1.55;
  background: var(--neutral);
  color: var(--primary);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

/* ── Sheet ── */
.sheet {
  width: 100%;
  max-width: 440px;
  height: 92vh;
  max-height: 840px;
  background: var(--surface);
  border-radius: var(--r-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: sheetIn 0.3s cubic-bezier(0.34,1.4,0.64,1) both;
}
@keyframes sheetIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Header ── */
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 22px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}
.header-left { display: flex; flex-direction: column; gap: 2px; }
.sheet-eyebrow {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--secondary);
  text-transform: uppercase;
}
.sheet-title {
  font-size: 2.1rem;
  font-weight: 400;
  color: var(--primary);
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.sheet-close {
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-2);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--secondary);
  transition: all 0.15s;
  flex-shrink: 0;
}
.sheet-close:hover { background: var(--surface-2); color: var(--primary); }
.sheet-close svg { width: 14px; height: 14px; }

/* ── Body ── */
.sheet-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.sheet-body::-webkit-scrollbar { width: 3px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section ── */
.section { border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-label {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--secondary);
  text-transform: uppercase;
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Row ── */
.row {
  display: flex;
  align-items: center;
  min-height: 48px;
  padding: 8px 12px 8px 16px;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s, opacity 0.25s;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface-2); }
.row.fixed-row { background: var(--surface-2); }
.row.fixed-row:hover { background: var(--surface-3); }
.row.hard-hidden { opacity: 0.35; }
.row.hard-hidden .col-name-input { text-decoration: line-through; text-decoration-color: var(--border-2); color: var(--secondary); }
.row.hard-hidden .col-value-input { text-decoration: line-through; text-decoration-color: var(--border-2); }

/* Grip */
.grip {
  width: 14px; height: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  cursor: grab;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
  user-select: none;
}
.row:hover .grip { opacity: 1; }
.grip:active { cursor: grabbing; }
.grip span { width: 3px; height: 3px; background: var(--secondary); border-radius: 50%; }

/* Reorder */
.reorder-btns { display: flex; flex-direction: column; flex-shrink: 0; }
.reorder-btn {
  width: 18px; height: 14px;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--secondary); transition: color 0.12s; padding: 0;
  border-radius: 3px;
}
.reorder-btn svg { width: 10px; height: 10px; }
.reorder-btn:hover { color: var(--tertiary); }

/* Content */
.col-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.col-name-input {
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--primary);
  border: 1px solid transparent;
  background: transparent;
  padding: 3px 6px;
  border-radius: var(--r-sm);
  width: 100%;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.col-name-input:hover { border-color: var(--border-2); background: var(--surface); }
.col-name-input:focus { border-color: var(--tertiary); background: #FFFDF8; }

.col-value-row { display: flex; align-items: center; gap: 6px; }
.col-value-input {
  font-family: 'Outfit', monospace;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--primary);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  padding: 3px 8px;
  width: 62px;
  outline: none;
  background: var(--surface);
  transition: border-color 0.15s;
}
.col-value-input:focus { border-color: var(--tertiary); }
.col-value-unit { font-size: 0.7rem; font-weight: 500; color: var(--secondary); }

/* Type tag */
.type-tag {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.10em;
  padding: 3px 7px;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  color: var(--secondary);
  border: 1px solid var(--border);
  flex-shrink: 0;
  text-transform: uppercase;
  align-self: flex-start;
  margin-top: 4px;
}

/* Fixed pill */
.fixed-pill {
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.10em;
  padding: 3px 8px;
  background: var(--amber-dim);
  color: var(--tertiary);
  border-radius: 20px;
  border: 1px solid rgba(242,160,61,0.25);
  text-transform: uppercase;
  align-self: flex-start;
  margin-top: 4px;
  flex-shrink: 0;
}

/* Actions */
.row-actions { display: flex; gap: 4px; flex-shrink: 0; align-self: flex-start; margin-top: 3px; }
.action-btn {
  width: 32px; height: 30px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border-2);
  background: var(--surface);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  padding: 0;
}
.action-btn svg { width: 13px; height: 13px; }
.action-btn.eye-show { color: var(--primary); }
.action-btn.eye-show:hover { border-color: var(--secondary); }
.action-btn.eye-hide { color: var(--secondary); background: var(--surface-2); border-color: var(--border); }
.action-btn.x-active { color: var(--red); border-color: var(--red-border); background: var(--red-dim); }
.action-btn.tick-restore { color: var(--green); border-color: var(--green-border); background: var(--green-dim); }
.action-btn.del-btn { color: var(--red); border-color: var(--red-border); background: var(--red-dim); }
.action-btn.del-btn:hover { background: rgba(192,57,43,0.16); }

/* Reset link */
.reset-link {
  display: block;
  width: 100%;
  padding: 10px 20px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: center;
  transition: color 0.15s;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: transparent;
}
.reset-link:hover { color: var(--primary); text-decoration-color: var(--border-2); }

/* Add custom */
.add-custom-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 20px;
  font-family: 'Outfit', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--tertiary);
  cursor: pointer;
  transition: background 0.15s;
  border: none;
  background: transparent;
  width: 100%;
}
.add-custom-btn:hover { background: var(--amber-dim); }
.add-custom-btn svg { width: 14px; height: 14px; }

/* Accordion */
.accordion-header {
  display: flex; align-items: center; justify-content: space-between;
  height: 46px; padding: 0 20px;
  cursor: pointer; user-select: none;
  transition: background 0.12s;
}
.accordion-header:hover { background: var(--surface-2); }
.accordion-title {
  font-size: 0.85rem; font-weight: 600; color: var(--primary);
  display: flex; align-items: center; gap: 8px;
}
.accordion-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.accordion-badge {
  font-size: 0.6rem; font-weight: 600;
  color: var(--red); background: var(--red-dim);
  border: 1px solid var(--red-border);
  padding: 2px 8px; border-radius: 20px;
  letter-spacing: 0.05em;
}
.accordion-chevron {
  width: 14px; height: 14px; color: var(--secondary);
  transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
}
.accordion-chevron.open { transform: rotate(180deg); }

.override-list { display: none; border-top: 1px solid var(--border); }
.override-list.open { display: block; animation: fadeDown 0.18s ease; }
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.override-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; border-bottom: 1px solid var(--border); gap: 12px;
}
.override-item:last-child { border-bottom: none; }
.override-item-name { font-size: 0.82rem; font-weight: 500; color: var(--primary); }
.override-item-detail { font-size: 0.7rem; color: var(--secondary); margin-top: 1px; }
.override-reset-btn {
  font-family: 'Outfit', sans-serif;
  font-size: 0.68rem; font-weight: 600;
  color: var(--red); background: transparent;
  border: 1px solid var(--red-border);
  border-radius: var(--r-sm); padding: 4px 10px;
  cursor: pointer; transition: background 0.15s; flex-shrink: 0;
}
.override-reset-btn:hover { background: var(--red-dim); }

/* Footer */
.sheet-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}
.btn-done {
  font-family: 'Outfit', sans-serif;
  font-size: 0.9rem; font-weight: 600;
  border: none; border-radius: var(--r-md);
  cursor: pointer;
  padding: 13px 20px;
  transition: opacity 0.15s;
  width: 100%;
  text-align: center;
  background: var(--tertiary);
  color: var(--on-primary);
}
.btn-done:hover { opacity: 0.9; }

@keyframes rowIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.row-new { animation: rowIn 0.2s ease both; }
</style>
</head>
<body>
<div class="sheet">

  <!-- Header -->
  <div class="sheet-header">
    <div class="header-left">
      <span class="sheet-eyebrow">Invoice · PDF</span>
      <h2 class="sheet-title">Table Settings</h2>
    </div>
    <button class="sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="sheet-body">

    <!-- Standard PDF — Description (fixed anchor, no eye, editable label) -->
    <div class="section">
      <div class="section-label">Standard PDF</div>
      <div class="row fixed-row">
        <div class="col-content">
          <input class="col-name-input" value="Description" placeholder="Column name" />
        </div>
        <span class="fixed-pill">Fixed</span>
        <span class="type-tag">Text</span>
      </div>
    </div>

    <!-- Form Fields -->
    <div class="section">
      <div class="section-label">Form Fields</div>

      <!-- Quantity — total: eye + X/tick -->
      <div class="row" data-column="quantity" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content"><input class="col-name-input" value="Quantity" /></div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-show" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="action-btn x-active" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Unit Price — total, hard-hidden -->
      <div class="row hard-hidden" data-column="unit_price" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content"><input class="col-name-input" value="Unit Price" /></div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-hide" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.53 6.53A10.01 10.01 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/></svg>
          </button>
          <button class="action-btn tick-restore" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Amount — total: eye + X/tick -->
      <div class="row" data-column="amount" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content"><input class="col-name-input" value="Amount" /></div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-show" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="action-btn x-active" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Make / Brand — non-total: eye only -->
      <div class="row" data-column="make" data-affects-totals="false">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content"><input class="col-name-input" value="Make / Brand" /></div>
        <span class="type-tag">Text</span>
        <div class="row-actions">
          <button class="action-btn eye-show" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Unit — non-total: eye only, hidden -->
      <div class="row" data-column="unit" data-affects-totals="false">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content"><input class="col-name-input" value="Unit" /></div>
        <span class="type-tag">Text</span>
        <div class="row-actions">
          <button class="action-btn eye-hide" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.53 6.53A10.01 10.01 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/></svg>
          </button>
        </div>
      </div>

      <!-- Install Rate — total: eye + X/tick + value -->
      <div class="row" data-column="install_rate" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content">
          <input class="col-name-input" value="Install Rate" />
          <div class="col-value-row">
            <input class="col-value-input" value="0" type="number" step="any" />
            <span class="col-value-unit">multiplier</span>
          </div>
        </div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-hide" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.53 6.53A10.01 10.01 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/></svg>
          </button>
          <button class="action-btn x-active" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- VAT Rate — total: eye + X/tick + value -->
      <div class="row" data-column="vat_rate" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content">
          <input class="col-name-input" value="VAT Rate" />
          <div class="col-value-row">
            <input class="col-value-input" value="7.5" type="number" step="any" />
            <span class="col-value-unit">%</span>
          </div>
        </div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-show" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="action-btn x-active" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Discount Rate — total, hard-hidden: eye + tick + value -->
      <div class="row hard-hidden" data-column="discount_rate" data-affects-totals="true">
        <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="reorder-btns">
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
          <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
        </div>
        <div class="col-content">
          <input class="col-name-input" value="Discount Rate" />
          <div class="col-value-row">
            <input class="col-value-input" value="5" type="number" step="any" />
            <span class="col-value-unit">%</span>
          </div>
        </div>
        <span class="type-tag">Num</span>
        <div class="row-actions">
          <button class="action-btn eye-hide" onclick="toggleEye(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.53 6.53A10.01 10.01 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/></svg>
          </button>
          <button class="action-btn tick-restore" onclick="toggleHardHide(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Custom columns -->
      <div id="customColumnsContainer"></div>

      <!-- Add custom -->
      <button class="add-custom-btn" onclick="addCustomColumn()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Custom Column
      </button>

      <!-- Reset defaults — bottom of section -->
      <button class="reset-link" onclick="if(confirm('Reset all columns to defaults?')) location.reload()">
        Reset to defaults
      </button>
    </div>

    <!-- Row Overrides accordion -->
    <div class="section">
      <div class="accordion-header" onclick="toggleOverrides()">
        <div class="accordion-title">
          <span class="accordion-dot"></span>
          Row Overrides
          <span class="accordion-badge">3 items</span>
        </div>
        <svg class="accordion-chevron" id="overridesChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="override-list" id="overrideList">
        <div class="override-item">
          <div>
            <div class="override-item-name">Item 4 — Distribution board panel</div>
            <div class="override-item-detail">Install Rate → 1.5×</div>
          </div>
          <button class="override-reset-btn">Reset</button>
        </div>
        <div class="override-item">
          <div>
            <div class="override-item-name">Item 7 — PPR pipe</div>
            <div class="override-item-detail">VAT Rate → 5%</div>
          </div>
          <button class="override-reset-btn">Reset</button>
        </div>
        <div class="override-item">
          <div>
            <div class="override-item-name">Item 11 — Copper pipe coil</div>
            <div class="override-item-detail">Discount Rate → 10%</div>
          </div>
          <button class="override-reset-btn">Reset</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer — single Done -->
  <div class="sheet-footer">
    <button class="btn-done">Done</button>
  </div>

</div>

<script>
const EYE_OPEN  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_CLOSE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M6.53 6.53A10.01 10.01 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"/></svg>`;
const X_ICO     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
const TICK_ICO  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

function toggleEye(btn) {
  const showing = btn.classList.contains('eye-show');
  btn.classList.toggle('eye-show', !showing);
  btn.classList.toggle('eye-hide', showing);
  btn.innerHTML = showing ? EYE_CLOSE : EYE_OPEN;
}

function toggleHardHide(btn) {
  const row = btn.closest('.row');
  if (!row) return;
  const restoring = btn.classList.contains('tick-restore');
  if (restoring) {
    row.classList.remove('hard-hidden');
    btn.classList.replace('tick-restore', 'x-active');
    btn.innerHTML = X_ICO;
  } else {
    row.classList.add('hard-hidden');
    btn.classList.replace('x-active', 'tick-restore');
    btn.innerHTML = TICK_ICO;
  }
}

let customCounter = 0;
function addCustomColumn() {
  customCounter++;
  const container = document.getElementById('customColumnsContainer');
  const row = document.createElement('div');
  row.className = 'row row-new';
  row.dataset.custom = 'true';
  row.innerHTML = `
    <div class="grip"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="reorder-btns">
      <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg></button>
      <button class="reorder-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
    <div class="col-content">
      <input class="col-name-input" value="Custom Column ${customCounter}" />
    </div>
    <span class="type-tag">Text</span>
    <div class="row-actions">
      <button class="action-btn eye-show" onclick="toggleEye(this)">${EYE_OPEN}</button>
      <button class="action-btn del-btn" onclick="deleteCustomColumn(this)">${X_ICO}</button>
    </div>
  `;
  container.appendChild(row);
}

function deleteCustomColumn(btn) {
  const row = btn.closest('.row');
  if (row?.dataset.custom === 'true') {
    row.style.transition = 'opacity 0.18s, transform 0.18s';
    row.style.opacity = '0';
    row.style.transform = 'translateX(-8px)';
    setTimeout(() => row.remove(), 200);
  }
}

function toggleOverrides() {
  document.getElementById('overrideList').classList.toggle('open');
  document.getElementById('overridesChevron').classList.toggle('open');
}
</script>
</body>
</html>
