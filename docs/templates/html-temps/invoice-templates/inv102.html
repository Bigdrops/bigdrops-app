<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOUXRE — Commercial Document (A4 Portrait)</title>
<style>
:root{--sage:#7D8A88;--sage-d:#4F5C5A;--sage-dd:#2F3A39;--ink:#23292A;--mute:#5E6967;--tint:#EEF1F0;--tint2:#E2E7E6;--line:#C9D1D0;--clay:#A65A42}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0}
body{background:#d9dedd;color:var(--ink);font:8.6pt/1.42 "Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;padding-top:46px}
.bar{position:fixed;top:0;left:0;right:0;height:46px;background:var(--sage-dd);display:flex;gap:8px;align-items:center;justify-content:center;z-index:9}
.bar button{font:600 12px/1 inherit;font-family:inherit;border:1px solid #7D8A88;background:transparent;color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer}
.bar button.on{background:#7D8A88;color:#14201f}
.bar .pr{margin-left:18px;background:#fff;color:#2F3A39;border-color:#fff}
.sheet{width:210mm;margin:10mm auto;padding:16mm 14mm 14mm;background:#fff;box-shadow:0 1px 12px rgba(0,0,0,.25)}
svg.logo{width:15mm;height:15mm;flex:none;display:block}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm}
.brand{display:flex;gap:4mm;align-items:flex-start;min-width:0}
.co{font:700 13.5pt/1.15 inherit;letter-spacing:-.005em;color:var(--sage-dd)}
.tag{font-size:7.4pt;color:var(--sage-d);font-style:italic;margin:.6mm 0 1.2mm}
.mt{font-size:7.1pt;line-height:1.45;color:var(--mute)}
.badge{text-align:right;flex:none}
.badge .dt{font:700 20pt/1 inherit;letter-spacing:.14em;color:var(--sage-dd)}
.badge .dn{display:inline-block;margin-top:2mm;background:var(--sage-dd);color:#fff;font:600 9.5pt/1 "Courier New",monospace;padding:1.6mm 3mm;border-radius:1mm;letter-spacing:.04em}
.rule{height:1.1mm;background:var(--sage);margin:4mm 0 0}
.rule::after{content:"";display:block;height:.25mm;background:var(--sage);margin-top:.8mm}
.kv{display:grid;gap:0;border-bottom:.25mm solid var(--line)}
.kv.c4{grid-template-columns:repeat(4,1fr)}.kv.c3{grid-template-columns:repeat(3,1fr)}
.kv>div{padding:2mm 2.4mm 1.8mm 0}
.kv>div+div{padding-left:3mm;border-left:.25mm solid var(--line)}
.kl{font:600 6.2pt/1.2 inherit;letter-spacing:.09em;text-transform:uppercase;color:var(--sage-d)}
.kvv{font-weight:600;margin-top:.5mm}
.kv.cust{background:var(--tint)}.kv.cust>div{padding-left:2.4mm}.kv.cust>div+div{padding-left:3mm}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin:4.5mm 0 5mm}
.party{border-top:.7mm solid var(--sage);padding-top:2mm}
.pl{font:700 6.6pt/1.2 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-d)}
.pn{font:700 10.5pt/1.25 inherit;margin:1mm 0 .8mm;color:var(--ink)}
.pt{color:var(--mute);font-size:8pt}
table.items{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:1mm}
table.items thead{display:table-header-group}
table.items th{background:var(--tint2);color:var(--sage-dd);font:700 6.6pt/1.2 inherit;letter-spacing:.08em;text-transform:uppercase;padding:2.1mm 1.6mm;border-top:.5mm solid var(--sage);border-bottom:.3mm solid var(--sage)}
table.items td{padding:1.5mm 1.6mm;border-bottom:.2mm solid var(--line);vertical-align:top}
table.items tr{break-inside:avoid;page-break-inside:avoid}
table.items tbody tr:nth-child(even) td{background:#FAFBFA}
.items .c-n{width:9mm;text-align:center}.items .c-q{width:15mm;text-align:right}.items .c-u{width:15mm;text-align:center}.items .c-p{width:27mm;text-align:right}.items .c-a{width:30mm;text-align:right}
td.n{text-align:center;font:600 8pt "Courier New",monospace;color:var(--sage-d);padding-top:2.6mm}
td.q,td.p,td.a{text-align:right;white-space:nowrap}td.a{font-weight:700}td.u{text-align:center;color:var(--mute)}
.dw{display:flex;gap:2.6mm;align-items:flex-start}
img.th{width:11.5mm;height:11.5mm;flex:none;display:block}
.nm{font-weight:700;line-height:1.3;overflow-wrap:anywhere}.mk{color:var(--sage-d);font-size:7.6pt;margin-top:.3mm}
.sp{color:var(--mute);font-size:7.4pt;line-height:1.38;margin-top:.5mm}
tr.grp td{background:var(--sage)!important;color:#fff;border-bottom:0;padding:1.8mm 2mm;break-after:avoid;page-break-after:avoid}
tr.grp .gt{font:700 7.6pt/1.2 inherit;letter-spacing:.08em;text-transform:uppercase}
tr.grp .gs{text-align:right;font-size:7.4pt}tr.grp .gs b{font-size:8pt}
.fin{break-inside:avoid;page-break-inside:avoid;margin-top:5mm}
.finrow{display:grid;grid-template-columns:1fr 86mm;gap:6mm;align-items:start}
.box{border:.3mm solid var(--line);background:var(--tint);padding:3mm 3.4mm;border-top:.7mm solid var(--sage)}
.box h4{margin:0 0 1.6mm;font:700 6.8pt/1.2 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-d)}
.acct{padding:1.6mm 0;border-top:.2mm dashed var(--line)}.acct:first-of-type{border-top:0;padding-top:0}
.acct .bk{font-weight:700}.acct .an{font:700 11pt/1.2 "Courier New",monospace;letter-spacing:.06em;color:var(--sage-dd)}
.acct .nt{font-size:7pt;color:var(--mute)}
table.tot{width:100%;border-collapse:collapse}
table.tot td{padding:.7mm 0;font-size:8.2pt;border-bottom:.2mm solid var(--line)}table.tot td+td{text-align:right;white-space:nowrap;font-weight:600}
table.tot tr.sum td{font-weight:700;border-top:.3mm solid var(--sage);color:var(--sage-dd)}
table.tot tr.gtt td{background:var(--sage-dd);color:#fff;font:700 10pt/1.2 inherit;padding:1.9mm 2.4mm;border:0}
table.tot tr.gtt td+td{font-size:11.5pt}
.words{margin-top:2mm;border:.3mm solid var(--sage);border-left:1.4mm solid var(--sage);padding:1.8mm 3mm;font-size:7.8pt;background:#fff}
.words .wl{font:700 6.4pt/1.2 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-d)}
.words .wt{font-weight:700;margin-top:.8mm;color:var(--ink)}
h3.sec{font:700 8pt/1.2 inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-dd);border-bottom:.4mm solid var(--sage);padding-bottom:1.2mm;margin:6mm 0 2mm;break-after:avoid;page-break-after:avoid}
.rich{font-size:8.2pt}.rich ul,.rich ol{margin:0;padding-left:4.5mm}.rich li{margin:0 0 1.3mm;break-inside:avoid;page-break-inside:avoid}
.sign{break-inside:avoid;page-break-inside:avoid;margin-top:7mm}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10mm}
.sb .sl{min-height:2.7em;font:700 6.6pt/1.2 inherit;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-d)}
.area{height:28mm;border-bottom:.35mm solid var(--ink);display:flex;align-items:flex-end;margin-top:1.5mm;position:relative}
.area svg.sig{width:52mm;height:26mm;display:block;margin-bottom:.6mm}
.area.blank{border:.3mm dashed var(--sage);border-bottom:.35mm solid var(--ink);background:repeating-linear-gradient(#fff 0 0,#fff 0 0)}
.area.blank span{position:absolute;left:2.4mm;top:1.6mm;font-size:6.6pt;color:var(--sage-d);letter-spacing:.04em}
.sf{font-size:7.6pt;margin-top:1.4mm}.sf b{font-weight:700}.sf .ln{display:inline-block;border-bottom:.25mm solid var(--ink);width:34mm;height:3.6mm;vertical-align:bottom}
.stamp{position:absolute;right:0;bottom:2mm;width:22mm;height:22mm;border:.3mm dashed var(--line);border-radius:50%;font-size:5.6pt;color:var(--sage);text-align:center;display:flex;align-items:center;justify-content:center}
.endnote{margin-top:6mm;font-size:6.6pt;color:var(--mute);text-align:center}
@media print{
 body{background:#fff;padding-top:0}.bar{display:none}
 .sheet{width:auto;margin:0;padding:0;box-shadow:none}
}
</style>
