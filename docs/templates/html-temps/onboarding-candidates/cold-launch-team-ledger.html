<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIGDROPS — The Ledger</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#F2F4F8;
    --desk:#E7EAF0;
    --slate:#5E6A7C;
    --ink:#0C1B33;
    --line:rgba(12,27,51,.12);
    --line-2:rgba(12,27,51,.26);
    --red:#A32E22;
    --cycle:8s;
    --e-move:cubic-bezier(.42,.02,.24,1);
    --e-tick:cubic-bezier(.25,1.3,.4,1);
    --sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);font-family:var(--sans);
    background:linear-gradient(180deg,var(--desk),var(--paper-2));
    -webkit-font-smoothing:antialiased;
  }
  .ledger{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr auto}
  .band{display:flex;align-items:baseline;gap:16px;padding:clamp(14px,3vh,30px) clamp(20px,3.6vw,58px) 10px}
  .band .word{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:clamp(19px,2.2vw,30px);letter-spacing:.4em;text-indent:.4em}
  .band .state{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate)}

  /* the column headings are the functions of the desk, left to right */
  .cols{display:grid;grid-template-columns:16% 22% 22% 22% 18%;padding:0 clamp(20px,3.6vw,58px) 9px;border-bottom:1px solid var(--line-2)}
  .cols span{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--slate)}
  .cols span:last-child{text-align:right}

  .sheet{position:relative;margin:0 clamp(20px,3.6vw,58px);background:var(--paper);border:1px solid var(--line-2);overflow:hidden;min-height:0;
    box-shadow:0 30px 60px -46px rgba(12,27,51,.6)}
  .rules{position:absolute;inset:0;pointer-events:none}
  .rules i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .rules i:nth-child(1){left:16%}.rules i:nth-child(2){left:38%}.rules i:nth-child(3){left:60%}.rules i:nth-child(4){left:82%}
  .rules b{position:absolute;left:0;right:0;height:1px;background:var(--line)}

  /* the tax lane runs beneath the rows and receives every separated portion */
  .vatband{position:absolute;left:0;right:0;bottom:0;height:clamp(74px,16%,120px);background:var(--paper-2);border-top:1px solid var(--line-2)}
  .vatband label{position:absolute;left:14px;top:10px;font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--slate)}
  .vatcells{position:absolute;left:22%;right:6%;top:0;bottom:0;display:flex;align-items:center;gap:2.2%;padding-top:8px}
  .vatcells i{flex:1;height:34px;border:1px dashed var(--line-2);border-radius:3px}
  .vatblocks{position:absolute;inset:0}
  .block{position:absolute;height:26px;background:var(--red);opacity:.82;border-radius:2px;width:7%;
    animation:land 8s cubic-bezier(.3,1,.4,1) infinite}
  @keyframes land{0%{opacity:0;transform:translateY(-40px)}12%{opacity:.82;transform:translateY(0)}
    70%{opacity:.82;transform:translateY(0)}86%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}

  .rows{position:absolute;left:0;right:0;top:0;bottom:clamp(74px,16%,120px)}
  .row{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .row.r1{top:16%}.row.r2{top:38%}.row.r3{top:60%}.row.r4{top:82%}

  /* an entry travelling the desk: the token leads, the record follows */
  .entry{position:absolute;left:0;height:44px;margin-top:-22px;width:11%;display:grid;align-content:center;gap:6px;
    padding:0 10px;background:var(--paper);border:1px solid var(--line-2);
    box-shadow:0 10px 18px -16px rgba(12,27,51,.6);animation:travel var(--cycle) var(--e-move) infinite}
  .entry .ref{width:44%;height:1px;background:var(--line-2)}
  .entry .amt{position:relative;height:8px;background:var(--ink);opacity:.86}
  .entry .tax{position:absolute;left:0;top:0;height:8px;background:var(--red);opacity:0;transform:translateX(0)}
  .entry .ok{position:absolute;right:7px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:0;
    animation:okStamp var(--cycle) var(--e-tick) infinite}
  @keyframes travel{
    0%{transform:translateX(-13vw)}
    14%{transform:translateX(6vw)}
    36%{transform:translateX(28vw)}
    60%{transform:translateX(50vw)}
    84%{transform:translateX(72vw)}
    96%{transform:translateX(93vw);opacity:1}
    100%{transform:translateX(97vw);opacity:0}
  }
  @keyframes okStamp{0%,36%{opacity:0;transform:scale(.5)}39%{opacity:1;transform:scale(1.5)}42%{opacity:1;transform:scale(1)}
    96%{opacity:1}100%{opacity:0}}
  /* the row straddles: the tax portion separates only once the entry reaches the split station */
  .entry .amt{animation:amtCycle var(--cycle) var(--e-move) infinite}
  @keyframes amtCycle{0%,58%{width:100%}64%{width:62%}100%{width:62%}}
  .entry .tax{animation:taxCycle var(--cycle) var(--e-move) infinite}
  @keyframes taxCycle{0%,58%{opacity:0;width:0;transform:translateX(0)}
    62%{opacity:.95;width:12%;transform:translateX(0)}
    66%{opacity:.95;width:12%;transform:translateX(0)}
    78%{opacity:.95;transform:translateX(calc(10vw)) translateY(26vh)}
    86%{opacity:0;transform:translateX(calc(10vw)) translateY(26vh)}
    100%{opacity:0;width:0;transform:translateX(0)}}
  /* the actions inside a row must ride that row's own stagger, or the split and the
     tick fire at the wrong station for every delayed row */
  .entry .amt,.entry .tax,.entry .ok{animation-delay:inherit}

  /* function operators: they confirm each station when the work arrives */
  .op{position:absolute;width:13px;height:13px;border-radius:3px;background:var(--ink);opacity:.14}
  .op.c1{left:30%;top:16%}.op.c2{left:52%;top:38%}.op.c3{left:74%;top:60%}.op.c4{left:90%;top:82%}
  .op i{position:absolute;inset:4px;background:#fff;border-radius:1px;opacity:.9}

  /* a parallel reconcile activity: two ledger halves agree */
  .reconcile{position:absolute;right:1.4%;top:8%;width:12%;display:grid;gap:5px;opacity:.9}
  .reconcile span{height:1px;background:var(--line-2);transform-origin:right;animation:recon var(--cycle) var(--e-tick) infinite}
  .reconcile span:nth-child(2){animation-delay:-1.4s}
  .reconcile span:nth-child(3){animation-delay:-2.8s}
  @keyframes recon{0%{transform:scaleX(.2);opacity:.4}20%{transform:scaleX(1);opacity:1}80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(.2);opacity:.4}}

  /* the footnote — the tip, written into the ledger margin with a bracket */
  .foot{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px clamp(20px,3.6vw,58px) clamp(16px,3.4vh,34px)}
  .bracket{width:14px;height:44px;border-left:2px solid var(--red);border-top:2px solid var(--red);border-bottom:2px solid var(--red);border-radius:3px 0 0 3px}
  .foot .k{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
  .foot p{margin:0;font-size:16px;line-height:1.5;color:var(--ink);max-width:62ch;animation:footIn 5s var(--e-move) infinite}
  @keyframes footIn{0%{opacity:0;transform:translateX(-8px)}9%{opacity:1;transform:none}90%{opacity:1;transform:none}100%{opacity:0;transform:translateX(6px)}}

  @media (max-width:1023px){
    .cols{grid-template-columns:22% 26% 26% 26%;font-size:8px}
    .cols span:last-child{display:none}
    .reconcile{display:none}
    .entry{width:16%}
    .foot p{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .entry{transform:translateX(28vw);opacity:1}
    .entry .amt{width:62%}
    .entry .tax{opacity:.95;width:12%}
    .entry .ok{opacity:1;transform:scale(1)}
    .reconcile span{transform:scaleX(1);opacity:1}
    .foot p{opacity:1;transform:none}
    .block{opacity:.82}
  }
</style>
</head>
<body>
  <div class="ledger">
    <header class="band">
      <div class="word">BIGDROPS</div>
      <div class="state">Returning session — the books are already moving</div>
    </header>

    <div class="cols" aria-hidden="true">
      <span>Entry</span><span>Classify</span><span>Tax separation</span><span>Reconcile</span><span>Filed</span>
    </div>

    <section class="sheet" aria-label="Ledger desk">
      <div class="rules" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
        <b style="top:33%"></b><b style="top:55%"></b><b style="top:77%"></b>
      </div>

      <div class="rows" id="rows" aria-hidden="true"></div>

      <div class="reconcile" aria-hidden="true"><span></span><span></span><span></span></div>

      <div class="vatband" aria-hidden="true">
        <label>Tax lane — separated portions</label>
        <div class="vatcells"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="vatblocks" id="vatblocks"></div>
      </div>
    </section>

    <div class="foot">
      <span class="bracket" aria-hidden="true"></span>
      <div>
        <div class="k">Ledger note — BIGDROPS Tip</div>
        <p role="status" id="tipText">Every recorded payment automatically generates a receipt. View and download it from the Receipts page.</p>
      </div>
    </div>
  </div>

<script>
(function(){
  var rows = document.getElementById("rows");
  var POS = ["16%","38%","60%","82%"];
  rows.innerHTML = POS.map(function(top, i){
    return '<div class="entry" style="top:'+top+';animation-delay:'+(-i*2)+'s">'+
      '<span class="ref"></span><span class="amt"></span><i class="tax"></i><span class="ok"></span></div>';
  }).join("") + POS.map(function(top){
    return '<div class="op" style="top:'+top+'"><i></i></div>';
  }).join("");

  /* the separated tax portions, landing in the lane one after each split */
  document.getElementById("vatblocks").innerHTML = [0,1,2,3,4,5].map(function(i){
    return '<span class="block" style="left:'+(23.5+i*11.6)+'%;bottom:'+((i%3)*22+18)+'px;animation-delay:'+(-i*0.9)+'s"></span>';
  }).join("");

  var TIPS = [
    "Every recorded payment automatically generates a receipt. View and download it from the Receipts page.",
    "Set an expiry date on quotations to automatically flag overdue responses.",
    "Tap the search icon to find any document across all modules. Search by document number, client name, or project name."
  ];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = document.getElementById("tipText");
  var i = 0;
  function swap(){
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
    i = (i + 1) % TIPS.length;
    el.textContent = TIPS[i];
  }
  if(!reduce){ setInterval(swap, 5000); }
})();
</script>
</body>
</html>
