<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIGDROPS — Corridor</title>
<style>
  :root{
    --void:#050B16;
    --navy:#0A1628;
    --structure:#EAF0FA;
    --structure-dim:rgba(234,240,250,.20);
    --glow:#78AEFF;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    --e-cine:cubic-bezier(.4,.02,.62,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--void);color:var(--structure);font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .world{position:fixed;inset:0;overflow:hidden}

  /* the light at the end of the corridor */
  .portal{position:absolute;left:50%;top:50%;width:min(38vw,520px);height:min(38vw,520px);transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(120,174,255,.5) 22%, rgba(20,40,80,.18) 52%, transparent 70%);
    filter:blur(2px);animation:portalBreathe 7.5s var(--e-cine) infinite}
  @keyframes portalBreathe{0%,100%{opacity:.85;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .slit{position:absolute;left:50%;top:50%;width:2px;height:min(46vh,420px);margin-left:-1px;margin-top:min(-23vh,-210px);
    background:linear-gradient(180deg,transparent,#fff,transparent);transform-origin:center;animation:openSlit 1s var(--e-cine) both}
  @keyframes openSlit{
    0%{transform:scaleY(.02) scaleX(.6);opacity:0}
    38%{transform:scaleY(1) scaleX(1);opacity:1}
    70%{transform:scaleY(1) scaleX(1);opacity:1}
    100%{transform:scaleY(1) scaleX(26);opacity:0}
  }

  .space{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 50%}
  .corridor{position:absolute;inset:0;transform-style:preserve-3d;animation:dolly 1.1s linear infinite}
  @keyframes dolly{from{transform:translateZ(0)}to{transform:translateZ(130px)}}

  .bay{
    position:absolute;left:50%;top:50%;
    width:min(66vw,880px);height:min(50vh,420px);
    margin-left:calc(min(66vw,880px) / -2);margin-top:calc(min(50vh,420px) / -2);
    border:1px solid var(--structure-dim);border-radius:3px;
    background:linear-gradient(180deg, rgba(120,174,255,.045), rgba(120,174,255,.012));
    transform:translateZ(calc(var(--z) * -130px));
  }
  .bay::before,.bay::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--structure-dim)}
  .bay::before{left:0}.bay::after{right:0}
  .bay .tag{
    position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--structure);white-space:nowrap;
    animation:tagLight 1.1s linear infinite;animation-delay:calc(var(--i) * -0.11s);
  }
  @keyframes tagLight{0%{opacity:.06}68%{opacity:.85}82%{opacity:1}100%{opacity:.06}}
  .bay .bar{position:absolute;left:0;top:0;height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.35}

  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 50% 50%, transparent 40%, rgba(3,7,15,.72) 100%)}

  /* floor signage — the brand, engraved at the base of the hall */
  .plinth{position:absolute;left:0;right:0;bottom:clamp(18px,4vh,46px);z-index:5;display:grid;justify-items:center;gap:12px;text-align:center}
  .plinth .word{font-weight:300;font-size:clamp(22px,3.6vw,52px);letter-spacing:.58em;text-indent:.58em;color:rgba(255,255,255,.92)}
  .plinth .state{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(234,240,250,.5)}

  /* spatial annotation — the tip, floating in the corridor with a leader line */
  .anno{position:absolute;right:clamp(24px,6vw,110px);top:50%;z-index:6;width:min(34ch,360px);
    transform:translateY(-50%);animation:annoDrift 9.6s var(--e-cine) infinite}
  @keyframes annoDrift{0%,100%{transform:translateY(-50%) translateZ(0) scale(1)}50%{transform:translateY(-54%) scale(1.015)}}
  .leader{position:absolute;right:100%;top:26px;width:clamp(40px,7vw,120px);height:1px;background:linear-gradient(270deg,var(--glow),transparent)}
  .leader::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow)}
  .panelHead{font-family:var(--mono);font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--glow);margin-bottom:10px}
  .anno p{margin:0;font-size:16px;line-height:1.55;color:rgba(234,240,250,.94);border-left:1px solid rgba(120,174,255,.5);padding-left:16px;
    animation:reproject 5.5s var(--e-cine) infinite}
  @keyframes reproject{0%{opacity:0;transform:translateX(10px)}10%{opacity:1;transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-8px)}}
  .ribs{position:absolute;right:0;top:0;bottom:0;width:min(24vw,300px);pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(120,174,255,.10) 0 1px, transparent 1px 42px);opacity:.5;
    animation:ribs 1.1s linear infinite}
  @keyframes ribs{to{background-position:0 42px}}

  @media (max-width:1023px){
    .bay{width:92vw;margin-left:-46vw}
    .plinth .word{letter-spacing:.34em;text-indent:.34em}
    .anno{right:16px;width:min(30ch,74vw)}
    .leader{width:26px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .slit{opacity:0}
    .bay .tag{opacity:.9}
    .anno p{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div class="world">
    <div class="portal" aria-hidden="true"></div>
    <div class="slit" aria-hidden="true"></div>

    <div class="space" aria-hidden="true">
      <div class="corridor" id="corridor"></div>
    </div>

    <div class="ribs" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="plinth">
      <div class="word">BIGDROPS</div>
      <div class="state">Returning session — your workspace is opening</div>
    </div>

    <aside class="anno">
      <div class="leader" aria-hidden="true"></div>
      <div class="panelHead">BIGDROPS Tip</div>
      <p role="status" id="tipText">Every recorded payment automatically generates a receipt. View and download it from the Receipts page.</p>
    </aside>
  </div>

<script>
(function(){
  var MODULES = ["QUOTATIONS","INVOICES","PAYMENTS","RECEIPTS","PROJECTS","CLIENTS","STOCK","TAX","REPORTS","RECORDS","REGISTER","ARCHIVE"];
  var corridor = document.getElementById("corridor");
  var html = "";
  for(var i=0;i<11;i++){
    html += '<div class="bay" style="--z:'+i+';--i:'+i+'"><span class="bar"></span><span class="tag">'+
            MODULES[i % MODULES.length] + '</span></div>';
  }
  corridor.innerHTML = html;

  var TIPS = [
    "Every recorded payment automatically generates a receipt. View and download it from the Receipts page.",
    "Set an expiry date on quotations to automatically flag overdue responses.",
    "Tap the search icon to find any document across all modules. Search by document number, client name, or project name."
  ];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = document.getElementById("tipText");
  var i = 0;
  function swap(){
    el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
    i = (i + 1) % TIPS.length;
    el.textContent = TIPS[i];
  }
  if(!reduce){ setInterval(swap, 5500); }

  /* gentle camera drift — the perspective origin eases, giving parallax without resetting the loop */
  if(!reduce){
    var origin = 50, t0 = performance.now();
    (function drift(now){
      var t = (now - t0) / 1000;
      origin = 50 + Math.sin(t * 0.28) * 3.2;
      document.querySelector(".space").style.perspectiveOrigin = origin + "% 50%";
      requestAnimationFrame(drift);
    })(t0);
  }
})();
</script>
</body>
</html>
