<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIGDROPS — Many Hands</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#F1F3F7;
    --ink:#0C1B33;
    --slate:#6B7789;
    --line:rgba(12,27,51,.16);
    --accent:#2563EB;
    --accent-2:#0E7C6B;
    --cycle:7.2s;
    --e-hand:cubic-bezier(.2,1.25,.35,1);
    --e-put:cubic-bezier(.3,.05,.2,1);
    --sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);font-family:var(--sans);
    background:radial-gradient(90% 70% at 50% 42%, #FFFFFF 40%, var(--paper-2) 100%);
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .field{position:fixed;inset:0}

  .brand{position:absolute;left:22px;top:calc(18px + env(safe-area-inset-top,0px));z-index:20}
  .brand .word{font-size:13px;font-weight:800;letter-spacing:.42em;text-indent:.42em}
  .brand .state{margin-top:7px;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--slate)}

  /* the sheet at the centre of the exchange */
  .stage{position:absolute;left:50%;top:46%;width:min(58vw,300px);aspect-ratio:3/4;transform:translate(-50%,-50%)}
  .sheet{position:absolute;inset:0;background:#fff;border:1px solid var(--line);
    box-shadow:0 20px 40px -32px rgba(12,27,51,.7);
    animation:sheetCycle var(--cycle) var(--e-put) infinite}
  .sheet i{position:absolute;left:14%;height:1px;background:var(--line)}
  .sheet i:nth-of-type(1){top:20%;width:52%}
  .sheet i:nth-of-type(2){top:32%;width:68%}
  .sheet i:nth-of-type(3){top:44%;width:44%}
  .sheet i:nth-of-type(4){top:56%;width:60%}
  .sheet .hd{position:absolute;left:14%;top:9%;width:40%;height:6px;background:var(--ink);opacity:.85}
  /* the sheet is placed, then turned by the second hand, then taken away */
  @keyframes sheetCycle{
    0%{transform:translate(-46%,-6%) rotate(-7deg);opacity:0}
    11%{transform:translate(0,0) rotate(0deg);opacity:1}
    22%{transform:translate(0,0) rotate(0deg)}
    26%{transform:translate(0,0) rotate(-2.4deg);animation-timing-function:var(--e-hand)}
    30%{transform:translate(0,0) rotate(0deg)}
    62%{transform:translate(0,0) rotate(0deg)}
    74%{transform:translate(-30%,-26%) rotate(-9deg);opacity:1}
    82%{opacity:0}
    100%{opacity:0;transform:translate(-46%,-6%) rotate(-7deg)}
  }

  /* the approval mark the second hand turns the sheet to reveal */
  .mark{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%) rotate(-6deg);width:min(30vw,150px);
    border:2.5px solid var(--accent);border-radius:5px;color:var(--accent);text-align:center;
    font-size:clamp(10px,2.9vw,13px);font-weight:800;letter-spacing:.16em;padding:6px 4px;opacity:0;
    animation:markCycle var(--cycle) infinite}
  @keyframes markCycle{0%,26%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(.7)}
    28%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.06)}
    31%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1)}
    84%{opacity:1}
    92%{opacity:0}
    100%{opacity:0}}

  /* the stub torn off by the lower hand */
  .stub{position:absolute;left:50%;top:96%;width:44%;height:34px;background:#fff;border:1px solid var(--line);
    transform:translate(-50%,0);opacity:0;animation:stubCycle var(--cycle) var(--e-put) infinite}
  .stub i{position:absolute;left:12%;right:12%;top:46%;height:1px;background:var(--line)}
  @keyframes stubCycle{0%,44%{opacity:0;transform:translate(-50%,0)}
    48%{opacity:1;transform:translate(-50%,20%)}
    62%{opacity:1;transform:translate(-50%,150%)}
    70%{opacity:1;transform:translate(-50%,150%)}
    76%{opacity:0}
    100%{opacity:0;transform:translate(-50%,0)}}

  /* hands: editorial line art, never filled silhouettes */
  .hand{position:absolute;width:clamp(90px,30%,170px);opacity:0;z-index:8;will-change:transform,opacity}
  .hand svg{width:100%;height:auto;overflow:visible}
  .hand svg *{fill:#fff;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
  .hand .role{position:absolute;left:6px;bottom:-2px;font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:var(--slate)}

  .h1{left:-14px;top:34%;animation:hand1 var(--cycle) var(--e-hand) infinite}
  @keyframes hand1{0%{opacity:0;transform:translate(-40px,10px)}8%{opacity:1;transform:translate(0,0)}
    22%{opacity:1;transform:translate(0,0)}30%{opacity:1;transform:translate(-6px,2px)}
    40%{opacity:0;transform:translate(-40px,8px)}100%{opacity:0;transform:translate(-40px,10px)}}

  .h2{right:-14px;top:30%;animation:hand2 var(--cycle) var(--e-hand) infinite;animation-delay:.1s}
  @keyframes hand2{0%,20%{opacity:0;transform:translate(46px,-6px)}26%{opacity:1;transform:translate(0,0)}
    62%{opacity:1;transform:translate(0,0)}70%{opacity:0;transform:translate(46px,-8px)}100%{opacity:0;transform:translate(46px,-6px)}}

  .h3{left:50%;bottom:-8px;margin-left:-85px;top:auto;animation:hand3 var(--cycle) var(--e-hand) infinite;animation-delay:.15s}
  @keyframes hand3{0%,40%{opacity:0;transform:translate(0,44px)}48%{opacity:1;transform:translate(0,0)}
    70%{opacity:1;transform:translate(0,0)}78%{opacity:0;transform:translate(0,40px)}100%{opacity:0;transform:translate(0,44px)}}

  .h4{left:-14px;top:54%;animation:hand4 var(--cycle) var(--e-hand) infinite;animation-delay:.1s}
  @keyframes hand4{0%,60%{opacity:0;transform:translate(-46px,26px)}68%{opacity:1;transform:translate(0,0)}
    86%{opacity:1;transform:translate(0,0)}94%{opacity:0;transform:translate(-46px,26px)}100%{opacity:0;transform:translate(-46px,26px)}}

  /* a second, smaller exchange keeps running above the main one */
  .slip{position:absolute;left:50%;top:13%;width:64px;height:22px;background:#fff;border:1px solid var(--line);
    transform:translateX(-50%);opacity:0;z-index:6;animation:slipCycle var(--cycle) var(--e-put) infinite;animation-delay:.6s}
  @keyframes slipCycle{0%{opacity:0;transform:translate(-96px,-8px) rotate(-6deg)}
    9%{opacity:1;transform:translate(-40px,0) rotate(0)}
    34%{opacity:1;transform:translate(-40px,0)}
    52%{opacity:1;transform:translate(40px,0)}
    72%{opacity:1;transform:translate(40px,0)}
    80%{opacity:0;transform:translate(96px,-6px) rotate(5deg)}
    100%{opacity:0;transform:translate(-96px,-8px) rotate(-6deg)}}

  /* hands that only join the relay once the surface is wide enough */
  .h5{right:-14px;bottom:6%;top:auto;animation:hand5 var(--cycle) var(--e-hand) infinite;animation-delay:.2s;display:none}
  @keyframes hand5{0%,32%{opacity:0;transform:translate(52px,20px)}40%{opacity:1;transform:translate(0,0)}
    58%{opacity:1;transform:translate(0,0)}66%{opacity:0;transform:translate(52px,20px)}100%{opacity:0}}
  .h6{left:-14px;bottom:14%;top:auto;animation:hand6 var(--cycle) var(--e-hand) infinite;animation-delay:.25s;display:none}
  @keyframes hand6{0%,48%{opacity:0;transform:translate(-52px,-14px)}56%{opacity:1;transform:translate(0,0)}
    74%{opacity:1;transform:translate(0,0)}82%{opacity:0;transform:translate(-52px,-14px)}100%{opacity:0}}

  /* the tip is handed to the viewer: a note turned to face the camera */
  .note{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;
    width:min(86vw,430px);transform:translateX(-50%);perspective:900px}
  .noteCard{position:relative;background:#fff;border:1px solid var(--ink);padding:14px 18px 16px;
    transform-origin:left center;animation:noteTurn 5s var(--e-put) infinite;box-shadow:0 16px 30px -26px rgba(12,27,51,.8)}
  @keyframes noteTurn{
    0%{opacity:0;transform:rotateY(-62deg) translateX(-16px)}
    12%{opacity:1;transform:rotateY(0deg)}
    90%{opacity:1;transform:rotateY(0deg)}
    100%{opacity:0;transform:rotateY(10deg) translateX(10px)}
  }
  .noteCard .k{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  .noteCard p{margin:0;font-size:15px;line-height:1.5;color:var(--ink);max-width:42ch}
  .noteHand{position:absolute;left:-30px;bottom:-12px;width:74px;height:auto}
  .noteHand *{fill:#fff;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}

  @media (min-width:640px){
    /* fold: the exchange moves left and the second relay group joins from the outer edges */
    .stage{left:32%;width:min(30vw,320px);top:44%}
    .h5,.h6{display:block}
    .hand{width:min(15vw,180px)}
    .note{left:auto;right:clamp(22px,4vw,56px);bottom:auto;top:50%;transform:translateY(-50%);width:min(32ch,calc(50vw - 70px))}
    .brand{left:clamp(26px,4vw,56px)}
    .noteCard p{font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .sheet{transform:none;opacity:1}
    .mark{opacity:1;transform:translate(-50%,-50%) rotate(-6deg)}
    .stub{opacity:1;transform:translate(-50%,20%)}
    .h1{opacity:1;transform:none}.h2{opacity:1;transform:none}.h3{opacity:1;transform:none}
    .h4{opacity:1;transform:none}.h5{opacity:1;transform:none}.h6{opacity:1;transform:none}
    .slip{opacity:1;transform:translateX(-50%)}
    .noteCard{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <div class="field">
    <header class="brand">
      <div class="word">BIGDROPS</div>
      <div class="state">Returning session — the team is already hands-on</div>
    </header>

    <div class="stage" aria-hidden="true">
      <div class="sheet"><span class="hd"></span><i></i><i></i><i></i><i></i></div>
      <div class="mark">REVIEWED</div>
      <div class="stub"><i></i></div>
    </div>

    <div class="slip" aria-hidden="true"></div>

    <div class="hand h1" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <rect x="0" y="34" width="66" height="42" rx="20"/>
        <rect x="56" y="16" width="78" height="16" rx="8"/>
        <rect x="58" y="40" width="86" height="16" rx="8"/>
        <rect x="56" y="64" width="76" height="16" rx="8"/>
        <rect x="50" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role">PREPARE</span>
    </div>

    <div class="hand h2" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <rect x="84" y="34" width="66" height="42" rx="20"/>
        <rect x="16" y="16" width="78" height="16" rx="8"/>
        <rect x="6" y="40" width="86" height="16" rx="8"/>
        <rect x="18" y="64" width="76" height="16" rx="8"/>
        <rect x="46" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role" style="left:auto;right:6px">REVIEW</span>
    </div>

    <div class="hand h3" aria-hidden="true">
      <svg viewBox="0 0 150 110" style="transform:rotate(90deg)">
        <rect x="0" y="34" width="66" height="42" rx="20"/>
        <rect x="56" y="16" width="78" height="16" rx="8"/>
        <rect x="58" y="40" width="86" height="16" rx="8"/>
        <rect x="56" y="64" width="76" height="16" rx="8"/>
        <rect x="50" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role" style="left:auto;right:6px;bottom:auto;top:8px">RECEIPT</span>
    </div>

    <div class="hand h4" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <rect x="0" y="34" width="66" height="42" rx="20"/>
        <rect x="56" y="16" width="78" height="16" rx="8"/>
        <rect x="58" y="40" width="86" height="16" rx="8"/>
        <rect x="56" y="64" width="76" height="16" rx="8"/>
        <rect x="50" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role">FILE</span>
    </div>

    <div class="hand h5" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <rect x="84" y="34" width="66" height="42" rx="20"/>
        <rect x="16" y="16" width="78" height="16" rx="8"/>
        <rect x="6" y="40" width="86" height="16" rx="8"/>
        <rect x="18" y="64" width="76" height="16" rx="8"/>
        <rect x="46" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role" style="left:auto;right:6px">RECORDS</span>
    </div>

    <div class="hand h6" aria-hidden="true">
      <svg viewBox="0 0 150 110">
        <rect x="0" y="34" width="66" height="42" rx="20"/>
        <rect x="56" y="16" width="78" height="16" rx="8"/>
        <rect x="58" y="40" width="86" height="16" rx="8"/>
        <rect x="56" y="64" width="76" height="16" rx="8"/>
        <rect x="50" y="86" width="54" height="15" rx="7.5"/>
      </svg>
      <span class="role">CLIENT</span>
    </div>

    <aside class="note">
      <div class="noteCard">
        <div class="k">Handed to you — BIGDROPS Tip</div>
        <p role="status" id="tipText">Every recorded payment automatically generates a receipt. View and download it from the Receipts page.</p>
      </div>
      <svg class="noteHand" viewBox="0 0 150 110" aria-hidden="true">
        <rect x="84" y="34" width="66" height="42" rx="20"/>
        <rect x="16" y="16" width="78" height="16" rx="8"/>
        <rect x="6" y="40" width="86" height="16" rx="8"/>
        <rect x="18" y="64" width="76" height="16" rx="8"/>
      </svg>
    </aside>
  </div>

<script>
(function(){
  var TIPS = [
    "Every recorded payment automatically generates a receipt. View and download it from the Receipts page.",
    "Set an expiry date on quotations to automatically flag overdue responses.",
    "Tap the search icon to find any document across all modules. Search by document number, client name, or project name."
  ];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = document.getElementById("tipText");
  var card = document.querySelector(".noteCard");
  var i = 0;
  function swap(){
    card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
    i = (i + 1) % TIPS.length;
    el.textContent = TIPS[i];
  }
  if(!reduce){ setInterval(swap, 5000); }
})();
</script>
</body>
</html>
