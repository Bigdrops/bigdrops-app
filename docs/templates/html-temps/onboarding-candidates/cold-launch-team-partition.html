<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIGDROPS — The Partition</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#F1F3F7;
    --desk:#E4E8EE;
    --slate:#5E6A7C;
    --ink:#0C1B33;
    --line:rgba(12,27,51,.13);
    --line-2:rgba(12,27,51,.3);
    --accent:#1D4ED8;
    --sans:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --cycle:5.2s;
    --e-slot:cubic-bezier(.28,1.1,.4,1);
    --e-in:cubic-bezier(.4,.05,.22,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--sans);
    background:linear-gradient(180deg,var(--desk),var(--paper-2));-webkit-font-smoothing:antialiased}
  .frame{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}

  /* the shared spine: one system, serving every workspace */
  .spine{position:relative;z-index:6;background:var(--ink);color:#F2F5FA;
    display:flex;align-items:center;gap:16px;padding:clamp(14px,2.6vh,24px) clamp(20px,3.2vw,54px)}
  .spine .word{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:clamp(17px,2vw,27px);letter-spacing:.42em;text-indent:.42em}
  .spine .state{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(242,245,250,.62);text-align:right}
  .spine .chutes{position:absolute;left:0;right:0;bottom:-13px;display:grid;gap:0;pointer-events:none}
  .spine .chutes span{height:13px;position:relative}
  .spine .chutes span::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}

  /* the wall of separate workspaces */
  .wall{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 clamp(20px,3.2vw,54px);min-height:0}
  .cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;
    display:grid;grid-template-rows:auto 1fr;background:var(--paper)}
  .cell:nth-child(4n){border-right:none}
  .cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;
    animation:cellWork var(--cycle) linear infinite;animation-delay:var(--d,0s)}
  @keyframes cellWork{0%,4%{opacity:0}10%{opacity:.9}40%{opacity:.9}52%{opacity:0}100%{opacity:0}}
  .cell .top{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .cell .top i{width:7px;height:7px;border-radius:2px;background:var(--slate);opacity:.5}
  .cell .top b{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
  .cell .top em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:8px;letter-spacing:.16em;color:var(--slate);opacity:.75}

  .slot{position:relative}
  /* a document enters its own workspace, is confirmed, then settles on its own stack */
  .doc{position:absolute;left:12px;right:12px;top:14px;height:38px;background:var(--paper);border:1px solid var(--line-2);
    box-shadow:0 8px 16px -14px rgba(12,27,51,.7);animation:docIn var(--cycle) var(--e-in) infinite;animation-delay:var(--d,0s)}
  .doc i{position:absolute;left:9px;top:11px;width:52%;height:1px;background:var(--line)}
  .doc i:nth-of-type(2){top:21px;width:38%}
  @keyframes docIn{0%{opacity:0;transform:translateY(-42px)}10%{opacity:1;transform:translateY(0)}
    34%{opacity:1;transform:translateY(0)}48%{opacity:1;transform:translateY(56px) scale(.96)}
    58%{opacity:0;transform:translateY(64px) scale(.96)}100%{opacity:0;transform:translateY(-42px)}}

  .op{position:absolute;right:12px;top:20px;width:14px;height:14px;border-radius:3px;background:var(--accent);
    animation:opTap var(--cycle) var(--e-slot) infinite;animation-delay:var(--d,0s)}
  .op::after{content:"";position:absolute;inset:4px;background:#fff;border-radius:1px}
  @keyframes opTap{0%,12%{opacity:0;transform:translateX(14px)}18%{opacity:1;transform:translateX(0)}
    22%{transform:translateX(0) scale(.78)}26%{transform:translateX(0) scale(1)}
    44%{opacity:1;transform:translateX(0)}52%{opacity:0;transform:translateX(10px)}100%{opacity:0;transform:translateX(14px)}}

  .stack{position:absolute;left:12px;bottom:12px;width:56%;display:grid;gap:3px}
  .stack b{height:5px;background:var(--ink);opacity:.14;transform-origin:left;
    animation:stackGrow var(--cycle) var(--e-in) infinite;animation-delay:var(--d,0s)}
  .stack b:nth-child(2){animation-delay:calc(var(--d,0s) + 1.3s);opacity:.1}
  .stack b:nth-child(3){animation-delay:calc(var(--d,0s) + 2.6s);opacity:.07}
  @keyframes stackGrow{0%,50%{transform:scaleX(.1)}62%,100%{transform:scaleX(1)}}
  .cell .own{position:absolute;right:12px;bottom:14px;font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;color:var(--slate);opacity:.7}

  /* the drawer label — the tip, printed on a drawer that pulls out */
  .drawerwrap{position:relative;padding:clamp(14px,3vh,26px) clamp(20px,3.2vw,54px) clamp(16px,3.4vh,30px)}
  .drawer{position:relative;border:1px solid var(--line-2);border-radius:2px 2px 6px 6px;
    background:linear-gradient(180deg,#fff,var(--paper-2));
    box-shadow:0 18px 34px -28px rgba(12,27,51,.8), inset 0 1px 0 #fff;
    padding:14px 22px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;
    animation:drawerPull 5s var(--e-in) infinite}
  @keyframes drawerPull{0%{transform:translateY(16px)}9%{transform:translateY(0)}90%{transform:translateY(0)}100%{transform:translateY(16px)}}
  .drawer .handle{width:34px;height:8px;border:1px solid var(--slate);border-radius:5px;opacity:.6;margin-top:6px}
  .drawer .k{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .drawer p{margin:0;font-size:16px;line-height:1.5;color:var(--ink);max-width:70ch}
  .drawer .tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--slate);text-transform:uppercase;white-space:nowrap}

  @media (max-width:1180px){
    .wall{grid-template-columns:repeat(3,1fr)}
    .cell:nth-child(4n){border-right:1px solid var(--line)}
    .cell:nth-child(3n){border-right:none}
    .drawer p{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .doc{opacity:1;transform:translateY(0)}
    .op{opacity:1;transform:none}
    .stack b{transform:scaleX(1);opacity:.14}
    .cell::before{opacity:.45}
    .drawer{transform:none}
  }
</style>
</head>
<body>
  <div class="frame">
    <header class="spine">
      <div class="word">BIGDROPS</div>
      <div class="state">Returning session — every workspace, kept separate</div>
      <div class="chutes" id="chutes" aria-hidden="true"></div>
    </header>

    <section class="wall" id="wall" aria-label="Separate workspaces"></section>

    <div class="drawerwrap">
      <div class="drawer">
        <span class="handle" aria-hidden="true"></span>
        <div>
          <div class="k">Drawn from the index — BIGDROPS Tip</div>
          <p role="status" id="tipText">Every recorded payment automatically generates a receipt. View and download it from the Receipts page.</p>
        </div>
        <span class="tag" aria-hidden="true">Own records only</span>
      </div>
    </div>
  </div>

<script>
(function(){
  var COLS = 4, ROWS = 3, TOTAL = COLS * ROWS;
  var wall = document.getElementById("wall");
  var chutes = document.getElementById("chutes");
  var cells = "", ch = "";

  for(var i = 0; i < TOTAL; i++){
    /* neutral identifiers only — no tenant or company names are invented */
    var id = "Workspace " + (i < 9 ? "0" : "") + (i + 1);
    var d = -(i * 0.43).toFixed(2) + "s";
    cells += '<article class="cell" style="--d:'+d+'">'+
      '<div class="top"><i></i><b>'+id+'</b><em>own records</em></div>'+
      '<div class="slot">'+
        '<div class="doc"><i></i><i></i></div>'+
        '<div class="op"></div>'+
        '<div class="stack"><b></b><b></b><b></b></div>'+
        '<span class="own">filed here</span>'+
      '</div>'+
    '</article>';
  }
  for(var c = 0; c < COLS; c++){ ch += '<span></span>'; }
  chutes.innerHTML = ch;
  wall.innerHTML = cells;

  var TIPS = [
    "Every recorded payment automatically generates a receipt. View and download it from the Receipts page.",
    "Set an expiry date on quotations to automatically flag overdue responses.",
    "Tap the search icon to find any document across all modules. Search by document number, client name, or project name."
  ];
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var el = document.getElementById("tipText");
  var dr = document.querySelector(".drawer");
  var i = 0;
  function swap(){
    dr.style.animation = "none"; void dr.offsetWidth; dr.style.animation = "";
    i = (i + 1) % TIPS.length;
    el.textContent = TIPS[i];
  }
  if(!reduce){ setInterval(swap, 5000); }
})();
</script>
</body>
</html>
