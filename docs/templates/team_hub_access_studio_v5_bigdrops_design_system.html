                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-[var(--ink-2)] block mb-1">Target Member</label>
                        <select
                          value={testSimulatorTarget.memberId}
                          onChange={(e) => setTestSimulatorTarget(prev => ({ ...prev, memberId: e.target.value }))}
                          className="w-full px-3.5 py-2.5 rounded-button bg-[var(--surface-raised)] border border-[var(--line-strong)] text-xs font-bold text-[var(--ink)] focus:outline-none"
                        >
                          {members.map(m => (
                            <option key={m.id} value={m.id}>{m.name} ({m.department})</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs font-bold text-[var(--ink-2)] block mb-1">Target Permission Token</label>
                        <select
                          value={testSimulatorTarget.permId}
                          onChange={(e) => setTestSimulatorTarget(prev => ({ ...prev, permId: e.target.value }))}
                          className="w-full px-3.5 py-2.5 rounded-button bg-[var(--surface-raised)] border border-[var(--line-strong)] text-xs font-bold text-[var(--ink)] focus:outline-none"
                        >
                          {PERMISSION_TAXONOMY.flatMap(c => c.items).map(p => (
                            <option key={p.id} value={p.id}>{p.label} [{p.id}]</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    {(() => {
                      const memberObj = members.find(m => m.id === testSimulatorTarget.memberId);
                      const permObj = PERMISSION_TAXONOMY.flatMap(c => c.items).find(p => p.id === testSimulatorTarget.permId);
                      const hasAccess = checkMemberPermission(testSimulatorTarget.memberId, testSimulatorTarget.permId);

                      return (
                        <div className={`p-5 rounded-card border flex flex-col justify-between ${
                          hasAccess ? 'bg-bd-sage/10 border-bd-sage/30 text-[var(--ink)]' : 'bg-bd-rose/10 border-bd-rose/30 text-[var(--ink)]'
                        }`}>
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className="text-[10px] font-extrabold uppercase text-[var(--ink-3)]">Evaluation Result</span>
                              <span className={`px-2.5 py-0.5 rounded-badge text-[10px] font-extrabold uppercase ${
                                hasAccess ? 'bg-bd-sage text-white' : 'bg-bd-rose text-white'
                              }`}>
                                {hasAccess ? 'ACCESS GRANTED ✓' : 'ACCESS DENIED ✕'}
                              </span>
                            </div>

                            <h4 className="text-sm font-extrabold mb-1">{memberObj?.name} ➔ "{permObj?.label}"</h4>
                            <p className="text-xs text-[var(--ink-2)] mb-3">{permObj?.desc}</p>
                          </div>

                          <div className="text-[11px] font-mono-num text-[var(--ink-3)] pt-3 border-t border-[var(--line)]">
                            Evaluated via BIGDROPS RBAC Engine v5
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                </div>
              )}

            </div>

          </main>

          {}
          {/* BOTTOM SHEET: MEMBER ACCESS MANAGEMENT */}
          {selectedMemberDrawer && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-[var(--surface)] w-full sm:max-w-lg max-h-[85vh] rounded-t-sheet p-6 border-t border-[var(--line)] shadow-[var(--shadow-float)] flex flex-col justify-between space-y-4 animate-sheet-up">
                
                {/* Swipe Grab Handle */}
                <div className="w-8 h-1 bg-[var(--surface-strong)] rounded-full mx-auto mb-1"></div>

                <div className="flex items-center justify-between pb-3 border-b border-[var(--line)]">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-full bd-gradient-btn flex items-center justify-center font-bold text-xs">
                      {selectedMemberDrawer.avatar}
                    </div>
                    <div>
                      <h3 className="text-sm font-extrabold text-[var(--ink)]">{selectedMemberDrawer.name}</h3>
                      <p className="text-xs text-[var(--ink-2)]">{selectedMemberDrawer.email}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedMemberDrawer(null)} className="p-1 text-[var(--ink-3)] hover:text-[var(--ink)]">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <div className="overflow-y-auto space-y-3 flex-1 pr-1">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[var(--ink-3)] block">
                    Assigned Roles on Active Entity ({currentCompany.name})
                  </span>

                  {roles.map(role => {
                    const hasRole = selectedMemberDrawer.roleIds.includes(role.id);
                    return (
                      <div key={role.id} className="p-3.5 rounded-card bg-[var(--surface-raised)] border border-[var(--line)] flex items-center justify-between">
                        <div>
                          <span className="text-xs font-bold text-[var(--ink)] block">{role.name}</span>
                          <span className="text-[10px] text-[var(--ink-2)] block">{role.permissions.length} capabilities</span>
                        </div>
                        <button
                          onClick={() => handleToggleMemberRole(selectedMemberDrawer.id, role.id)}
                          className={`px-3 py-1.5 rounded-button text-xs font-bold active-press ${
                            hasRole ? 'bg-bd-sage text-white' : 'bg-[var(--surface)] border border-[var(--line-strong)] text-[var(--ink)]'
                          }`}
                        >
                          {hasRole ? 'Assigned ✓' : '+ Assign'}
                        </button>
                      </div>
                    );
                  })}
                </div>

                <button
                  onClick={() => setSelectedMemberDrawer(null)}
                  className="w-full py-3 rounded-button bd-gradient-btn font-bold text-xs active-press"
                >
                  Done Editing Member
                </button>
              </div>
            </div>
          )}

          {/* MODAL: INVITE MEMBER */}
          {isInviteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm animate-fade-in">
              <div className="bg-[var(--surface)] w-full max-w-md p-6 rounded-card border border-[var(--line)] shadow-[var(--shadow-float)] space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-[var(--ink)]">Invite Member</h3>
                  <button onClick={() => setIsInviteModalOpen(false)} className="text-[var(--ink-3)] hover:text-[var(--ink)]">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast('Dispatched invitation email');
                  setIsInviteModalOpen(false);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-[var(--ink-2)] block mb-1">Email Address</label>
                    <input
                      required
                      type="email"
                      placeholder="e.g. colleague@sunshield.ng"
                      className="w-full px-3.5 py-2.5 rounded-button bg-[var(--surface-raised)] border border-[var(--line-strong)] text-xs text-[var(--ink)] focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-[var(--ink-2)] block mb-1">Initial Role Template</label>
                    <select className="w-full px-3.5 py-2.5 rounded-button bg-[var(--surface-raised)] border border-[var(--line-strong)] text-xs font-bold text-[var(--ink)] focus:outline-none">
                      {roles.map(r => (
                        <option key={r.id} value={r.id}>{r.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsInviteModalOpen(false)}
                      className="px-4 py-2 rounded-button bg-[var(--surface-raised)] text-xs font-bold text-[var(--ink)]"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-button bd-gradient-btn text-xs font-bold active-press"
                    >
                      Send Invitation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
