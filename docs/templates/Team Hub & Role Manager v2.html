            'slide-up': 'slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1)',

            'pop-in': 'popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'pulse-soft': 'pulseSoft 2s infinite ease-in-out',
          },
          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(100%)', opacity: '0.5' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            popIn: {
              '0%': { transform: 'scale(0.92)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' }

    function App() {
      // Data States
      const [roles, setRoles] = useState(INITIAL_ROLES);
      const [members, setMembers] = useState(INITIAL_MEMBERS);
      
      // UI State
      const [activeTab, setActiveTab] = useState('roles'); // 'roles' | 'members' | 'matrix' | 'test'
      const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'table'
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // Modal / Sheet States
      const [editingRole, setEditingRole] = useState(null); // null or role object being edited/created
      const [selectedMember, setSelectedMember] = useState(null); // for member drawer
      const [isInviteModalOpen, setIsInviteModalOpen] = useState(false);
      const [testSimulatorTarget, setTestSimulatorTarget] = useState({ memberId: 'usr-2', permId: 'hardware.config' });

      // Trigger crisp toast alert
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Save or Update Role
      const handleSaveRole = (roleData) => {
        if (!roleData.name.trim()) {
          showToast('Please specify a valid role name.', 'error');
          return;
        }

        if (editingRole && editingRole.id && roles.some(r => r.id === editingRole.id)) {
          // Update Existing Role
          setRoles(prev => prev.map(r => r.id === editingRole.id ? { ...r, ...roleData } : r));
          showToast(`Updated role "${roleData.name}" permissions successfully!`);
        } else {
          // Create New Custom Role
          const newRoleId = `role-${Date.now()}`;
          const newRole = {
            id: newRoleId,
            name: roleData.name,
            desc: roleData.desc || 'Custom created organizational role.',
            color: roleData.color || 'emerald',
            badgeBg: 'bg-emerald-100 text-emerald-800 border-emerald-300',
            isSystem: false,
            permissions: roleData.permissions || []
          };
          setRoles(prev => [...prev, newRole]);
          showToast(`Created new role "${newRole.name}"!`);
        }
        setEditingRole(null);
      };

      // Duplicate Role
      const handleDuplicateRole = (role) => {
        const duplicatedRole = {
          ...role,
          id: `role-${Date.now()}`,
          name: `${role.name} (Copy)`,
          isSystem: false,
        };
        setRoles(prev => [...prev, duplicatedRole]);
        showToast(`Duplicated role as "${duplicatedRole.name}"`);
      };

      // Delete Custom Role
      const handleDeleteRole = (roleId, roleName) => {
        const assignedMembers = members.filter(m => m.roleIds.includes(roleId));
        if (assignedMembers.length > 0) {
          showToast(`Cannot delete "${roleName}". ${assignedMembers.length} member(s) still hold this role!`, 'error');
          return;
        }
        setRoles(prev => prev.filter(r => r.id !== roleId));
        showToast(`Deleted custom role "${roleName}"`, 'info');
      };

      // Handle member role toggle
      const handleToggleMemberRole = (memberId, roleId) => {
        setMembers(prev => prev.map(m => {
          if (m.id !== memberId) return m;
          const has = m.roleIds.includes(roleId);
          const updated = has ? m.roleIds.filter(id => id !== roleId) : [...m.roleIds, roleId];
          const rObj = roles.find(r => r.id === roleId);
          showToast(`${has ? 'Revoked' : 'Assigned'} ${rObj?.name || 'role'} for ${m.name}`);
          return { ...m, roleIds: updated };
        }));

        if (selectedMember && selectedMember.id === memberId) {
          setSelectedMember(prev => ({
            ...prev,
            roleIds: prev.roleIds.includes(roleId) 
              ? prev.roleIds.filter(id => id !== roleId)
              : [...prev.roleIds, roleId]
          }));
        }
      };

      const filteredMembers = useMemo(() => {
        return members.filter(m => {
          const q = searchQuery.toLowerCase();
          return m.name.toLowerCase().includes(q) || 
                 m.email.toLowerCase().includes(q) ||
                 m.department.toLowerCase().includes(q);
        });
      }, [members, searchQuery]);

      // Check if a member has a specific permission via any assigned role
      const checkMemberPermission = (memberId, permId) => {
        const targetMember = members.find(m => m.id === memberId);
        if (!targetMember) return false;
        
        return targetMember.roleIds.some(rId => {
          const rObj = roles.find(r => r.id === rId);
          return rObj ? rObj.permissions.includes(permId) : false;
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          
          {}
          {toast && (
            <div className="fixed top-4 right-4 left-4 sm:left-auto z-50 animate-pop-in flex items-center justify-between gap-3 px-4 py-3 rounded-2xl bg-slate-900 text-white text-xs font-semibold shadow-2xl border border-slate-700">
              <div className="flex items-center gap-2">
                <span className={`w-2.5 h-2.5 rounded-full ${toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-400'} animate-pulse`}></span>

              </div>
              <button onClick={() => setToast(null)} className="p-1 text-slate-400 hover:text-white">

              </button>
            </div>

          {/* Sticky Responsive Header */}

                  {(() => {
                    const memberObj = members.find(m => m.id === testSimulatorTarget.memberId);
                    const permObj = PERMISSION_TAXONOMY.flatMap(cat => cat.items).find(p => p.id === testSimulatorTarget.permId);
                    const hasAccess = checkMemberPermission(testSimulatorTarget.memberId, testSimulatorTarget.permId);

                    return (
                      <div className={`p-5 rounded-2xl border flex flex-col justify-between ${
                        hasAccess 
                          ? 'bg-emerald-50/60 border-emerald-300 text-emerald-950' 
                          : 'bg-rose-50/60 border-rose-300 text-rose-950'
                      }`}>
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-bold uppercase tracking-wider text-slate-500">Evaluation Result</span>
                            <span className={`px-3 py-1 rounded-full text-xs font-extrabold uppercase ${
                              hasAccess ? 'bg-emerald-600 text-white shadow-emerald-glow' : 'bg-rose-600 text-white'
                            }`}>
                              {hasAccess ? 'ACCESS ALLOWED ✓' : 'ACCESS DENIED ✕'}
                            </span>
                          </div>

                          <h4 className="text-base font-extrabold mb-1">
                            {memberObj?.name} attempting to: "{permObj?.label}"
                          </h4>
                          <p className="text-xs opacity-80 mb-4">{permObj?.desc}</p>

                          <div className="text-xs font-medium space-y-1 bg-white/80 p-3 rounded-xl border border-slate-200">
                            <div className="font-bold text-slate-700 mb-1">Evaluated Assigned Roles:</div>
                            {memberObj?.roleIds.map(rId => {
                              const r = roles.find(x => x.id === rId);
                              const grantsIt = r?.permissions.includes(testSimulatorTarget.permId);
                              return (
                                <div key={rId} className="flex items-center justify-between">
                                  <span>• {r?.name}</span>
                                  <span className={`font-bold ${grantsIt ? 'text-emerald-700' : 'text-slate-400'}`}>
                                    {grantsIt ? 'Grants Access' : 'No Policy Match'}
                                  </span>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-200/60 text-[11px] font-medium text-slate-500">
                          Policy evaluation executed via BIGDROPS RBAC Engine v2
                        </div>
                      </div>
                    );
                  })()}
                </div>
              </div>
            )}

          </main>

          {}
          
          {/* MODAL / BOTTOM SHEET: CREATE OR EDIT ROLE */}
          {editingRole && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full sm:max-w-2xl max-h-[90vh] sm:rounded-3xl rounded-t-3xl border border-slate-200 shadow-2xl flex flex-col overflow-hidden animate-slide-up sm:animate-pop-in">
                
                {/* Drag handle for mobile */}
                <div className="w-12 h-1.5 bg-slate-300 rounded-full mx-auto my-2.5 sm:hidden"></div>

                <div className="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">
                      {editingRole.id ? `Edit Role: ${editingRole.name}` : 'Create New Custom Role'}
                    </h3>
                    <p className="text-xs text-slate-500">Configure role identity & policy privileges</p>
                  </div>
                  <button onClick={() => setEditingRole(null)} className="p-1 text-slate-400 hover:text-slate-700">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 overflow-y-auto space-y-5 flex-1">
                  
                  {/* Role Metadata Inputs */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Role Name *</label>
                      <input
                        type="text"
                        value={editingRole.name}
                        onChange={(e) => setEditingRole(prev => ({ ...prev, name: e.target.value }))}
                        placeholder="e.g. Field Inspector"
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Description</label>
                      <input
                        type="text"
                        value={editingRole.desc}
                        onChange={(e) => setEditingRole(prev => ({ ...prev, desc: e.target.value }))}
                        placeholder="Short operational summary..."
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-medium focus:outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>

                  {/* Permission Checkboxes by Category */}
                  <div>
                    <h4 className="text-xs font-black uppercase tracking-wider text-emerald-700 mb-3">
                      Select Entitlement Policies ({editingRole.permissions?.length || 0} selected)
                    </h4>

                    <div className="space-y-4">
                      {PERMISSION_TAXONOMY.map(cat => (
                        <div key={cat.category} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                          <h5 className="text-xs font-extrabold text-slate-900 mb-2">{cat.category}</h5>
                          <div className="space-y-2">
                            {cat.items.map(item => {
                              const checked = editingRole.permissions?.includes(item.id);
                              return (
                                <label
                                  key={item.id}
                                  className={`flex items-start gap-3 p-2.5 rounded-xl border transition-all cursor-pointer ${
                                    checked ? 'bg-white border-emerald-500 shadow-sm' : 'bg-transparent border-transparent hover:bg-white/60'
                                  }`}
                                >
                                  <input
                                    type="checkbox"
                                    checked={checked || false}
                                    onChange={(e) => {
                                      const perms = editingRole.permissions || [];
                                      const updated = e.target.checked
                                        ? [...perms, item.id]
                                        : perms.filter(x => x !== item.id);
                                      setEditingRole(prev => ({ ...prev, permissions: updated }));
                                    }}
                                    className="mt-0.5 accent-emerald-600 w-4 h-4 rounded"
                                  />
                                  <div>
                                    <span className="text-xs font-bold text-slate-900 block">{item.label}</span>
                                    <span className="text-[11px] text-slate-500 block">{item.desc}</span>
                                  </div>
                                </label>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* Footer Controls */}
                <div className="px-6 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end gap-3">
                  <button
                    onClick={() => setEditingRole(null)}
                    className="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-100 active-tap"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleSaveRole(editingRole)}
                    className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-emerald-glow active-tap"
                  >
                    Save Role Template
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL / SHEET: MEMBER ACCESS MANAGEMENT */}
          {selectedMember && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-end bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full sm:max-w-md h-[85vh] sm:h-full p-6 border-l border-slate-200 shadow-2xl flex flex-col justify-between overflow-y-auto rounded-t-3xl sm:rounded-none animate-slide-up sm:animate-fade-in">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-200">
                    <div className="flex items-center gap-3">
                      <div className={`w-10 h-10 rounded-2xl ${selectedMember.avatarBg} flex items-center justify-center font-bold text-sm`}>
                        {selectedMember.avatar}
                      </div>
                      <div>
                        <h3 className="text-base font-extrabold text-slate-900">{selectedMember.name}</h3>
                        <p className="text-xs text-slate-500">{selectedMember.email}</p>
                      </div>
                    </div>
                    <button onClick={() => setSelectedMember(null)} className="p-1 text-slate-400 hover:text-slate-700">
                      <Icon name="cross" className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="py-5 space-y-4">
                    <h4 className="text-xs font-black uppercase tracking-wider text-emerald-700">Assigned Roles Checklist</h4>

                    <div className="space-y-2">
                      {roles.map(role => {
                        const hasRole = selectedMember.roleIds.includes(role.id);
                        return (
                          <div key={role.id} className="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                            <div>
                              <span className="text-xs font-bold text-slate-900 block">{role.name}</span>
                              <span className="text-[10px] text-slate-500 block">{role.permissions.length} capabilities</span>
                            </div>
                            <button
                              onClick={() => handleToggleMemberRole(selectedMember.id, role.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold active-tap ${
                                hasRole
                                  ? 'bg-emerald-600 text-white shadow-sm'
                                  : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'
                              }`}
                            >
                              {hasRole ? 'Assigned ✓' : '+ Assign'}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setSelectedMember(null)}
                  className="w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs active-tap"
                >
                  Done Editing Member
                </button>
              </div>
            </div>
          )}

          {/* MODAL: INVITE MEMBER */}
          {isInviteModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white w-full max-w-md p-6 rounded-3xl border border-slate-200 shadow-2xl relative animate-pop-in">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold">
                      <Icon name="mail" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base font-extrabold text-slate-900">Invite Workspace Member</h3>
                      <p className="text-xs text-slate-500">Send an invitation email with role template</p>
                    </div>
                  </div>
                  <button onClick={() => setIsInviteModalOpen(false)} className="text-slate-400 hover:text-slate-700">
                    <Icon name="cross" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast('Invitation dispatched!');
                  setIsInviteModalOpen(false);
                }} className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Email Address</label>
                    <input
                      required
                      type="email"
                      placeholder="e.g. colleague@company.com"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Primary Role Assignment</label>
                    <select className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-900 font-bold focus:outline-none focus:border-emerald-500">
                      {roles.map(r => (
                        <option key={r.id} value={r.id}>{r.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsInviteModalOpen(false)}
                      className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-xs font-bold text-white shadow-emerald-glow"
                    >
                      Send Invitation
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          <div className="fixed bottom-5 right-5 z-40 sm:hidden">
            <button
              onClick={() => setEditingRole({ name: '', desc: '', color: 'emerald', permissions: [] })}
              className="w-14 h-14 rounded-full bg-emerald-600 text-white flex items-center justify-center shadow-emerald-glow active-tap"
              title="Create Role"
            >
              <Icon name="plus" className="w-7 h-7" />
            </button>
          </div>

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
